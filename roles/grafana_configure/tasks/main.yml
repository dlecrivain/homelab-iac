---
- name: Ensure Grafana's config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /etc/grafana/dashboards

- name: Deploy the Prometheus datasource provisioning file
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  register: grafana_datasource_result

- name: Deploy the dashboard provider config
  ansible.builtin.copy:
    src: dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  register: grafana_provider_result

- name: "Download the community dashboards from grafana.com (fetched at deploy time, not vendored in git - keeps large upstream JSON out of this repo and always current)"
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/latest/download"
    dest: "/etc/grafana/dashboards/{{ item.name }}.json"
    mode: '0644'
    force: true
  become: true
  loop:
    - { id: 1860, name: node-exporter-full }
    - { id: 10347, name: proxmox-pve-exporter }
    - { id: 22381, name: smartctl-exporter }
  loop_control:
    label: "{{ item.name }}"
  register: grafana_dashboard_download_result

- name: "Fix up datasource placeholders in downloaded dashboards. Two distinct issues: (1) grafana.com exports reference their datasource as a literal ${DS_xxx} template token, only ever substituted by Grafana's interactive import wizard, never by file-based provisioning; (2) some dashboards instead use a real ${datasource} template variable (type: datasource, auto-discovery), which also doesn't reliably resolve for a file-provisioned dashboard (stays empty - confirmed live: panels using it stayed blank while sibling panels hardcoding the uid directly worked fine). Since this repo only ever provisions one Prometheus datasource, hardcoding its uid everywhere removes both failure modes at once."
  ansible.builtin.replace:
    path: "/etc/grafana/dashboards/{{ item.name }}.json"
    regexp: '\$\{(DS_[A-Za-z0-9_]+|datasource)\}'
    replace: "prometheus"
  become: true
  loop:
    - { id: 1860, name: node-exporter-full }
    - { id: 10347, name: proxmox-pve-exporter }
    - { id: 22381, name: smartctl-exporter }
  loop_control:
    label: "{{ item.name }}"

- name: "Fix the Proxmox dashboard's Storage usage panel to distinguish nodes (pve_disk_usage_bytes/pve_disk_size_bytes only join pve_storage_info's 'storage' label by default, so nvme_data on pve1/pve2/pve3 all show as an identical, indistinguishable 'nvme_data' legend entry - group_left also pulling pve_storage_info's 'node' label fixes it)"
  ansible.builtin.replace:
    path: /etc/grafana/dashboards/proxmox-pve-exporter.json
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  become: true
  loop:
    - regexp: 'group_left\(storage\) pve_storage_info'
      replace: 'group_left(storage, node) pve_storage_info'
    - regexp: '"\{\{storage\}\}"'
      replace: '"{{ "{{" }}node{{ "}}" }} - {{ "{{" }}storage{{ "}}" }}"'
  loop_control:
    label: "{{ item.regexp }}"

- name: "Fix up the Proxmox dashboard's Current CPU/Current memory/Storage usage/Space allocation panels: (1) enlarge all 4, originally squeezed to 3-4 grid columns wide - moved to their own rows below everything else rather than resized in place, to avoid overlapping neighboring panels that would need repositioning too; (2) Current CPU/memory had no legendFormat, so Grafana displayed the full raw label set (instance=pve-exporter:9221, id=node/pve1, job=...) instead of just the node name - label_replace() extracts pve1/pve2/pve3 from the id label so the legend can show just that; (3) Space allocation showed raw allocated capacity (identical regardless of actual fill level) - switched to the same usage-ratio Storage usage already computes, so it actually reflects how full each storage is"
  block:
    - name: Copy the panel-resize script
      ansible.builtin.copy:
        src: enlarge_proxmox_panels.py
        dest: /tmp/enlarge_proxmox_panels.py
        mode: '0755'

    - name: Run the panel-resize script
      ansible.builtin.command: python3 /tmp/enlarge_proxmox_panels.py /etc/grafana/dashboards/proxmox-pve-exporter.json
      changed_when: "'changed:[]' not in enlarge_proxmox_panels_result.stdout"
      register: enlarge_proxmox_panels_result

    - name: Clean up the panel-resize script
      ansible.builtin.file:
        path: /tmp/enlarge_proxmox_panels.py
        state: absent
  become: true

- name: "Default every dashboard to the last hour (grafana.com exports keep whatever default range their author picked - smartctl_exporter's was 'now-1y', which with a monitoring stack only running a few hours produces a 12h query step where almost none of the sample points land inside the narrow window that actually has data, rendering as empty panels even though the data itself is fine)"
  ansible.builtin.replace:
    path: "/etc/grafana/dashboards/{{ item.name }}.json"
    regexp: '"from": "now-[^"]*"'
    replace: '"from": "now-1h"'
  become: true
  loop:
    - { id: 1860, name: node-exporter-full }
    - { id: 10347, name: proxmox-pve-exporter }
    - { id: 22381, name: smartctl-exporter }
  loop_control:
    label: "{{ item.name }}"

- name: "Switch the smartctl dashboard's NVMe Read/Written panels from cumulative bytes to throughput (rate). A plain regex replace risked also matching the unrelated 'Device Critical Warning' panel, which happens to share the same unit:bytes field elsewhere in the file - a small script targeting the exact panel titles is precise regardless of surrounding structure"
  block:
    - name: Copy the throughput-fix script
      ansible.builtin.copy:
        src: fix_nvme_throughput.py
        dest: /tmp/fix_nvme_throughput.py
        mode: '0755'

    - name: Run the throughput-fix script
      ansible.builtin.command: python3 /tmp/fix_nvme_throughput.py /etc/grafana/dashboards/smartctl-exporter.json
      changed_when: "'changed:True' in fix_nvme_throughput_result.stdout"
      register: fix_nvme_throughput_result

    - name: Clean up the throughput-fix script
      ansible.builtin.file:
        path: /tmp/fix_nvme_throughput.py
        state: absent
  become: true

- name: "Deploy the fleet alerts dashboard (custom, not fetched from grafana.com - queries Prometheus's own ALERTS meta-metric, which carries every alert rule's own labels including severity, so this needs no exporter-specific knowledge and stays correct as alert_rules.yml grows)"
  ansible.builtin.copy:
    src: fleet-alerts.json
    dest: /etc/grafana/dashboards/fleet-alerts.json
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Deploy the admin secrets env file
  ansible.builtin.template:
    src: grafana.env.j2
    dest: /etc/grafana/grafana.env
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true
  register: grafana_secrets_result

- name: Ensure /etc/containers/systemd exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy the Grafana Quadlet unit and data volume
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop:
    - grafana.container
    - grafana_data.volume
  register: grafana_quadlet_result

- name: Determine whether anything actually changed
  ansible.builtin.set_fact:
    grafana_config_changed: >-
      {{
        grafana_datasource_result is changed
        or grafana_provider_result is changed
        or grafana_secrets_result is changed
        or grafana_quadlet_result is changed
      }}

- name: Reload systemd to pick up any config/unit change
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: grafana_config_changed

- name: Restart Grafana to pick up any config/unit change
  ansible.builtin.systemd:
    name: grafana.service
    state: restarted
    enabled: true
  become: true
  when: grafana_config_changed
