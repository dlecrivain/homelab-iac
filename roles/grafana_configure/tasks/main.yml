---
- name: Ensure Grafana's config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /etc/grafana/dashboards

- name: Deploy the Prometheus datasource provisioning file
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  register: grafana_datasource_result

- name: Deploy the dashboard provider config
  ansible.builtin.copy:
    src: dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  register: grafana_provider_result

- name: "Deploy all dashboards (vendored in git, not fetched from grafana.com at deploy time - originally node-exporter-full/smartctl-exporter were downloaded fresh and patched on every run, but that meant a redeploy could silently discard a hand-edit and pull in unreviewed upstream changes at the same time. All 3 are now committed as-is, already carrying every earlier fix baked in (hardcoded datasource uid, 1h default range, smartctl NVMe throughput panels, Proxmox per-node legends/usage-ratio query/hand-customized layout) - a plain file deploy, same as fleet-alerts.json. Vendoring also caught a real bug: node-exporter-full used a differently-named \\${ds_prometheus} placeholder that the old case-sensitive DS_xxx/datasource regex never matched, so ~127 of its panels had been rendering blank the whole time"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/grafana/dashboards/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop:
    - node-exporter-full.json
    - proxmox-pve-exporter.json
    - smartctl-exporter.json
    - fleet-alerts.json
  register: grafana_dashboard_deploy_result

- name: Deploy the admin secrets env file
  ansible.builtin.template:
    src: grafana.env.j2
    dest: /etc/grafana/grafana.env
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true
  register: grafana_secrets_result

- name: Ensure /etc/containers/systemd exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "Deploy the Grafana Quadlet unit (templated so check-image-updates.yml's version bump has something to change - previously a static file with the tag hardcoded in git)"
  ansible.builtin.template:
    src: grafana.container.j2
    dest: /etc/containers/systemd/grafana.container
    owner: root
    group: root
    mode: '0644'
  become: true
  register: grafana_container_result

- name: Deploy the Grafana data volume Quadlet
  ansible.builtin.copy:
    src: grafana_data.volume
    dest: /etc/containers/systemd/grafana_data.volume
    owner: root
    group: root
    mode: '0644'
  become: true
  register: grafana_volume_result

- name: Combine the Grafana Quadlet deploy results for change detection
  ansible.builtin.set_fact:
    grafana_quadlet_result: "{{ {'changed': (grafana_container_result is changed or grafana_volume_result is changed)} }}"

- name: Determine whether anything actually changed
  ansible.builtin.set_fact:
    grafana_config_changed: >-
      {{
        grafana_datasource_result is changed
        or grafana_provider_result is changed
        or grafana_dashboard_deploy_result is changed
        or grafana_secrets_result is changed
        or grafana_quadlet_result is changed
      }}

- name: Reload systemd to pick up any config/unit change
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: grafana_config_changed

- name: Restart Grafana to pick up any config/unit change
  ansible.builtin.systemd:
    name: grafana.service
    state: restarted
    enabled: true
  become: true
  when: grafana_config_changed
