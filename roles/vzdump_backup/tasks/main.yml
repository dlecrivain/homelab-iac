---
- name: Start the vzdump backup
  ansible.builtin.command: >
    vzdump {{ vzdump_vmid }}
    --mode snapshot
    --compress zstd
    --storage {{ vm_backup_storage }}
    --prune-backups keep-last={{ vm_backup_local_retention }}
  register: vzdump_start
  async: 21600
  poll: 0
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Wait for the vzdump backup to complete
  ansible.builtin.async_status:
    jid: "{{ vzdump_start.ansible_job_id }}"
  register: vzdump_job
  until: vzdump_job.finished
  retries: 720
  delay: 30
  ignore_errors: true
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

# async_status has no 'rc' at all while a job is still running, so a genuine timeout would pass
# silently and go on to upload whatever stale archive is left from the previous run.
- name: Fail clearly if the vzdump job errored or never finished in the async window
  ansible.builtin.fail:
    msg: >-
      vzdump of VM {{ vzdump_vmid }} {{ 'failed: ' + (vzdump_job.stderr | default('unknown error')) if (vzdump_job.rc is defined and vzdump_job.rc != 0) else 'did not finish within the 6-hour async window' }}
  when: (vzdump_job.rc is defined and vzdump_job.rc != 0) or not (vzdump_job.finished | default(0) | bool)

- name: Find the newest backup archive for this VM
  ansible.builtin.command: >
    pvesh get /nodes/{{ vm_backup_node }}/storage/{{ vm_backup_storage }}/content
    --content backup
    --output-format json
  register: backup_content
  changed_when: false
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Store the newest archive's volid
  ansible.builtin.set_fact:
    vzdump_latest_volid: >-
      {{
        (backup_content.stdout | from_json)
        | selectattr('vmid', 'equalto', vzdump_vmid | int)
        | sort(attribute='ctime', reverse=true)
        | map(attribute='volid')
        | first
      }}

- name: Resolve the archive's absolute path
  ansible.builtin.command: >
    pvesm path {{ vzdump_latest_volid }}
  register: vzdump_path_result
  changed_when: false
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Measure the archive that was just created
  ansible.builtin.stat:
    path: "{{ vzdump_path_result.stdout | trim }}"
  register: vzdump_archive_stat
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Read the free space left on pCloud
  ansible.builtin.command: "rclone about {{ vm_backup_pcloud_base_path.split(':')[0] }}: --json"
  register: pcloud_about
  changed_when: false
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

# Uploading before removing the previous copy means a failed upload never leaves the VM without an
# off-site backup. That needs room for both copies at once, so when the archive does not fit with a
# margin to spare, the previous copy goes first to make room, as the quota leaves no other choice.
- name: Decide whether the new archive can be uploaded before the old one is removed
  ansible.builtin.set_fact:
    vzdump_upload_first: >-
      {{ (pcloud_about.stdout | from_json).free | int
         > (vzdump_archive_stat.stat.size | int) + (vm_backup_pcloud_free_margin_gib | int) * 1073741824 }}

- name: Say in which order the pCloud upload will happen
  ansible.builtin.debug:
    msg: >-
      {{ vzdump_vm_name }}: archive {{ (vzdump_archive_stat.stat.size / 1073741824) | round(1) }} GiB,
      {{ ((pcloud_about.stdout | from_json).free / 1073741824) | round(1) }} GiB free on pCloud -
      {{ 'uploading before the old copy is removed' if vzdump_upload_first else 'removing the old copy first to make room' }}

- name: Copy the pCloud retention script
  ansible.builtin.copy:
    src: prune_pcloud_backups.py
    dest: /tmp/prune_pcloud_backups.py
    mode: '0755'
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

# Frees space for the new archive, only when it could not be uploaded alongside the old one.
- name: "Prune old pCloud backups, keeping {{ vm_backup_pcloud_retention - 1 }}"
  ansible.builtin.command: >
    python3 /tmp/prune_pcloud_backups.py
    {{ vm_backup_pcloud_base_path }}/{{ vzdump_vm_name }}
    {{ vm_backup_pcloud_retention - 1 }}
  register: pcloud_prune_result
  changed_when: "'removed:0' not in pcloud_prune_result.stdout"
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
  when:
    - not (vzdump_purge_all_others_after_upload | default(false))
    - not vzdump_upload_first

- name: Upload the backup archive to pCloud
  ansible.builtin.command: >
    rclone copy {{ vzdump_path_result.stdout | trim }} {{ vm_backup_pcloud_base_path }}/{{ vzdump_vm_name }}/
  changed_when: true
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

# Only reached if the upload above succeeded. A no-op when the old copies were already removed.
- name: "Prune pCloud backups beyond the {{ vm_backup_pcloud_retention }} to keep"
  ansible.builtin.command: >
    python3 /tmp/prune_pcloud_backups.py
    {{ vm_backup_pcloud_base_path }}/{{ vzdump_vm_name }}
    {{ vm_backup_pcloud_retention }}
  register: pcloud_post_prune_result
  changed_when: "'removed:0' not in pcloud_post_prune_result.stdout"
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
  when: not (vzdump_purge_all_others_after_upload | default(false))

- name: Purge every other pCloud backup for this VM
  ansible.builtin.command: >
    python3 /tmp/prune_pcloud_backups.py
    {{ vm_backup_pcloud_base_path }}/{{ vzdump_vm_name }}
    1
  register: pcloud_purge_all_result
  changed_when: "'removed:0' not in pcloud_purge_all_result.stdout"
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
  when: vzdump_purge_all_others_after_upload | default(false)

- name: Clean up the pCloud retention script
  ansible.builtin.file:
    path: /tmp/prune_pcloud_backups.py
    state: absent
  delegate_to: "{{ vm_backup_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
