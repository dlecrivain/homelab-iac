---
- name: Ensure smartmontools (smartctl) is installed
  ansible.builtin.apt:
    name: smartmontools
    state: present
  become: true

- name: Check whether the pinned smartctl_exporter version is already installed
  ansible.builtin.command: /usr/local/bin/smartctl_exporter --version
  register: smartctl_exporter_existing_version
  changed_when: false
  failed_when: false

- name: "Download and install smartctl_exporter {{ smartctl_exporter_version }} (GitHub release binary)"
  when: smartctl_exporter_version not in (smartctl_exporter_existing_version.stderr | default('') + smartctl_exporter_existing_version.stdout | default(''))
  block:
    - name: Download the smartctl_exporter release tarball
      ansible.builtin.get_url:
        url: "https://github.com/prometheus-community/smartctl_exporter/releases/download/v{{ smartctl_exporter_version }}/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.tar.gz"
        mode: '0644'

    - name: Extract the tarball
      ansible.builtin.unarchive:
        src: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install the smartctl_exporter binary
      ansible.builtin.copy:
        src: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64/smartctl_exporter"
        dest: /usr/local/bin/smartctl_exporter
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      become: true

    - name: Clean up the downloaded tarball and extracted directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.tar.gz"
        - "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64"

- name: Deploy the smartctl_exporter systemd unit
  ansible.builtin.template:
    src: smartctl_exporter.service.j2
    dest: /etc/systemd/system/smartctl_exporter.service
    owner: root
    group: root
    mode: '0644'
  become: true
  register: smartctl_exporter_unit_result

- name: Reload systemd and (re)start smartctl_exporter if anything changed
  become: true
  when: smartctl_exporter_unit_result is changed or (smartctl_exporter_version not in (smartctl_exporter_existing_version.stderr | default('') + smartctl_exporter_existing_version.stdout | default('')))
  block:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and restart smartctl_exporter
      ansible.builtin.systemd:
        name: smartctl_exporter
        enabled: true
        state: restarted
