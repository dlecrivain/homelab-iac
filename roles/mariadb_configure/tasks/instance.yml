---
# The data directory is created by the connecting user and then handed to the container's mysql user, uid 999 inside, which
# is a sub-uid of the connecting user on the host. No owner is given to the task, so that a directory already handed over keeps
# its owner when this runs again.
- name: Create the data directory of {{ db.name }}
  ansible.builtin.file:
    path: "{{ mariadb_root }}/{{ db.name }}/data"
    state: directory
    mode: '0700'

- name: Check whether it already holds a database server
  ansible.builtin.stat:
    path: "{{ mariadb_root }}/{{ db.name }}/data/mysql"
  register: mariadb_cluster
  become: true

- name: Hand an empty data directory to the container's mysql user
  ansible.builtin.command: "podman unshare chown 999:999 {{ mariadb_root }}/{{ db.name }}/data"
  changed_when: true
  when: not mariadb_cluster.stat.exists

# The passwords are generated here, on the host, the first time, and are not shown or stored anywhere else. The image creates
# the database and the user from this file the first time it starts on an empty directory.
- name: Generate the environment file once
  ansible.builtin.shell: |
    set -e
    umask 077
    printf 'MARIADB_ROOT_PASSWORD=%s\nMARIADB_DATABASE={{ db.database }}\nMARIADB_USER={{ db.user }}\nMARIADB_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > {{ mariadb_root }}/{{ db.name }}.env
  args:
    executable: /bin/bash
    creates: "{{ mariadb_root }}/{{ db.name }}.env"
  no_log: true

- name: Deploy the Quadlet unit of {{ db.name }}
  ansible.builtin.template:
    src: mariadb.container.j2
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/mariadb-{{ db.name }}.container"
    mode: '0644'
  register: mariadb_quadlet

- name: Deploy the script of the nightly dump of {{ db.name }}
  ansible.builtin.template:
    src: mariadb-dump.sh.j2
    dest: "{{ mariadb_root }}/dump-{{ db.name }}.sh"
    mode: '0700'

- name: Deploy the nightly dump of {{ db.name }}
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/{{ item | replace('mariadb-dump', 'mariadb-dump-' ~ db.name) }}"
    mode: '0644'
  loop:
    - mariadb-dump.service
    - mariadb-dump.timer
  register: mariadb_dump_units

- name: Reload the user systemd instance to pick up the regenerated units
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when: mariadb_quadlet is changed or mariadb_dump_units is changed

- name: Restart {{ db.name }} after a change
  ansible.builtin.systemd:
    name: "mariadb-{{ db.name }}.service"
    state: restarted
    scope: user
  when: mariadb_quadlet is changed

# The restart above only happens when the unit file changed. A unit that is stopped or failed has to be started too.
- name: Make sure {{ db.name }} is running
  ansible.builtin.systemd:
    name: "mariadb-{{ db.name }}.service"
    state: started
    scope: user

- name: Start the nightly dump of {{ db.name }}
  ansible.builtin.systemd:
    name: "mariadb-dump-{{ db.name }}.timer"
    enabled: true
    state: started
    scope: user

# A rootless container's published port goes through the host's INPUT chain, so firewalld has to allow it, and only to the
# addresses that use the database.
- name: Open {{ db.name }} to its clients only
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ db.port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  become: true
  loop: "{{ db.clients }}"
