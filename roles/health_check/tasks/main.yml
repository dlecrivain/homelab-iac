---
- name: Check that expected containers are up
  ansible.builtin.command: >
    sudo -u {{ health_check_podman_user | default('root') }}
    podman ps --filter name={{ item }} --format "{{ '{{' }}.Status{{ '}}' }}"
  args:
    chdir: /tmp
  register: container_status
  changed_when: false
  loop: "{{ health_check_containers | default([]) }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: "{{ health_check_delegate_to | default(inventory_hostname) }}"
  when: (health_check_containers | default([])) | length > 0

- name: Initialize container health results
  ansible.builtin.set_fact:
    health_check_container_results: []
  when: (health_check_containers | default([])) | length > 0

- name: Record each container's health status
  ansible.builtin.set_fact:
    health_check_container_results: "{{ health_check_container_results + [{'name': item.item, 'status': ('Up' if 'Up' in item.stdout else 'DOWN')}] }}"
  loop: "{{ container_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: (health_check_containers | default([])) | length > 0

- name: Check that the URL responds correctly
  ansible.builtin.uri:
    url: "{{ health_check_url }}"
    status_code: 200
    timeout: 10
    validate_certs: "{{ health_check_validate_certs | default(true) }}"
  when: (health_check_url | default('')) | length > 0
  register: url_check
  retries: "{{ health_check_retries | default(5) }}"
  delay: "{{ health_check_delay | default(10) }}"
  until: (url_check.status | default(0)) == 200
  ignore_errors: true
  delegate_to: "{{ health_check_delegate_to | default(inventory_hostname) }}"

- name: Record URL check status
  ansible.builtin.set_fact:
    health_check_url_status: "{{ 'OK' if (url_check.status | default(0)) == 200 else 'FAILED' }}"
  when: (health_check_url | default('')) | length > 0

- name: Determine all health problems for this host (if any)
  ansible.builtin.set_fact:
    health_check_problems: >-
      {%- set problems = [] -%}
      {%- for c in (health_check_container_results | default([])) -%}
        {%- if c.status == 'DOWN' -%}
          {%- set _ = problems.append('Container ' + c.name + ' is not up') -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if (health_check_url | default('')) | length > 0 and health_check_url_status | default('OK') == 'FAILED' -%}
        {%- set _ = problems.append('URL check failed for ' + health_check_url) -%}
      {%- endif -%}
      {{ problems | join('; ') }}

- name: Fail with every health problem found for this host (only when explicitly requested)
  ansible.builtin.fail:
    msg: "{{ health_check_problems }}"
  when:
    - health_check_fail_on_unhealthy | default(false) | bool
    - health_check_problems | length > 0
