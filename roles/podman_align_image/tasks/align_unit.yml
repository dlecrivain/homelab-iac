---
- name: Align this unit's image to the reference host's exact version
  become: "{{ unit.scope == 'root' }}"
  become_user: root
  block:
    - name: Get current image ID
      ansible.builtin.command: "podman inspect {{ unit.name }} --format '{{ '{{' }}.Image{{ '}}' }}'"
      register: image_before
      changed_when: false

    - name: Get current image version label
      ansible.builtin.command: >
        podman inspect {{ unit.name }} --format '{{ '{{' }} index .Config.Labels "org.opencontainers.image.version" {{ '}}' }}'
      register: version_before
      changed_when: false

    - name: Get the currently configured image tag
      ansible.builtin.command: "podman inspect {{ unit.name }} --format '{{ '{{' }}.ImageName{{ '}}' }}'"
      register: image_tag_before
      changed_when: false

    - name: Pull the reference host's exact image digest
      ansible.builtin.command: "podman pull {{ podman_align_reference_digests[unit.name] }}"
      register: pull_result
      changed_when: "'Copying blob' in pull_result.stdout or 'Copying config' in pull_result.stdout"
      retries: 6
      delay: 10
      until: pull_result.rc == 0

    - name: Tag the pulled digest with the reference host's current tag name
      ansible.builtin.command: "podman tag {{ podman_align_reference_digests[unit.name] }} {{ podman_align_reference_tags[unit.name] }}"
      changed_when: true

    - name: Get image ID after aligning
      ansible.builtin.command: "podman inspect {{ podman_align_reference_tags[unit.name] }} --format '{{ '{{' }}.Id{{ '}}' }}'"
      register: image_after
      changed_when: false

    - name: Get new image version label
      ansible.builtin.command: >
        podman inspect {{ podman_align_reference_tags[unit.name] }} --format '{{ '{{' }} index .Config.Labels "org.opencontainers.image.version" {{ '}}' }}'
      register: version_after
      changed_when: false

    - name: Determine whether this unit actually needs realigning (image content changed, or just the visible tag is stale)
      ansible.builtin.set_fact:
        unit_needs_realign: "{{ (image_after.stdout != image_before.stdout) or (image_tag_before.stdout != podman_align_reference_tags[unit.name]) }}"

    - name: Update this unit's Image= line to match the reference host's tag
      ansible.builtin.replace:
        path: "/etc/containers/systemd/{{ (unit.service_name | default(unit.name)) }}.container"
        regexp: '^Image=.*$'
        replace: "Image={{ podman_align_reference_tags[unit.name] }}"
      when: unit_needs_realign | bool
      register: image_line_updated

    - name: Reload systemd to pick up the Image= change
      ansible.builtin.systemd:
        daemon_reload: true
      when: image_line_updated is changed

    - name: Restart unit if realigned
      ansible.builtin.systemd:
        name: "{{ (unit.service_name | default(unit.name)) }}.service"
        state: restarted
        scope: "{{ 'system' if unit.scope == 'root' else 'user' }}"
      when: unit_needs_realign | bool

    - name: Wait a moment for the unit to stabilize after restart
      ansible.builtin.pause:
        seconds: 5
      when: unit_needs_realign | bool

- name: Record update summary for this unit
  ansible.builtin.set_fact:
    podman_update_summary: >-
      {{ podman_update_summary + [{
        'name': unit.name,
        'updated': (unit_needs_realign | bool),
        'old_version': (version_before.stdout | trim) or image_before.stdout[:12],
        'new_version': (version_after.stdout | trim) or image_after.stdout[:12]
      }] }}
