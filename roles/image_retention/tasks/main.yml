---
# Same become/become_user logic podman_update already uses per-unit (roles/podman_update/tasks/update_unit.yml),
# applied once here, since pruning acts on the host's whole image store rather than one unit. Every
# podman_units entry on a host shares the same scope and become_user, so the first is representative.
# Without it, podman images/rmi would run as the connecting user, which cannot see a rootful store or
# another rootless user's store, and would prune nothing.
- name: Determine become settings for image retention from this host's own podman_units
  ansible.builtin.set_fact:
    image_retention_unit: "{{ podman_units[0] }}"

# A become: keyword can't safely re-reference ansible_user itself (it resolves as undefined there,
# even where the same expression works in when:). podman_update works around it the same way.
- name: Precompute whether this host needs become
  ansible.builtin.set_fact:
    image_retention_become: "{{ image_retention_unit.scope == 'root' or (image_retention_unit.become_user is defined and image_retention_unit.become_user != ansible_user) }}"

- name: Get UID for cross-user rootless image retention
  ansible.builtin.command: "id -u {{ image_retention_unit.become_user }}"
  register: image_retention_uid
  changed_when: false
  when: image_retention_unit.scope == 'user' and image_retention_unit.become_user is defined and image_retention_unit.become_user != ansible_user

- name: Set environment for cross-user rootless podman
  ansible.builtin.set_fact:
    image_retention_env: "{{ {'XDG_RUNTIME_DIR': '/run/user/' + image_retention_uid.stdout, 'DBUS_SESSION_BUS_ADDRESS': 'unix:path=/run/user/' + image_retention_uid.stdout + '/bus'} if (image_retention_unit.scope == 'user' and image_retention_unit.become_user is defined and image_retention_unit.become_user != ansible_user) else {} }}"

- name: Copy the image retention script
  ansible.builtin.copy:
    src: prune_images.py
    dest: /tmp/prune_images.py
    mode: '0755'

- name: Run image retention (keep last 2 per repository)
  ansible.builtin.command: python3 /tmp/prune_images.py
  become: "{{ image_retention_become }}"
  become_user: "{{ 'root' if image_retention_unit.scope == 'root' else (image_retention_unit.become_user | default(omit)) }}"
  environment: "{{ image_retention_env }}"
  register: retention_result
  changed_when: "'removed:0' not in retention_result.stdout"

- name: Clean up the retention script
  ansible.builtin.file:
    path: /tmp/prune_images.py
    state: absent
