---
- name: Check existing snapshots for this VM
  ansible.builtin.command: >
    pvesh get /nodes/{{ proxmox_node }}/qemu/{{ proxmox_vmid }}/snapshot
  delegate_to: "{{ proxmox_api_host }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
  register: existing_snapshot_check
  changed_when: false

- name: Determine if the snapshot already exists
  ansible.builtin.set_fact:
    snapshot_already_exists: "{{ (snapshot_label | default('ansible_patching')) in existing_snapshot_check.stdout }}"

# pvesh create's exit code only confirms the task was submitted, not that the snapshot succeeded:
# it returns rc=0 even when the qmsnapshot task fails. Its real outcome is checked below via UPID.
- name: Create a Proxmox snapshot before update
  ansible.builtin.command: >
    pvesh create /nodes/{{ proxmox_node }}/qemu/{{ proxmox_vmid }}/snapshot
    -snapname {{ snapshot_label | default('ansible_patching') }}
    -description "Automatic snapshot before update via Semaphore"
  delegate_to: "{{ proxmox_api_host }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
  register: snapshot_create_result
  when: not snapshot_already_exists

# pvesh wraps its returned value in double quotes ("UPID:pve3:...:root@pam:"), so a '.*' pattern
# would capture the trailing quote and break shlex parsing of the next pvesh command.
- name: Extract the UPID of the snapshot task just submitted
  ansible.builtin.set_fact:
    snapshot_upid: "{{ snapshot_create_result.stdout | trim | regex_search('UPID:[A-Za-z0-9@_.:-]+') }}"
  when: not snapshot_already_exists

- name: Fail clearly if pvesh create didn't hand back a usable task UPID
  ansible.builtin.fail:
    msg: "Snapshot creation for VM {{ proxmox_vmid }} didn't return a usable task UPID. Raw pvesh output: {{ snapshot_create_result.stdout }}"
  when:
    - not snapshot_already_exists
    - not snapshot_upid

# Its own exitstatus, not pvesh create's rc, which doesn't reflect it.
- name: Check the snapshot task's actual outcome
  ansible.builtin.command: >
    pvesh get /nodes/{{ proxmox_node }}/tasks/{{ snapshot_upid }}/status
    --output-format json
  delegate_to: "{{ proxmox_api_host }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
  register: snapshot_task_status
  changed_when: false
  when: not snapshot_already_exists

# Storage that doesn't support snapshots at all is handled below instead of aborting.
- name: Fail clearly if the snapshot task genuinely failed
  ansible.builtin.fail:
    msg: "Snapshot creation for VM {{ proxmox_vmid }} failed: {{ (snapshot_task_status.stdout | from_json).exitstatus }}"
  when:
    - not snapshot_already_exists
    - (snapshot_task_status.stdout | from_json).exitstatus != 'OK'
    - "'snapshot feature is not available' not in (snapshot_task_status.stdout | from_json).exitstatus"

# So later steps don't try to clean up a snapshot that was never created.
- name: Record that this VM's storage doesn't support snapshots
  ansible.builtin.set_fact:
    snapshot_unsupported: true
  when:
    - not snapshot_already_exists
    - (snapshot_task_status.stdout | from_json).exitstatus != 'OK'

- name: Store the snapshot name for later deletion
  ansible.builtin.set_fact:
    snapshot_name: "{{ snapshot_label | default('ansible_patching') }}"
  when: not snapshot_already_exists and not (snapshot_unsupported | default(false))
