---
# The login shell only forwards a fixed list of verbs to one root-owned script through one sudoers rule, so the
# account reads a host but cannot change it. claude_readonly_public_key is the public key of the fleet account
# on claude101.
- name: Install the script that runs the verbs
  ansible.builtin.copy:
    src: claude-ro-tools
    dest: /usr/local/sbin/claude-ro-tools
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install the login shell of the account
  ansible.builtin.copy:
    src: claude-ro-shell
    dest: /usr/local/sbin/claude-ro-shell
    owner: root
    group: root
    mode: '0755'
  become: true

- name: List the login shell among the valid shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: /usr/local/sbin/claude-ro-shell
  become: true

- name: Create the account, with no password
  ansible.builtin.user:
    name: "{{ claude_readonly_user }}"
    shell: /usr/local/sbin/claude-ro-shell
    password_lock: true
    create_home: true
  become: true

# The account has a login shell, so the CIS profile counts it among the users who can log in and wants its dotfiles
# to be 0740 at most. /etc/skel gives 0644, and the login shell reads none of them.
- name: Keep the startup files of the account private
  ansible.builtin.file:
    path: "/home/{{ claude_readonly_user }}/{{ item }}"
    mode: 'g-wx,o-rwx'
  loop:
    - .bash_logout
    - .bash_profile
    - .bashrc
  become: true

- name: Create the account's SSH directory
  ansible.builtin.file:
    path: "/home/{{ claude_readonly_user }}/.ssh"
    state: directory
    owner: "{{ claude_readonly_user }}"
    group: "{{ claude_readonly_user }}"
    mode: '0700'
  become: true

# restrict turns off the terminal, forwardings and agent, and from limits the key to claude101.
- name: Authorize the key of the assistant, from its host only
  ansible.builtin.copy:
    dest: "/home/{{ claude_readonly_user }}/.ssh/authorized_keys"
    content: 'restrict,from="{{ claude_readonly_source }}" {{ claude_readonly_public_key }}{{ "\n" }}'
    owner: "{{ claude_readonly_user }}"
    group: "{{ claude_readonly_user }}"
    mode: '0600'
  become: true

- name: Allow the account to run the script as root, and nothing else
  ansible.builtin.copy:
    dest: /etc/sudoers.d/claude-ro
    content: |
      {{ claude_readonly_user }} ALL=(root) NOPASSWD: /usr/local/sbin/claude-ro-tools
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  become: true

# The hardened template lets only deploy in (AllowUsers in 00-fleet.conf). The account is added to that line rather
# than given one of its own: sshd keeps the first AllowUsers it reads, and the CIS profile wants exactly one.
- name: Read the users sshd lets in
  ansible.builtin.command: sshd -T
  register: claude_readonly_sshd
  changed_when: false
  become: true

# sshd -T may print the list on one line or one user per line.
- name: Work out the list of users sshd is restricted to
  ansible.builtin.set_fact:
    claude_readonly_allowed_users: >-
      {{ (claude_readonly_sshd.stdout_lines | select('match', '^allowusers ') | join(' ')).split()
         | reject('equalto', 'allowusers') | list }}

- name: Find the file that restricts sshd to a list of users
  ansible.builtin.find:
    paths:
      - /etc/ssh
      - /etc/ssh/sshd_config.d
    patterns:
      - sshd_config
      - '*.conf'
    excludes:
      - 00-claude-ro.conf
    contains: '\s*AllowUsers\s'
  register: claude_readonly_allowusers_files
  become: true

- name: Stop if more than one file restricts sshd to a list of users
  ansible.builtin.assert:
    that: claude_readonly_allowusers_files.matched <= 1
    fail_msg: >-
      AllowUsers is set in {{ claude_readonly_allowusers_files.files | map(attribute='path') | join(', ') }}:
      merge them into one line, then run this again.
    quiet: true

- name: Let the account in where sshd is restricted to a list of users
  ansible.builtin.lineinfile:
    path: "{{ claude_readonly_allowusers_files.files[0].path }}"
    regexp: '^\s*AllowUsers\s'
    line: "AllowUsers {{ (claude_readonly_allowed_users + [claude_readonly_user]) | unique | join(' ') }}"
    validate: /usr/sbin/sshd -t -f %s
  become: true
  when: claude_readonly_allowed_users | length > 0 and claude_readonly_allowusers_files.matched == 1
  notify: Reload sshd

# Its line would be a second AllowUsers. It is kept where it is the only one, since removing it would let every
# user in.
- name: Remove the account's own AllowUsers file
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/00-claude-ro.conf
    state: absent
  become: true
  when: claude_readonly_allowusers_files.matched == 1
  notify: Reload sshd
