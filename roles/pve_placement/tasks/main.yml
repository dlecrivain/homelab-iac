---
- name: Copy the placement calculation script
  ansible.builtin.copy:
    src: compute_placement.py
    dest: /tmp/compute_placement.py
    mode: '0755'

- name: Compute VM placement for evacuation
  ansible.builtin.command: >
    python3 /tmp/compute_placement.py
    {{ inventory_hostname }}
    {{ pve_other_nodes | join(',') }}
    {{ pve_safety_threshold }}
    {{ pve_clone_storage }}
    {{ pve_placement_exclude_names | default([]) | join(',') | quote }}
    {{ pve_anti_affinity_groups | default([]) | to_json | quote }}
  register: placement_result
  changed_when: false

- name: Store the computed placement and maintenance-shutdown lists as reusable facts
  ansible.builtin.set_fact:
    vm_placements: "{{ (placement_result.stdout | from_json).migrate }}"
    vm_shutdowns: "{{ (placement_result.stdout | from_json).shutdown }}"
    vm_placement_warnings: "{{ (placement_result.stdout | from_json).warnings | default([]) }}"

- name: Show computed placement
  ansible.builtin.debug:
    msg: "Migrate: {{ vm_placements }} | Shutdown for maintenance: {{ vm_shutdowns }}"

# A placement that had to bend a rule - a memory threshold or an anti-affinity group - still goes
# ahead, since a planned window needs somewhere to put the VM; this keeps it visible in the log.
- name: Warn about placements that did not meet every rule
  ansible.builtin.debug:
    msg: "WARNING - {{ item }}"
  loop: "{{ vm_placement_warnings }}"

- name: Clean up the placement script
  ansible.builtin.file:
    path: /tmp/compute_placement.py
    state: absent
