---
- name: Copy the placement calculation script
  ansible.builtin.copy:
    src: compute_placement.py
    dest: /tmp/compute_placement.py
    mode: '0755'

- name: Compute VM placement for evacuation
  ansible.builtin.command: >
    python3 /tmp/compute_placement.py
    {{ inventory_hostname }}
    {{ pve_other_nodes | join(',') }}
    {{ pve_safety_threshold }}
    {{ pve_clone_storage }}
    {{ pve_placement_exclude_names | default([]) | join(',') }}
  register: placement_result
  changed_when: false

- name: Store the computed placement and maintenance-shutdown lists as reusable facts
  ansible.builtin.set_fact:
    vm_placements: "{{ (placement_result.stdout | from_json).migrate }}"
    vm_shutdowns: "{{ (placement_result.stdout | from_json).shutdown }}"

- name: Show computed placement
  ansible.builtin.debug:
    msg: "Migrate: {{ vm_placements }} | Shutdown for maintenance: {{ vm_shutdowns }}"

- name: Clean up the placement script
  ansible.builtin.file:
    path: /tmp/compute_placement.py
    state: absent
