---
# The scrape targets of Prometheus are files of this repository, k8s/prometheus/targets, one for each job and host: Argo CD gives
# them to Prometheus, which reads them again by itself. This role writes or removes the file and stages the change in the working
# copy; the caller commits it with the rest of what it changes (the host_vars of a provisioned or decommissioned VM), or
# configure-monitoring.yml does at its end.
- name: Fail clearly if prometheus_target_state isn't present or absent
  ansible.builtin.fail:
    msg: "prometheus_target_state must be 'present' or 'absent', got '{{ prometheus_target_state | default('(undefined)') }}'"
  when: prometheus_target_state | default('') not in ['present', 'absent']

- name: Determine the exporter port for this target's job
  ansible.builtin.set_fact:
    prometheus_target_port: "{{ {'node_exporter': 9100, 'smartctl_exporter': 9633}[prometheus_target_job] }}"
  when: prometheus_target_state == 'present'

- name: Register this host as a Prometheus scrape target
  ansible.builtin.template:
    src: target.json.j2
    dest: "{{ playbook_dir }}/k8s/prometheus/targets/{{ prometheus_target_job }}-{{ prometheus_target_name }}.json"
    mode: '0644'
  delegate_to: localhost
  when: prometheus_target_state == 'present'

# throttle: several hosts stage their file at the same time and git allows one change of its index at a time.
- name: Stage the file
  ansible.builtin.command:
    argv: [git, add, "k8s/prometheus/targets/{{ prometheus_target_job }}-{{ prometheus_target_name }}.json"]
    chdir: "{{ playbook_dir }}"
  delegate_to: localhost
  throttle: 1
  changed_when: false
  when: prometheus_target_state == 'present'

# The target leaves Prometheus a few minutes after the commit, once Argo CD has given the files to the cluster, and NodeDown fires
# after five minutes of silence from it. The alerts of the host are silenced for half an hour so that its removal mails nothing.
# The silence is a courtesy: a failure to create it does not stop the decommissioning.
- name: Silence the alerts of this host while its target goes away
  ansible.builtin.uri:
    url: "{{ alertmanager_url }}/api/v2/silences"
    method: POST
    body_format: json
    body:
      matchers:
        - { name: instance, value: "{{ prometheus_target_name }}", isRegex: false, isEqual: true }
      startsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=True) }}"
      endsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(('%s' | strftime | int) + 1800, utc=True) }}"
      createdBy: prometheus_target
      comment: "{{ prometheus_target_name }} is being decommissioned"
    status_code: 200
    timeout: 15
  delegate_to: localhost
  failed_when: false
  when: prometheus_target_state == 'absent'

- name: Remove this host as a Prometheus scrape target (no-op if already absent)
  ansible.builtin.command:
    argv: [git, rm, -f, -q, --ignore-unmatch, "k8s/prometheus/targets/{{ prometheus_target_job }}-{{ prometheus_target_name }}.json"]
    chdir: "{{ playbook_dir }}"
  delegate_to: localhost
  throttle: 1
  changed_when: false
  when: prometheus_target_state == 'absent'
