---
# Runs rootless as the connecting user itself (the host's host_vars: podman_units scope
# 'user', no become_user - so no become/UID/environment dance is needed here at all, unlike
# phpipam/immich's cross-user rootless setups; systemctl --user already works against this
# same session's own runtime dir).
# A rootless container may only bind a port above this threshold, and AdGuard Home listens on 53 and 80.
- name: Allow the rootless container to bind DNS and the web UI ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "53"
    sysctl_file: /etc/sysctl.d/99-adguard.conf
    reload: true
  become: true

# Without lingering, the user's systemd instance and the container stop when the last session ends
# and do not start at boot.
- name: Let the user's services run without a login session
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"
  become: true

- name: Open DNS and the web UI in the firewall
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  become: true
  loop:
    - 53/tcp
    - 53/udp
    - 80/tcp

# The container bind-mounts these two directories and does not start without them.
- name: Create AdGuard Home's configuration and data directories
  ansible.builtin.file:
    path: "/var/adguardhome/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  become: true
  loop:
    - conf
    - work

- name: Ensure the rootless Quadlet directory exists for adguardhome
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/containers/systemd"
    state: directory
    mode: '0755'

# Templated, not a hand-written file, so check-image-updates.yml's bump has something to change.
- name: Deploy the AdGuard Home Quadlet unit
  ansible.builtin.template:
    src: adguardhome.container.j2
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/adguardhome.container"
    mode: '0644'
  register: adguard_quadlet_result

# Named consistently with the other *_configure roles: container-updates.yml's report reads this
# to know a Step 2.5 re-render already updated the container.
- name: Determine whether anything actually changed
  ansible.builtin.set_fact:
    adguard_config_changed: "{{ adguard_quadlet_result is changed }}"

- name: Reload the user systemd instance to pick up any unit change
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when: adguard_config_changed

- name: Restart adguardhome.service (user scope) to pick up any unit change
  ansible.builtin.systemd:
    name: adguardhome.service
    state: restarted
    scope: user
  when: adguard_config_changed
