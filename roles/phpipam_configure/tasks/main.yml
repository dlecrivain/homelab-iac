---
- name: Ensure phpIPAM's host directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  loop:
    - /var/phpipam/logo
    - /var/phpipam/ca
    - /var/phpipam/config-override
    - /var/phpipam/apache-override

# Existence only, deliberately without owner/group/mode: MariaDB's datadir belongs to the mysql user
# inside the container (UID 999 on the host), and claiming it for root takes away its permission to
# create files there. The image's entrypoint sets the ownership when it initializes the datadir.
- name: Ensure the MariaDB datadir exists, leaving its ownership to the container
  ansible.builtin.file:
    path: /var/phpipam/mysql-data
    state: directory
  become: true

# Bind-mounted over /phpipam/config.docker.php, with the BunkerWeb HTTPS fix and api_allow_unsafe
# tweak baked in, so no separate config.php override is needed.
- name: Deploy the phpIPAM config override
  ansible.builtin.copy:
    src: config.docker.php
    dest: /var/phpipam/config-override/config.docker.php
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Deploy the Apache reverse-proxy override
  ansible.builtin.copy:
    src: proxy-tls.conf
    dest: /var/phpipam/apache-override/proxy-tls.conf
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Ensure /etc/containers/systemd exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy the phpIPAM network Quadlet
  ansible.builtin.copy:
    src: phpipam.network
    dest: /etc/containers/systemd/phpipam.network
    owner: root
    group: root
    mode: '0644'
  become: true
  register: phpipam_network_result

# Mode 0600: these embed IPAM_DATABASE_PASS/MYSQL_ROOT_PASSWORD directly as Environment= lines,
# matching how the host was already set up before coming under Ansible management.
- name: Deploy the phpIPAM Quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true
  loop:
    - phpipam-mariadb.container
    - phpipam-web.container
    - phpipam-cron.container
  register: phpipam_quadlet_result

- name: Determine whether anything actually changed
  ansible.builtin.set_fact:
    phpipam_config_changed: >-
      {{
        phpipam_network_result is changed
        or phpipam_quadlet_result is changed
      }}

- name: Reload systemd to pick up any config/unit change
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: phpipam_config_changed

# mariadb first: the other units' After=/Requires= already encodes this, but listing it first
# keeps the restart order obvious.
- name: Restart phpIPAM units to pick up any config/unit change
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  become: true
  loop:
    - phpipam-mariadb.service
    - phpipam-cron.service
    - phpipam-web.service
  when: phpipam_config_changed
