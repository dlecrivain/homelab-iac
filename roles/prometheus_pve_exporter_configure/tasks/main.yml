---
- name: Ensure /etc/pve-exporter exists
  ansible.builtin.file:
    path: /etc/pve-exporter
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true

# Embeds the Proxmox API token - never committed. Group-owned by GID 101 ('prometheus', the user
# the image runs as): it's a file-to-file bind mount, so the container's own non-root process
# reads it directly and needs group-read, unlike EnvironmentFile= (read by podman-as-root).
- name: Deploy the pve-exporter config
  ansible.builtin.template:
    src: pve.yml.j2
    dest: /etc/pve-exporter/pve.yml
    owner: root
    group: '101'
    mode: '0640'
  become: true
  no_log: true
  register: pve_exporter_config_result

- name: Ensure /etc/containers/systemd exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

# Own copy in case this role runs before prometheus_configure - identical, idempotent content.
- name: Deploy the shared monitoring network Quadlet
  ansible.builtin.copy:
    src: monitoring-network.network
    dest: /etc/containers/systemd/monitoring-network.network
    owner: root
    group: root
    mode: '0644'
  become: true
  register: pve_exporter_network_result

# Templated, not a static file, so check-image-updates.yml's version bump has something to change.
- name: Deploy the pve-exporter Quadlet unit
  ansible.builtin.template:
    src: pve-exporter.container.j2
    dest: /etc/containers/systemd/pve-exporter.container
    owner: root
    group: root
    mode: '0644'
  become: true
  register: pve_exporter_quadlet_result

- name: Reload systemd and restart pve-exporter if anything changed
  become: true
  when: pve_exporter_config_result is changed or pve_exporter_network_result is changed or pve_exporter_quadlet_result is changed
  block:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart pve-exporter
      ansible.builtin.systemd:
        name: pve-exporter.service
        state: restarted
        enabled: true
