---
- name: Ensure /etc/pve-exporter exists
  ansible.builtin.file:
    path: /etc/pve-exporter
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true

- name: "Deploy the pve-exporter config (embeds the Proxmox API token - not committed anywhere). Group-owned by GID 101 (the 'prometheus' user prompve/prometheus-pve-exporter runs as by default, confirmed via podman inspect) - this is a file-to-file bind mount, so the container's own non-root process reads it directly and needs group-read access, unlike EnvironmentFile= (read by podman-as-root on the host before the container starts)"
  ansible.builtin.template:
    src: pve.yml.j2
    dest: /etc/pve-exporter/pve.yml
    owner: root
    group: '101'
    mode: '0640'
  become: true
  no_log: true
  register: pve_exporter_config_result

- name: Ensure /etc/containers/systemd exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "Deploy the shared monitoring network Quadlet (own copy, in case this role ever runs before prometheus_configure - identical, idempotent content)"
  ansible.builtin.copy:
    src: monitoring-network.network
    dest: /etc/containers/systemd/monitoring-network.network
    owner: root
    group: root
    mode: '0644'
  become: true
  register: pve_exporter_network_result

- name: "Deploy the pve-exporter Quadlet unit (templated so check-image-updates.yml's version bump has something to change - previously a static file with the tag hardcoded in git)"
  ansible.builtin.template:
    src: pve-exporter.container.j2
    dest: /etc/containers/systemd/pve-exporter.container
    owner: root
    group: root
    mode: '0644'
  become: true
  register: pve_exporter_quadlet_result

- name: Reload systemd and restart pve-exporter if anything changed
  become: true
  when: pve_exporter_config_result is changed or pve_exporter_network_result is changed or pve_exporter_quadlet_result is changed
  block:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart pve-exporter
      ansible.builtin.systemd:
        name: pve-exporter.service
        state: restarted
        enabled: true
