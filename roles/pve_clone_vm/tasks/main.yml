---
- name: Fail clearly if the template VMID wasn't provided
  ansible.builtin.fail:
    msg: "pve_template_vmid is required (the golden template's VMID) - pass it with -e pve_template_vmid=<id>"
  when: pve_template_vmid is not defined

- name: Get the next free VMID
  ansible.builtin.command: >
    pvesh get /cluster/nextid
  register: pve_next_vmid_result
  changed_when: false
  delegate_to: "{{ pve_clone_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Save the new VMID
  ansible.builtin.set_fact:
    new_vmid: "{{ pve_next_vmid_result.stdout | trim }}"

- name: Start the full clone
  ansible.builtin.command: >
    qm clone {{ pve_template_vmid }} {{ new_vmid }}
    --name {{ new_vm_name }}
    --full
    --storage {{ pve_clone_storage }}
  register: pve_clone_start
  async: 21600
  poll: 0
  delegate_to: "{{ pve_clone_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Wait for the clone to complete
  ansible.builtin.async_status:
    jid: "{{ pve_clone_start.ansible_job_id }}"
  register: pve_clone_job
  until: pve_clone_job.finished
  retries: 720
  delay: 30
  ignore_errors: true
  delegate_to: "{{ pve_clone_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Fail clearly if the clone job itself reports an error
  ansible.builtin.fail:
    msg: "Clone of template {{ pve_template_vmid }} to {{ new_vmid }} ({{ new_vm_name }}) failed: {{ pve_clone_job.stderr | default('unknown error') }}"
  when: pve_clone_job.rc is defined and pve_clone_job.rc != 0

- name: Start the newly cloned VM
  ansible.builtin.command: >
    qm start {{ new_vmid }}
  delegate_to: "{{ pve_clone_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Confirm the VM is running
  ansible.builtin.command: >
    pvesh get /nodes/{{ pve_clone_node }}/qemu/{{ new_vmid }}/status/current
    --output-format json
  register: pve_clone_status_check
  retries: 6
  delay: 5
  until: (pve_clone_status_check.stdout | from_json).status == 'running'
  changed_when: false
  delegate_to: "{{ pve_clone_node }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"
