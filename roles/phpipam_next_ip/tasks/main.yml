---
- name: Log in to phpIPAM to obtain a session token ("User token" security mode)
  ansible.builtin.uri:
    url: "{{ phpipam_base_url }}/user/"
    method: POST
    url_username: "{{ phpipam_api_username }}"
    url_password: "{{ phpipam_api_password }}"
    force_basic_auth: true
    status_code: 200
  register: phpipam_login
  no_log: true

- name: Save the phpIPAM session token
  ansible.builtin.set_fact:
    phpipam_session_token: "{{ phpipam_login.json.data.token }}"
  no_log: true

- name: List all subnets (once) to find the one matching our CIDR
  ansible.builtin.uri:
    url: "{{ phpipam_base_url }}/subnets/"
    headers:
      token: "{{ phpipam_session_token }}"
    status_code: [200, 404]
  register: phpipam_subnets_list
  no_log: true

- name: Find subnets matching our CIDR (subnet/mask are separate fields, no combined CIDR lookup endpoint)
  ansible.builtin.set_fact:
    phpipam_matching_subnets: >-
      {{
        (phpipam_subnets_list.json.data | default([]))
        | selectattr('subnet', 'equalto', phpipam_subnet_cidr.split('/')[0])
        | selectattr('mask', 'equalto', phpipam_subnet_cidr.split('/')[1])
        | list
      }}

- name: Fail clearly if the subnet isn't registered in phpIPAM
  ansible.builtin.fail:
    msg: "phpIPAM has no subnet matching {{ phpipam_subnet_cidr }} - create it under Subnets first"
  when: phpipam_matching_subnets | length == 0

- name: Save the resolved subnet ID
  ansible.builtin.set_fact:
    phpipam_subnet_id: "{{ phpipam_matching_subnets[0].id }}"

- name: Copy the IP-resolution script
  ansible.builtin.copy:
    src: compute_next_ip.py
    dest: /tmp/compute_next_ip.py
    mode: '0755'

- name: Try candidates until a genuinely free one is found
  ansible.builtin.include_tasks: attempt_candidate.yml
  loop: "{{ range(1, (phpipam_max_retries | default(5)) + 1) | list }}"
  loop_control:
    loop_var: phpipam_attempt
  when: resolved_new_ip is not defined

- name: Fail loudly if every attempt found a live host instead of a free one
  ansible.builtin.fail:
    msg: "phpIPAM: exhausted {{ phpipam_max_retries }} attempts without finding a genuinely free IP in {{ phpipam_subnet_cidr }}"
  when: resolved_new_ip is not defined

- name: Clean up the IP-resolution script
  ansible.builtin.file:
    path: /tmp/compute_next_ip.py
    state: absent
