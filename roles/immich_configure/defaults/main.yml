---
# In dependency order: immich-server Requires= both postgres and redis.
immich_units:
  - immich-postgres.service
  - immich-redis.service
  - immich-machine-learning.service
  - immich-server.service

# The folder of the photo and video library, and the addresses of the hosts allowed to read it over NFS (read-only).
immich_library_path: /var/lib/immich/photos/library
immich_library_readers: []
