---
# Runs rootless as the connecting user itself, like adguard_configure: the host's host_vars set podman_units
# to scope 'user' with no become_user, so systemctl --user works against this same session's runtime dir.

# Without lingering, the user's systemd instance and its containers stop when the last session ends and
# do not start at boot.
- name: Let the user's services run without a login session
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"
  become: true

# A rootless container's published port goes through the host's INPUT chain, so firewalld has to allow it.
- name: Open Immich in the firewall
  ansible.posix.firewalld:
    port: 2283/tcp
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Create Immich's data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  become: true
  loop:
    - /var/lib/immich
    - /var/lib/immich/photos
    - /var/lib/immich/postgres

# Postgres runs as uid 999 inside the container, which is a sub-uid of the connecting user on the host. An empty
# data directory has to be handed to that uid for the first start; one that already holds a cluster is left as
# it is, since a migrated one carries the right owners already.
- name: Check whether the Postgres data directory already holds a cluster
  ansible.builtin.stat:
    path: /var/lib/immich/postgres/PG_VERSION
  register: immich_postgres_cluster
  become: true

- name: Hand an empty Postgres data directory to the container's postgres user
  ansible.builtin.command: podman unshare chown 999:999 /var/lib/immich/postgres
  changed_when: true
  when: not immich_postgres_cluster.stat.exists

# They hold the database password, which this repository never stores: copy them from the previous host or write them once.
- name: Check that the secret environment files are present
  ansible.builtin.stat:
    path: "/var/lib/immich/{{ item }}"
  register: immich_env_files
  loop:
    - .env
    - postgres.env

- name: Fail clearly if a secret environment file is missing
  ansible.builtin.fail:
    msg: "/var/lib/immich/{{ item.item }} is missing on {{ inventory_hostname }} - it holds the database password and is not kept in this repository, see the README"
  when: not item.stat.exists
  loop: "{{ immich_env_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure the rootless Quadlet directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Deploy the Immich network Quadlet
  ansible.builtin.copy:
    src: immich.network
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/immich.network"
    mode: '0644'
  register: immich_network_result

# The two Immich images share immich_version - same release, they always move together. Postgres and
# Valkey are pinned by digest instead: neither follows Immich's release cycle, and the Postgres image
# carries the vector extensions the database depends on.
- name: Deploy the Immich Quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/{{ item }}"
    mode: '0644'
  loop:
    - immich-postgres.container
    - immich-redis.container
    - immich-machine-learning.container
    - immich-server.container
  register: immich_quadlet_result

# Named consistently with the other *_configure roles: container-updates.yml's report reads this to
# know a Step 2.5 re-render already updated the containers.
- name: Determine whether anything actually changed
  ansible.builtin.set_fact:
    immich_config_changed: >-
      {{
        immich_network_result is changed
        or immich_quadlet_result is changed
      }}

- name: Reload the user systemd instance to pick up the regenerated units
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when: immich_config_changed

- name: Restart the Immich units
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    scope: user
  loop: "{{ immich_units }}"
  when: immich_config_changed

# The restart above only happens when a unit file changed. A unit that is stopped or failed with nothing else
# to change has to be started too, or the health check below reports it without anything bringing it back.
- name: Make sure the Immich units are running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    scope: user
  loop: "{{ immich_units }}"

- name: Share the library with the hosts that copy it
  ansible.builtin.include_tasks: library_export.yml
  when: immich_library_readers | length > 0
