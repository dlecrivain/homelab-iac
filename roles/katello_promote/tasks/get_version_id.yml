---
- name: Get the current content view version
  ansible.builtin.command: >
    hammer -u {{ katello_hammer_username }} -p {{ katello_hammer_password }}
    content-view version list
    --content-view {{ content_view_name }}
    --organization "{{ katello_organization }}"
    --order "id DESC"
    --per-page 1
    --fields id,version
  register: cv_version_list
  changed_when: false
  failed_when: false
  delegate_to: "{{ lpkat_host }}"
  become: true
  no_log: true

- name: Fail with a password-redacted error if listing the content view version failed
  ansible.builtin.fail:
    msg: >-
      hammer content-view version list failed for {{ content_view_name }} (rc={{ cv_version_list.rc }}):
      {{
        (cv_version_list.stderr | default('')) | replace(katello_hammer_password, '***REDACTED***')
        if (katello_hammer_password | default('') | length > 0)
        else (cv_version_list.stderr | default(''))
      }}
  when: cv_version_list.rc != 0

- name: Extract the version ID and number from command output
  vars:
    cv_version_row: "{{ cv_version_list.stdout_lines | select('match', '^\\s*[0-9]+\\s*\\|\\s*[0-9.]+\\s*$') | first }}"
  ansible.builtin.set_fact:
    cv_version_id: "{{ cv_version_row.split('|')[0] | trim }}"
    cv_version_number: "{{ cv_version_row.split('|')[1] | trim }}"
