---
# One rootless Postgres container per entry, each with its own port, data directory and password. Only the addresses in
# clients reach its port. An entry has: name, image, port, database, user and clients, and major when it is 18 or later (see
# tasks/layout.yml; the data of a version from 18 is in a directory of its own). The password is generated on the
# host the first time and read from there to make the Secret of the application by hand, since this repository is public.
postgres_instances: []

postgres_root: /var/lib/postgres
postgres_backup_dir: /var/backups/postgres
postgres_backup_keep_days: 7
