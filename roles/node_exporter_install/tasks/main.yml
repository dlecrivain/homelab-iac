---
- name: Compute the systemd unit-include regex from this host's tracked podman_units (matches nothing if none are tracked - reuses existing host_vars data, no new per-host var needed)
  ansible.builtin.set_fact:
    node_exporter_systemd_unit_regex: >-
      {%- set unit_names = [] -%}
      {%- for unit in (podman_units | default([])) -%}
        {%- set _ = unit_names.append((unit.service_name | default(unit.name)) + '\.service') -%}
      {%- endfor -%}
      {%- if unit_names | length > 0 -%}
      ^({{ unit_names | join('|') }})$
      {%- else -%}
      ^$
      {%- endif -%}

- name: Create the node_exporter system group
  ansible.builtin.group:
    name: node_exporter
    system: true
  become: true

- name: Create the node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Check whether the pinned node_exporter version is already installed
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_existing_version
  changed_when: false
  failed_when: false

- name: "Download and install node_exporter {{ node_exporter_version }} (GitHub release binary - not dnf/apt, since provision-vm.yml already disables every non-Katello-managed repo)"
  when: node_exporter_version not in (node_exporter_existing_version.stdout | default('') + node_exporter_existing_version.stderr | default(''))
  block:
    - name: Download the node_exporter release tarball
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: '0644'

    - name: Extract the tarball
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install the node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      become: true

    - name: Clean up the downloaded tarball and extracted directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

- name: Deploy the node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  become: true
  register: node_exporter_unit_result

- name: Check whether firewalld is active
  ansible.builtin.command: systemctl is-active firewalld
  register: node_exporter_firewalld_status
  changed_when: false
  failed_when: false

- name: Open 9100/tcp for node_exporter if firewalld is active
  ansible.posix.firewalld:
    port: 9100/tcp
    permanent: true
    immediate: true
    state: enabled
  become: true
  when: node_exporter_firewalld_status.stdout == 'active'

- name: Reload systemd and (re)start node_exporter if anything changed
  become: true
  when: node_exporter_unit_result is changed or (node_exporter_version not in (node_exporter_existing_version.stdout | default('') + node_exporter_existing_version.stderr | default('')))
  block:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: restarted
