---
- name: Compute the total run duration
  ansible.builtin.set_fact:
    report_duration_seconds: "{{ (now(fmt='%s') | int) - (run_start_epoch | int) }}"
  when: run_start_epoch is defined

- name: Format the run duration for display
  ansible.builtin.set_fact:
    report_duration_display: "{{ (report_duration_seconds | int // 60) }}m {{ (report_duration_seconds | int % 60) }}s"
  when: run_start_epoch is defined

- name: Build and send the HTML report email
  community.general.mail:
    host: "{{ smtp_host }}"
    port: "{{ smtp_port }}"
    username: "{{ smtp_user }}"
    password: "{{ smtp_password }}"
    to: "{{ notify_email_to }}"
    from: "{{ smtp_user }}"
    secure: starttls
    subtype: html
    subject: "{{ report_subject }}"
    body: |
      <html>
      <head>
      <style>
        body { font-family: Arial, sans-serif; color: #222; }
        h2 { color: #2c3e50; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .status-problem { background-color: #fdecea; }
        .status-warning { background-color: #fff4e5; }
        .status-info { background-color: #eaf2fd; }
        .status-ok { background-color: #eafaf1; }
        .status-neutral { background-color: #f5f5f5; }
        .alert-danger { background-color: #fdecea; padding: 10px; border-left: 4px solid #c0392b; }
        .alert-warning { background-color: #fff4e5; padding: 10px; border-left: 4px solid #e67e22; }
      </style>
      </head>
      <body>
      {% if report_duration_display is defined %}
      <p><strong>Execution time:</strong> {{ report_duration_display }}</p>
      {% endif %}
      {{ report_body }}
      </body>
      </html>
