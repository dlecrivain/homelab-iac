---
- name: Copy the rebalance calculation script
  ansible.builtin.copy:
    src: compute_rebalance.py
    dest: /tmp/compute_rebalance.py
    mode: '0755'
  delegate_to: "{{ proxmox_api_host }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

# Never moved by the rebalance: VMs on node-local storage, and VMs pinned because a move is costly.
# They stay in the plan as load on the node they sit on.
- name: Determine which VMs the rebalance must leave where they are
  ansible.builtin.set_fact:
    pve_rebalance_exclude_names: "{{ pve_rebalance_exclude_names | default([]) + [item] }}"
  loop: "{{ groups['proxmox_all_qemu'] }}"
  loop_control:
    label: "{{ item }}"
  when: >-
    hostvars[item].pve_shutdown_for_maintenance | default(false) | bool
    or hostvars[item].pve_rebalance_pinned | default(false) | bool

- name: Compute the global rebalance plan
  ansible.builtin.command: >
    python3 /tmp/compute_rebalance.py {{ pve_all_nodes | join(',') }} {{ pve_safety_threshold }} {{ pve_rebalance_margin }} {{ pve_clone_storage }}
    {{ pve_rebalance_exclude_names | default([]) | join(',') | quote }}
    {{ pve_anti_affinity_groups | default([]) | to_json | quote }}
  register: rebalance_result
  changed_when: false
  delegate_to: "{{ proxmox_api_host }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Store the rebalance plan as a fact
  ansible.builtin.set_fact:
    rebalance_moves: "{{ rebalance_result.stdout | from_json }}"

- name: Show the rebalance plan
  ansible.builtin.debug:
    msg: "{{ rebalance_moves }}"

- name: Show what the plan could not satisfy
  ansible.builtin.debug:
    msg: "{{ rebalance_result.stderr_lines }}"
  when: rebalance_result.stderr_lines | length > 0

# Kept as a fact so a calling playbook can put it in its report.
- name: Keep the plan's warnings for the report
  ansible.builtin.set_fact:
    rebalance_warnings: "{{ rebalance_result.stderr_lines | map('regex_replace', '^WARNING: ', '') | list }}"

- name: Clean up the rebalance script
  ansible.builtin.file:
    path: /tmp/compute_rebalance.py
    state: absent
  delegate_to: "{{ proxmox_api_host }}"
  remote_user: "{{ proxmox_ssh_user }}"
  vars:
    ansible_python_interpreter: "{{ proxmox_python_interpreter }}"

- name: Apply each rebalance move in sequence
  ansible.builtin.include_tasks: apply_move.yml
  loop: "{{ rebalance_moves }}"
  loop_control:
    loop_var: move
    label: "{{ move.name }}: {{ move.current_node }} -> {{ move.target_node }}"
  when: not (rebalance_dry_run | default(false) | bool)
