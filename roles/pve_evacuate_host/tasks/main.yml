---
- name: Determine which VMs are pinned to node-local storage and must be shut down rather than migrated
  ansible.builtin.set_fact:
    pve_placement_exclude_names: "{{ pve_placement_exclude_names | default([]) + [item] }}"
  loop: "{{ groups['proxmox_all_qemu'] }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].pve_shutdown_for_maintenance | default(false) | bool

- name: Compute placement for VMs on this host
  include_role:
    name: pve_placement

- name: Migrate each VM in sequence, verifying health immediately after each one
  ansible.builtin.include_tasks: migrate_and_verify.yml
  loop: "{{ vm_placements }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }} -> {{ vm.target_node }}"

# Recorded here so the VMs are started again after the reboot, and also when the run is blocked after they were
# stopped. They are stopped later, by shutdown_pinned_vms.yml, once the host has installed its updates.
- name: Remember which VMs are stopped for this host's reboot instead of being migrated
  ansible.builtin.set_fact:
    pve_vms_shutdown_for_maintenance: "{{ vm_shutdowns }}"
