---
# Its disk is on node-local storage, or it is too large for the other nodes' memory, so it is stopped instead of migrated.
# pve_shutdown_timeout in its host_vars lets a VM that takes long to stop (Katello) have more than a minute.
- name: "Shut down {{ vm.name }} for the maintenance window"
  ansible.builtin.command: >
    qm shutdown {{ vm.vmid }} --timeout {{ hostvars[vm.name].pve_shutdown_timeout | default(60) }}
  changed_when: true

- name: "Confirm {{ vm.name }} is stopped"
  ansible.builtin.command: >
    qm status {{ vm.vmid }}
  register: shutdown_status_check
  changed_when: false
  retries: 6
  delay: 5
  until: "'status: stopped' in shutdown_status_check.stdout"
