---
# A no-op if onboot=1 already auto-started this VM during the host's own boot. Retried because
# cluster quorum can take a moment to re-establish after a reboot even once SSH is back
# ("cluster not ready - no quorum?", rc=255).
- name: "Start {{ vm.name }} back up after host maintenance"
  ansible.builtin.command: >
    qm start {{ vm.vmid }}
  register: vm_start_result
  retries: 12
  delay: 10
  until: >-
    vm_start_result.rc == 0 or
    'already running' in (vm_start_result.stderr | default('') + vm_start_result.stdout | default(''))
  failed_when:
    - vm_start_result.rc != 0
    - "'already running' not in (vm_start_result.stderr | default('') + vm_start_result.stdout | default(''))"
  changed_when: vm_start_result.rc == 0

# A cold start, unlike a live migration - health_check would otherwise run before SSH/podman are up.
- name: "Wait for {{ vm.name }} to finish booting"
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 180
  delegate_to: "{{ vm.name }}"

- name: "Check {{ vm.name }} health after restart"
  include_role:
    name: health_check
  vars:
    health_check_delegate_to: "{{ vm.name }}"
    health_check_fail_on_unhealthy: true
    health_check_containers: "{{ hostvars[vm.name].health_check_containers | default([]) }}"
    health_check_url: "{{ hostvars[vm.name].health_check_url | default('') }}"
    health_check_podman_user: "{{ hostvars[vm.name].health_check_podman_user | default('root') }}"
    health_check_validate_certs: "{{ hostvars[vm.name].health_check_validate_certs | default(true) }}"
    health_check_retries: "{{ hostvars[vm.name].health_check_retries | default(5) }}"
    health_check_delay: "{{ hostvars[vm.name].health_check_delay | default(10) }}"
