---
- name: Determine become settings for this unit
  ansible.builtin.set_fact:
    unit_become: "{{ unit.scope == 'root' or (unit.become_user is defined and unit.become_user != ansible_user) }}"

- name: Get UID for cross-user rootless units
  ansible.builtin.command: "id -u {{ unit.become_user }}"
  register: unit_uid
  changed_when: false
  when: unit.scope == 'user' and unit.become_user is defined and unit.become_user != ansible_user

- name: Set environment for cross-user rootless systemctl --user
  ansible.builtin.set_fact:
    unit_env: "{{ {'XDG_RUNTIME_DIR': '/run/user/' + unit_uid.stdout, 'DBUS_SESSION_BUS_ADDRESS': 'unix:path=/run/user/' + unit_uid.stdout + '/bus'} if (unit.scope == 'user' and unit.become_user is defined and unit.become_user != ansible_user) else {} }}"

- name: Manage this unit's image and lifecycle
  become: "{{ unit_become }}"
  become_user: "{{ 'root' if unit.scope == 'root' else (unit.become_user | default(omit)) }}"
  environment: "{{ unit_env }}"
  block:
    - name: Get current image ID
      ansible.builtin.command: "podman inspect {{ unit.name }} --format '{{ '{{' }}.Image{{ '}}' }}'"
      register: image_before
      changed_when: false

    - name: Get current image version label
      ansible.builtin.command: >
        podman inspect {{ unit.name }} --format '{{ '{{' }} index .Config.Labels "org.opencontainers.image.version" {{ '}}' }}'
      register: version_before
      changed_when: false

    - name: Get image reference used
      ansible.builtin.command: "podman inspect {{ unit.name }} --format '{{ '{{' }}.ImageName{{ '}}' }}'"
      register: image_ref
      changed_when: false

    - name: "Read the Quadlet file's own Image= line as a last-resort tag source (podman inspect can lose the tag entirely once a container is resolved to a pure digest reference, e.g. valkey:9@sha256:... - podman only remembers the digest afterwards, the tag only still exists in the file itself)"
      ansible.builtin.slurp:
        src: >-
          {{
            ('/etc/containers/systemd/' + (unit.service_name | default(unit.name)) + '.container')
            if unit.scope == 'root'
            else ('/home/' + (unit.become_user | default(ansible_user)) + '/.config/containers/systemd/' + (unit.service_name | default(unit.name)) + '.container')
          }}
      register: unit_quadlet_file
      failed_when: false

    - name: Pull the latest image
      ansible.builtin.command: "podman pull {{ image_ref.stdout }}"
      register: pull_result
      changed_when: "'Copying blob' in pull_result.stdout or 'Copying config' in pull_result.stdout"
      retries: 6
      delay: 10
      until: pull_result.rc == 0

    - name: Get image ID after pull
      ansible.builtin.command: "podman inspect {{ image_ref.stdout }} --format '{{ '{{' }}.Id{{ '}}' }}'"
      register: image_after
      changed_when: false

    - name: Get new image version label
      ansible.builtin.command: >
        podman inspect {{ image_ref.stdout }} --format '{{ '{{' }} index .Config.Labels "org.opencontainers.image.version" {{ '}}' }}'
      register: version_after
      changed_when: false

    - name: Restart unit if image changed
      ansible.builtin.systemd:
        name: "{{ (unit.service_name | default(unit.name)) }}.service"
        state: restarted
        scope: "{{ 'system' if unit.scope == 'root' else 'user' }}"
      when: image_after.stdout != image_before.stdout

    - name: Wait a moment for the unit to stabilize after restart
      ansible.builtin.pause:
        seconds: 5
      when: image_after.stdout != image_before.stdout

- name: "Record update summary for this unit. Prefers, in order, whichever of these actually looks like a version (contains a digit): the org.opencontainers.image.version label, then the image's own tag from podman inspect, then the tag as written in the Quadlet file itself (podman inspect loses it entirely for digest-pinned references), then finally a raw image ID. None of these can be trusted blindly - some images set the label to a meaningless branch name instead of a version (bunkerweb-all-in-one: 'master'), and some tags are the floating ':latest'-equivalent with no digit in it either"
  vars:
    unit_version_label_before: "{{ version_before.stdout | trim }}"
    unit_version_label_after: "{{ version_after.stdout | trim }}"
    unit_image_tag: "{{ image_ref.stdout.split('@')[0].split(':')[-1] if ':' in image_ref.stdout.split('@')[0] else '' }}"
    unit_file_image_ref: "{{ ((unit_quadlet_file.content | b64decode) | regex_search('(?m)^Image=.*$') | default('')) | regex_replace('^Image=', '') if (unit_quadlet_file.content is defined) else '' }}"
    unit_file_image_tag: "{{ unit_file_image_ref.split('@')[0].split(':')[-1] if ':' in unit_file_image_ref.split('@')[0] else '' }}"
  ansible.builtin.set_fact:
    podman_update_summary: >-
      {{ podman_update_summary + [{
        'name': unit.name,
        'updated': (image_after.stdout != image_before.stdout),
        'old_version': (unit_version_label_before if (unit_version_label_before is search('[0-9]')) else (unit_image_tag if (unit_image_tag is search('[0-9]')) else (unit_file_image_tag if (unit_file_image_tag is search('[0-9]')) else image_before.stdout[:12]))),
        'new_version': (unit_version_label_after if (unit_version_label_after is search('[0-9]')) else (unit_image_tag if (unit_image_tag is search('[0-9]')) else (unit_file_image_tag if (unit_file_image_tag is search('[0-9]')) else image_after.stdout[:12])))
      }] }}
