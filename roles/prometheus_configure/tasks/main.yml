---
- name: Disable Cockpit (frees port 9090 for Prometheus - Cockpit's default web console listens there too, and it's enabled by default on the Rocky 10 golden template every fleet VM is cloned from; prometheus101 has no other use for it)
  ansible.builtin.systemd:
    name: cockpit.socket
    state: stopped
    enabled: false
  become: true

- name: Ensure /etc/prometheus and its file_sd subdirectories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  loop:
    - /etc/prometheus
    - /etc/prometheus/file_sd
    - /etc/prometheus/file_sd/node_exporter_targets.d
    - /etc/prometheus/file_sd/smartctl_exporter_targets.d

- name: "Ensure /etc/alertmanager exists (group-owned by GID 65534 with search permission - the container's non-root 'nobody' user needs to traverse into this directory to read alertmanager.yml)"
  ansible.builtin.file:
    path: /etc/alertmanager
    state: directory
    owner: root
    group: '65534'
    mode: '0750'
  become: true

- name: Deploy the static alert rules
  ansible.builtin.copy:
    src: alert_rules.yml
    dest: /etc/prometheus/alert_rules.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  register: prometheus_alert_rules_result

- name: Deploy the Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  register: prometheus_config_result

- name: "Deploy the Alertmanager config (embeds the SMTP password - not committed anywhere, templated from group_vars/all.yml's lookup('env', ...) values). Group-owned by GID 65534 (the 'nobody' user prom/alertmanager runs as by default, confirmed via podman inspect - not root:0600, since the container can't read a root-only file)"
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: root
    group: '65534'
    mode: '0640'
  become: true
  no_log: true
  register: alertmanager_config_result

- name: Ensure /etc/containers/systemd exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy the data volume Quadlet definitions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop:
    - prometheus_data.volume
    - alertmanager_data.volume

- name: "Deploy the shared monitoring network Quadlet (lets these containers resolve each other by name - PublishPort= only exposes a port to the LAN, it does NOT make sibling containers reachable via 127.0.0.1/localhost, since each container gets its own isolated network namespace by default; same pattern semaphore_provision already uses for semaphore/semaphore-db)"
  ansible.builtin.copy:
    src: monitoring-network.network
    dest: /etc/containers/systemd/monitoring-network.network
    owner: root
    group: root
    mode: '0644'
  become: true
  register: prometheus_network_result

- name: "Deploy the Prometheus and Alertmanager Quadlet units (templated so check-image-updates.yml's version bump has something to change - previously static files with the tag hardcoded in git)"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop:
    - prometheus.container
    - alertmanager.container
  register: prometheus_quadlet_result

- name: Determine whether anything actually changed
  ansible.builtin.set_fact:
    prometheus_config_changed: >-
      {{
        prometheus_alert_rules_result is changed
        or prometheus_config_result is changed
        or alertmanager_config_result is changed
        or prometheus_network_result is changed
        or prometheus_quadlet_result is changed
      }}

- name: Reload systemd to pick up any config/unit change
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: prometheus_config_changed

- name: Restart Prometheus and Alertmanager to pick up any config/unit change
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  become: true
  loop:
    - prometheus.service
    - alertmanager.service
  when: prometheus_config_changed
