---
- name: Mark this as an orchestrated run so the nested container-updates.yml import doesn't send its own separate email
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fail clearly if peer_host wasn't provided
      ansible.builtin.fail:
        msg: "peer_host is required - pass it with -e peer_host=<hostname>"
      when: peer_host is not defined

    - name: Remember whether this run was already orchestrated by something bigger (e.g. full-updates.yml), before forcing the flag below
      ansible.builtin.set_fact:
        semaphore_peer_run_standalone: "{{ not (hostvars['localhost'].is_orchestrated_run | default(false)) }}"

    - name: Force the orchestration flag (container-updates.yml, imported below, must not send its own email - this playbook's own final report covers it)
      ansible.builtin.set_fact:
        is_orchestrated_run: true

- name: OS-patch this Semaphore peer (no Katello promotion - this VM isn't Katello-managed content)
  hosts: "{{ peer_host }}"
  gather_facts: true
  tasks:
    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Capture this stage's own start time
      include_role:
        name: capture_start_time
      vars:
        capture_start_time_fact_name: semaphore_peer_start_epoch

    - name: Patch this peer (skipped if an earlier stage in an orchestrated run had a problem)
      when: hostvars['localhost'].orchestration_should_run | default(true)
      block:
        - name: Step 1 - Remove any leftover patching snapshot from a previous run
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_patching

        - name: Step 2 - Check for available updates
          include_role:
            name: check_updates

        - name: Snapshot, update and reboot the VM (only if updates are available)
          when: has_updates | default(false) | bool
          block:
            - name: Step 3 - Proxmox snapshot
              vars:
                snapshot_label: ansible_patching
              include_role:
                name: proxmox_snapshot

            - name: Step 4 - Apply updates
              include_role:
                name: apply_updates
              when: not (snapshot_already_exists | default(false))

            - name: Step 5 - Reboot and wait
              include_role:
                name: reboot_and_wait
              when: not (snapshot_already_exists | default(false))

        - name: Step 6 - Check services
          include_role:
            name: health_check

        - name: Determine overall host status
          include_role:
            name: host_status

        - name: Step 7 - Remove the patching snapshot now that the host is healthy
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_patching
          when:
            - has_updates | default(false) | bool
            - host_overall_status == 'OK'

- import_playbook: container-updates.yml
  vars:
    target_hosts: "{{ peer_host }}"

- name: Capture the reference host's current image versions, only if it's healthy (used to align the peer's images to match)
  hosts: "{{ image_reference_host | default('localhost') }}"
  gather_facts: false
  tasks:
    - name: Gather and validate the reference host's image versions
      when: image_reference_host is defined
      block:
        - name: Check services on the reference host
          include_role:
            name: health_check

        - name: Determine the reference host's overall status
          include_role:
            name: host_status

        - name: Get each unit's current image ID on the reference host
          ansible.builtin.command: "podman inspect {{ item.name }} --format '{{ '{{' }}.Image{{ '}}' }}'"
          become: true
          loop: "{{ podman_units }}"
          loop_control:
            label: "{{ item.name }}"
          register: reference_image_ids
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Resolve each image ID to a pullable digest reference
          ansible.builtin.command: "podman inspect {{ item.stdout }} --format '{{ '{{' }} index .RepoDigests 0 {{ '}}' }}'"
          become: true
          loop: "{{ reference_image_ids.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          register: reference_digest_refs
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Save the reference host's image digests, keyed by unit name
          ansible.builtin.set_fact:
            reference_image_digests: "{{ dict(podman_units | map(attribute='name') | zip(reference_digest_refs.results | map(attribute='stdout'))) }}"
          delegate_to: localhost
          delegate_facts: true
          when: host_overall_status == 'OK'

        - name: Get each unit's current image tag on the reference host
          ansible.builtin.command: "podman inspect {{ item.name }} --format '{{ '{{' }}.ImageName{{ '}}' }}'"
          become: true
          loop: "{{ podman_units }}"
          loop_control:
            label: "{{ item.name }}"
          register: reference_image_refs
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Save the reference host's image tags, keyed by unit name
          ansible.builtin.set_fact:
            reference_image_tags: "{{ dict(podman_units | map(attribute='name') | zip(reference_image_refs.results | map(attribute='stdout'))) }}"
          delegate_to: localhost
          delegate_facts: true
          when: host_overall_status == 'OK'

- name: Align this peer's images to the reference host's exact versions (only if a reference host was provided and confirmed healthy)
  hosts: "{{ peer_host }}"
  gather_facts: false
  tasks:
    - name: Align Postgres/Semaphore images to the reference host
      include_role:
        name: podman_align_image
      vars:
        podman_align_reference_digests: "{{ hostvars['localhost'].reference_image_digests }}"
        podman_align_reference_tags: "{{ hostvars['localhost'].reference_image_tags }}"
      when: hostvars['localhost'].reference_image_digests is defined

- name: Bump this peer's Semaphore image if a newer patch/minor is available (skipped in the image_reference_host direction, which uses exact-digest alignment above instead)
  hosts: "{{ peer_host }}"
  gather_facts: false
  tasks:
    - name: Auto-bump (or apply an explicit semaphore_image_tag) Semaphore's image
      when: image_reference_host is not defined
      block:
        - name: Get the currently configured Semaphore image reference
          ansible.builtin.command: podman inspect semaphore --format '{{ '{{' }}.ImageName{{ '}}' }}'
          register: semaphore_current_image_ref
          changed_when: false
          become: true

        - name: Extract the current version
          ansible.builtin.set_fact:
            semaphore_current_version: "{{ semaphore_current_image_ref.stdout.split(':')[-1] }}"

        - name: Determine the target tag automatically (latest stable release within the same major line) when semaphore_image_tag isn't explicitly passed
          when: semaphore_image_tag is not defined
          block:
            - name: Extract the current version's major line
              ansible.builtin.set_fact:
                semaphore_current_major: "{{ semaphore_current_version | regex_replace('^v?([0-9]+)\\..*$', '\\1') }}"

            - name: Query available Semaphore tags on Docker Hub
              ansible.builtin.uri:
                url: "https://hub.docker.com/v2/repositories/semaphoreui/semaphore/tags?page_size=100"
                return_content: true
              register: semaphore_tags_response
              delegate_to: localhost

            - name: Filter to pure vMAJOR.MINOR.PATCH tags in the same major line (excludes beta/rc/arch-suffixed tags)
              ansible.builtin.set_fact:
                semaphore_candidate_versions: >-
                  {{
                    semaphore_tags_response.json.results
                    | map(attribute='name')
                    | select('match', '^v' + semaphore_current_major | regex_escape() + '\.[0-9]+\.[0-9]+$')
                    | list
                  }}

            - name: Rank each candidate by its [major, minor, patch] numbers, paired with its tag string
              ansible.builtin.set_fact:
                semaphore_ranked_versions: "{{ semaphore_candidate_versions | map('regex_findall', '[0-9]+') | map('map', 'int') | map('list') | list | zip(semaphore_candidate_versions) | map('list') | list }}"

            - name: Set the auto-detected target tag (highest-ranked candidate)
              ansible.builtin.set_fact:
                semaphore_image_tag: "{{ (semaphore_ranked_versions | sort)[-1][1] }}"

        - name: Update the Image= line in semaphore.container (only if the target tag is actually different)
          when: semaphore_image_tag != semaphore_current_version
          block:
            - name: Update the Image= line in semaphore.container
              ansible.builtin.replace:
                path: /etc/containers/systemd/semaphore.container
                regexp: '^Image=docker\.io/semaphoreui/semaphore:.*$'
                replace: "Image=docker.io/semaphoreui/semaphore:{{ semaphore_image_tag }}"
              become: true

            - name: Reload systemd to pick up the change
              ansible.builtin.systemd:
                daemon_reload: true
              become: true

            - name: Restart the Semaphore service
              ansible.builtin.systemd:
                name: semaphore.service
                state: restarted
              become: true

- name: Confirm the peer Semaphore instance is back up
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Wait for {{ peer_host }}'s Semaphore web service to respond"
      ansible.builtin.uri:
        url: "http://{{ hostvars[peer_host].ansible_host }}:3000/api/ping"
        status_code: 200
        timeout: 10
      register: peer_semaphore_ping
      retries: 30
      delay: 10
      until: (peer_semaphore_ping.status | default(0)) == 200

- name: Keep this repo's provisioning template in sync with whatever Semaphore version the peer is actually running
  hosts: localhost
  gather_facts: false
  vars:
    semaphore_bumped_tag: "{{ hostvars[peer_host].semaphore_image_tag | default('') }}"
  tasks:
    - name: Read this repo's provisioning template
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/roles/semaphore_provision/files/semaphore.container"
      register: semaphore_repo_template_content

    - name: Extract the version currently recorded in this repo's provisioning template (regex evaluated on the controller, not the target's shell - avoids BusyBox grep's lack of -P support)
      ansible.builtin.set_fact:
        semaphore_repo_recorded_tag: "{{ (semaphore_repo_template_content.content | b64decode) | regex_search('(?<=semaphoreui/semaphore:).*') | default('', true) | trim }}"

    - name: Update, commit and push if the repo's recorded version differs from what the peer is actually running (self-healing - not just "did a bump just happen in this run", so an interrupted previous sync still gets caught)
      when:
        - semaphore_bumped_tag != ''
        - semaphore_bumped_tag != semaphore_repo_recorded_tag
      block:
        - name: Update the Image= line in this repo's provisioning template
          ansible.builtin.replace:
            path: "{{ playbook_dir }}/roles/semaphore_provision/files/semaphore.container"
            regexp: '^Image=docker\.io/semaphoreui/semaphore:.*$'
            replace: "Image=docker.io/semaphoreui/semaphore:{{ semaphore_bumped_tag }}"

        - name: Configure a git identity for this commit (harmless if already set)
          ansible.builtin.command: "{{ item }}"
          loop:
            - git config user.email "d.lecrivain47@gmail.com"
            - git config user.name "dlecrivain"
          args:
            chdir: "{{ playbook_dir }}"
          changed_when: false

        - name: Commit the version bump
          ansible.builtin.command: >-
            git commit -am "Bump provisioned Semaphore image to {{ semaphore_bumped_tag }} (applied to {{ peer_host }} by update-semaphore-peer.yml)"
          args:
            chdir: "{{ playbook_dir }}"

        - name: Push the commit to origin/main
          ansible.builtin.command: "git push https://{{ github_push_token }}@github.com/dlecrivain/homelab-iac main"
          args:
            chdir: "{{ playbook_dir }}"
          register: semaphore_peer_git_push
          failed_when: false
          no_log: true

        - name: Fail with a token-redacted error if the push failed
          ansible.builtin.fail:
            msg: >-
              git push failed (rc={{ semaphore_peer_git_push.rc }}):
              {{
                (semaphore_peer_git_push.stderr | default('')) | replace(github_push_token, '***REDACTED***')
                if (github_push_token | default('') | length > 0)
                else (semaphore_peer_git_push.stderr | default('')) + ' (github_push_token is empty - GITHUB_PUSH_TOKEN missing from this template''s Variable Group)'
              }}
          when: semaphore_peer_git_push.rc != 0

- name: Determine this stage's status and send its report (only when run standalone - the combined full-updates.yml email covers it otherwise)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record whether this stage was allowed to run
      ansible.builtin.set_fact:
        semaphore_peer_was_allowed_to_run: "{{ hostvars['localhost'].orchestration_should_run | default(true) }}"

    - name: Record whether the reference host was healthy enough to align images from
      ansible.builtin.set_fact:
        semaphore_peer_alignment_skipped: "{{ image_reference_host is defined and hostvars['localhost'].reference_image_digests is not defined }}"

    - name: Determine this stage's status label
      ansible.builtin.set_fact:
        semaphore_peer_stage_status: >-
          {{
            'SKIPPED' if not semaphore_peer_was_allowed_to_run
            else ('PROBLEM' if (hostvars[peer_host].host_overall_status | default('OK')) == 'PROBLEM'
            else ('SKIPPED' if semaphore_peer_alignment_skipped
            else 'OK'))
          }}

    - name: Compute this stage's own duration
      ansible.builtin.set_fact:
        semaphore_peer_duration_seconds: "{{ (now(fmt='%s') | int) - (hostvars['localhost'].semaphore_peer_start_epoch | int) }}"
      when: hostvars['localhost'].semaphore_peer_start_epoch is defined

    - name: Format this stage's duration for display
      ansible.builtin.set_fact:
        semaphore_peer_duration_display: "{{ (semaphore_peer_duration_seconds | int // 3600) }}h {{ ((semaphore_peer_duration_seconds | int % 3600) // 60) }}m {{ (semaphore_peer_duration_seconds | int % 60) }}s"
      when: semaphore_peer_duration_seconds is defined

    - name: Capture this stage's report body
      ansible.builtin.set_fact:
        semaphore_peer_report_body: |
          <h2>Semaphore peer alignment report ({{ peer_host }})</h2>
          {% if not semaphore_peer_was_allowed_to_run %}
          <p class="alert-warning">
            <strong>Skipped.</strong> An earlier stage in this orchestrated run reported a problem, so {{ peer_host }} was not patched.
          </p>
          {% elif semaphore_peer_stage_status == 'PROBLEM' %}
          <p class="alert-danger">
            <strong>Problem on {{ peer_host }}:</strong> {{ hostvars[peer_host].host_update_failure_reason | default('see host_overall_status for details') }}
          </p>
          {% elif semaphore_peer_alignment_skipped %}
          <p class="alert-warning">
            <strong>Image alignment skipped.</strong> {{ peer_host }} was patched (OS + its own container updates), but its images could not be aligned to {{ image_reference_host }} because {{ image_reference_host }} wasn't healthy at the time this ran.
          </p>
          {% else %}
          <p>{{ peer_host }} patched and healthy{% if image_reference_host is defined %}, images aligned to {{ image_reference_host }}{% endif %}.</p>
          {% endif %}
          {% if hostvars['localhost'].semaphore_peer_run_standalone %}
          {{ hostvars['localhost'].container_updates_report_body | default('') }}
          {% endif %}

    - name: Build and send the HTML report email (skipped when part of an orchestrated run; the combined email covers it instead)
      include_role:
        name: send_report
      vars:
        report_subject: "[update-semaphore-peer] {{ peer_host }} {{ semaphore_peer_stage_status }}"
        report_body: "{{ semaphore_peer_report_body }}"
      when: hostvars['localhost'].semaphore_peer_run_standalone | default(true)
