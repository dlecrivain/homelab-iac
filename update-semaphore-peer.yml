---
- name: OS-patch this Semaphore peer (no Katello promotion - this VM isn't Katello-managed content)
  hosts: "{{ peer_host }}"
  gather_facts: true
  tasks:
    - name: Patch this peer (skipped if an earlier stage in an orchestrated run had a problem)
      when: hostvars['localhost'].orchestration_should_run | default(true)
      block:
        - name: Step 1 - Remove any leftover patching snapshot from a previous run
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_patching

        - name: Step 2 - Check for available updates
          include_role:
            name: check_updates

        - name: Snapshot, update and reboot the VM (only if updates are available)
          when: has_updates | default(false) | bool
          block:
            - name: Step 3 - Proxmox snapshot
              vars:
                snapshot_label: ansible_patching
              include_role:
                name: proxmox_snapshot

            - name: Step 4 - Apply updates
              include_role:
                name: apply_updates
              when: not (snapshot_already_exists | default(false))

            - name: Step 5 - Reboot and wait
              include_role:
                name: reboot_and_wait
              when: not (snapshot_already_exists | default(false))

        - name: Step 6 - Check services
          include_role:
            name: health_check

        - name: Determine overall host status
          include_role:
            name: host_status

        - name: Step 7 - Remove the patching snapshot now that the host is healthy
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_patching
          when:
            - has_updates | default(false) | bool
            - host_overall_status == 'OK'

- import_playbook: container-updates.yml
  vars:
    target_hosts: "{{ peer_host }}"

- name: Capture the reference host's current image versions, only if it's healthy (used to align the peer's images to match)
  hosts: "{{ image_reference_host | default('localhost') }}"
  gather_facts: false
  tasks:
    - name: Gather and validate the reference host's image versions
      when: image_reference_host is defined
      block:
        - name: Check services on the reference host
          include_role:
            name: health_check

        - name: Determine the reference host's overall status
          include_role:
            name: host_status

        - name: Get each unit's current image ID on the reference host
          ansible.builtin.command: "podman inspect {{ item.name }} --format '{{ '{{' }}.Image{{ '}}' }}'"
          become: true
          loop: "{{ podman_units }}"
          loop_control:
            label: "{{ item.name }}"
          register: reference_image_ids
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Resolve each image ID to a pullable digest reference
          ansible.builtin.command: "podman inspect {{ item.stdout }} --format '{{ '{{' }} index .RepoDigests 0 {{ '}}' }}'"
          become: true
          loop: "{{ reference_image_ids.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          register: reference_digest_refs
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Save the reference host's image digests, keyed by unit name
          ansible.builtin.set_fact:
            reference_image_digests: "{{ dict(podman_units | map(attribute='name') | zip(reference_digest_refs.results | map(attribute='stdout'))) }}"
          delegate_to: localhost
          delegate_facts: true
          when: host_overall_status == 'OK'

- name: Align this peer's images to the reference host's exact versions (only if a reference host was provided and confirmed healthy)
  hosts: "{{ peer_host }}"
  gather_facts: false
  tasks:
    - name: Align Postgres/Semaphore images to the reference host
      include_role:
        name: podman_align_image
      vars:
        podman_align_reference_digests: "{{ hostvars['localhost'].reference_image_digests }}"
      when: hostvars['localhost'].reference_image_digests is defined

- name: Bump this peer's Semaphore image if a newer patch/minor is available (skipped in the image_reference_host direction, which uses exact-digest alignment above instead)
  hosts: "{{ peer_host }}"
  gather_facts: false
  tasks:
    - name: Auto-bump (or apply an explicit semaphore_image_tag) Semaphore's image
      when: image_reference_host is not defined
      block:
        - name: Get the currently configured Semaphore image reference
          ansible.builtin.command: podman inspect semaphore --format '{{ '{{' }}.ImageName{{ '}}' }}'
          register: semaphore_current_image_ref
          changed_when: false
          become: true

        - name: Extract the current version
          ansible.builtin.set_fact:
            semaphore_current_version: "{{ semaphore_current_image_ref.stdout.split(':')[-1] }}"

        - name: Determine the target tag automatically (latest stable release within the same major line) when semaphore_image_tag isn't explicitly passed
          when: semaphore_image_tag is not defined
          block:
            - name: Extract the current version's major line
              ansible.builtin.set_fact:
                semaphore_current_major: "{{ semaphore_current_version | regex_replace('^v?([0-9]+)\\..*$', '\\1') }}"

            - name: Query available Semaphore tags on Docker Hub
              ansible.builtin.uri:
                url: "https://hub.docker.com/v2/repositories/semaphoreui/semaphore/tags?page_size=100"
                return_content: true
              register: semaphore_tags_response
              delegate_to: localhost

            - name: Filter to pure vMAJOR.MINOR.PATCH tags in the same major line (excludes beta/rc/arch-suffixed tags)
              ansible.builtin.set_fact:
                semaphore_candidate_versions: >-
                  {{
                    semaphore_tags_response.json.results
                    | map(attribute='name')
                    | select('match', '^v' + semaphore_current_major | regex_escape() + '\.[0-9]+\.[0-9]+$')
                    | list
                  }}

            - name: Rank each candidate by its [major, minor, patch] numbers, paired with its tag string
              ansible.builtin.set_fact:
                semaphore_ranked_versions: "{{ semaphore_candidate_versions | map('regex_findall', '[0-9]+') | map('map', 'int') | map('list') | list | zip(semaphore_candidate_versions) | map('list') | list }}"

            - name: Set the auto-detected target tag (highest-ranked candidate)
              ansible.builtin.set_fact:
                semaphore_image_tag: "{{ (semaphore_ranked_versions | sort)[-1][1] }}"

        - name: Update the Image= line in semaphore.container (only if the target tag is actually different)
          when: semaphore_image_tag != semaphore_current_version
          block:
            - name: Update the Image= line in semaphore.container
              ansible.builtin.replace:
                path: /etc/containers/systemd/semaphore.container
                regexp: '^Image=docker\.io/semaphoreui/semaphore:.*$'
                replace: "Image=docker.io/semaphoreui/semaphore:{{ semaphore_image_tag }}"
              become: true

            - name: Reload systemd to pick up the change
              ansible.builtin.systemd:
                daemon_reload: true
              become: true

            - name: Restart the Semaphore service
              ansible.builtin.systemd:
                name: semaphore.service
                state: restarted
              become: true

- name: Confirm the peer Semaphore instance is back up
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Wait for {{ peer_host }}'s Semaphore web service to respond"
      ansible.builtin.uri:
        url: "http://{{ hostvars[peer_host].ansible_host }}:3000/api/ping"
        status_code: 200
        timeout: 10
      register: peer_semaphore_ping
      retries: 30
      delay: 10
      until: (peer_semaphore_ping.status | default(0)) == 200

- name: Keep this repo's provisioning template in sync with any Semaphore version bump that was just applied
  hosts: localhost
  gather_facts: false
  vars:
    semaphore_bumped_tag: "{{ hostvars[peer_host].semaphore_image_tag | default('') }}"
    semaphore_previous_tag: "{{ hostvars[peer_host].semaphore_current_version | default('') }}"
  tasks:
    - name: Update, commit and push the new version to roles/semaphore_provision/files/semaphore.container
      when:
        - semaphore_bumped_tag != ''
        - semaphore_bumped_tag != semaphore_previous_tag
      block:
        - name: Update the Image= line in this repo's provisioning template
          ansible.builtin.replace:
            path: /repos/homelab-iac/roles/semaphore_provision/files/semaphore.container
            regexp: '^Image=docker\.io/semaphoreui/semaphore:.*$'
            replace: "Image=docker.io/semaphoreui/semaphore:{{ semaphore_bumped_tag }}"

        - name: Configure a git identity for this commit (harmless if already set)
          ansible.builtin.command: "{{ item }}"
          loop:
            - git config user.email "semaphore-automation@{{ peer_host }}"
            - git config user.name "Semaphore automation"
          args:
            chdir: /repos/homelab-iac
          changed_when: false

        - name: Commit the version bump
          ansible.builtin.command: >-
            git commit -am "Bump provisioned Semaphore image to {{ semaphore_bumped_tag }} (applied to {{ peer_host }} by update-semaphore-peer.yml)"
          args:
            chdir: /repos/homelab-iac

        - name: Push the commit to origin/main
          ansible.builtin.command: "git push https://{{ github_push_token }}@github.com/dlecrivain/homelab-iac main"
          args:
            chdir: /repos/homelab-iac
          no_log: true

- name: Check whether a newer Postgres major version is available (informational only - a major-version bump needs a real data migration, never applied automatically)
  hosts: "{{ peer_host }}"
  gather_facts: false
  tasks:
    - name: Get the currently running Postgres image reference
      ansible.builtin.command: podman inspect semaphore_db --format '{{ '{{' }}.ImageName{{ '}}' }}'
      register: postgres_current_image_ref
      changed_when: false
      become: true

    - name: Query available Postgres tags on Docker Hub
      ansible.builtin.uri:
        url: "https://hub.docker.com/v2/repositories/library/postgres/tags?page_size=100"
        return_content: true
      register: postgres_tags_response
      delegate_to: localhost
      ignore_errors: true

    - name: Determine the current and latest published Postgres major version
      ansible.builtin.set_fact:
        postgres_current_major: "{{ postgres_current_image_ref.stdout.split(':')[-1] | int }}"
        postgres_latest_major: "{{ postgres_tags_response.json.results | map(attribute='name') | select('match', '^[0-9]+$') | map('int') | list | max }}"
      when: postgres_tags_response is succeeded

    - name: Notify by email that a newer Postgres major version is available
      include_role:
        name: send_report
      vars:
        report_subject: "[update-semaphore-peer] Newer Postgres major version available: {{ postgres_latest_major }}"
        report_body: |
          <h2>Postgres version check</h2>
          <p>{{ peer_host }} is running Postgres major version <strong>{{ postgres_current_major }}</strong>. The latest published major version on Docker Hub is <strong>{{ postgres_latest_major }}</strong>.</p>
          <p>Semaphore has been reported working with Postgres versions up to 17 (not confirmed beyond that) — check Semaphore's own release notes/docs before upgrading.</p>
          <p><strong>This is informational only — nothing is applied automatically, and this is not a simple image swap like Semaphore's own image:</strong> Postgres refuses to start against a data directory from a different major version, so a bump needs a real migration (<code>pg_upgrade</code> or dump/restore), planned and tested manually — not just editing <code>Image=</code> in semaphore-db.container.</p>
      when:
        - postgres_tags_response is succeeded
        - (postgres_current_major | int) != (postgres_latest_major | int)
