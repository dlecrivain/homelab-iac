---
- name: Check and update all VMs except semaphore101/102
  # semaphore102 is excluded for the same reason semaphore101 always was: update-semaphore-peer.yml
  # already covers its OS patching (and its container alignment), so processing it here too is
  # redundant and, worse, races with that dedicated pass in the same full-updates.yml run.
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!semaphore101:!semaphore102') }}"
  gather_facts: true
  serial: 1
  tasks:
    - name: Resolve a reachable Proxmox node for delegate_to (falls back to pve2/pve3 if pve1 is down)
      include_role:
        name: resolve_proxmox_api_host

    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Capture this stage's own start time
      include_role:
        name: capture_start_time
      vars:
        capture_start_time_fact_name: vm_updates_start_epoch

    - name: Capture the full list of targeted hosts (once)
      include_role:
        name: capture_host_list
      vars:
        capture_host_list_fact_name: vm_updates_host_list

    - name: Update this VM (skipped if an earlier stage in an orchestrated run had a problem)
      when: hostvars['localhost'].orchestration_should_run | default(true)
      block:
        - name: Step 1 - Remove any leftover patching snapshot from a previous run
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_patching

        - name: Step 2 - Check for available updates
          include_role:
            name: check_updates

        - name: Snapshot, update and reboot the VM (only if updates are available)
          when: has_updates | default(false) | bool
          block:
            - name: Step 3 - Proxmox snapshot
              vars:
                snapshot_label: ansible_patching
              include_role:
                name: proxmox_snapshot

            - name: Step 4 - Apply updates
              include_role:
                name: apply_updates
              when: not (snapshot_already_exists | default(false))

            - name: Step 5 - Reboot and wait
              include_role:
                name: reboot_and_wait
              when: not (snapshot_already_exists | default(false))

        - name: Step 6 - Check services
          include_role:
            name: health_check

        - name: Determine overall host status
          include_role:
            name: host_status

        - name: Record whether an update was applied or skipped for this host
          ansible.builtin.set_fact:
            host_update_applied: "{{ (has_updates | default(false) | bool) and not (snapshot_already_exists | default(false)) }}"
            host_update_skipped: "{{ (has_updates | default(false) | bool) and (snapshot_already_exists | default(false)) }}"

        - name: Step 7 - Remove the patching snapshot now that the host is healthy
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_patching
          when:
            - has_updates | default(false) | bool
            - host_overall_status == 'OK'

      rescue:
        - name: Mark this host as having a problem, and record why
          ansible.builtin.set_fact:
            host_overall_status: PROBLEM
            host_update_failure_reason: "{{ ansible_failed_result.msg | default('Unknown error') }}"

- name: Send aggregated vm-updates report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record whether this stage was allowed to run
      ansible.builtin.set_fact:
        stage_was_allowed_to_run: "{{ hostvars['localhost'].orchestration_should_run | default(true) }}"

    - name: Determine if any host has a problem
      ansible.builtin.set_fact:
        any_problem: "{{ hostvars['localhost'].vm_updates_host_list | map('extract', hostvars) | map(attribute='host_overall_status', default='OK') | select('equalto', 'PROBLEM') | list | length > 0 }}"

    - name: Update the orchestration gate for any later stage
      ansible.builtin.set_fact:
        orchestration_should_run: "{{ stage_was_allowed_to_run and not any_problem }}"

    - name: Determine this stage's status label
      ansible.builtin.set_fact:
        vm_updates_stage_status: "{{ 'SKIPPED' if not stage_was_allowed_to_run else ('PROBLEM' if any_problem else 'OK') }}"

    - name: Compute this stage's own duration
      ansible.builtin.set_fact:
        vm_updates_duration_seconds: "{{ (now(fmt='%s') | int) - (hostvars['localhost'].vm_updates_start_epoch | int) }}"

    - name: Format this stage's duration for display
      ansible.builtin.set_fact:
        vm_updates_duration_display: "{{ (vm_updates_duration_seconds | int // 3600) }}h {{ ((vm_updates_duration_seconds | int % 3600) // 60) }}m {{ (vm_updates_duration_seconds | int % 60) }}s"

    - name: Capture this stage's report body
      ansible.builtin.set_fact:
        vm_updates_report_body: |
          <h2>VM updates report</h2>
          {% if not stage_was_allowed_to_run %}
          <p class="alert-warning">
            <strong>Skipped.</strong> An earlier stage in this orchestrated run reported a problem, so VM updates were not attempted.
          </p>
          {% endif %}
          <table>
            <tr>
              <th>Host</th>
              <th>Update Status</th>
              <th>URL Status</th>
            </tr>
            {% for h in hostvars['localhost'].vm_updates_host_list %}
            {% if hostvars[h].host_overall_status is defined %}
            {% if hostvars[h].host_overall_status == 'PROBLEM' %}
            {% set row_class = 'status-problem' %}
            {% elif hostvars[h].host_update_skipped | default(false) %}
            {% set row_class = 'status-warning' %}
            {% elif hostvars[h].host_update_applied | default(false) %}
            {% set row_class = 'status-info' %}
            {% else %}
            {% set row_class = 'status-ok' %}
            {% endif %}
            <tr class="{{ row_class }}">
              <td>{{ h }}</td>
              <td>
                {% if hostvars[h].host_update_failure_reason is defined %}
                {{ hostvars[h].host_update_failure_reason }}
                {% elif hostvars[h].host_update_skipped | default(false) %}
                Skipped — an "ansible_patching" snapshot already existed
                {% elif hostvars[h].host_update_applied | default(false) %}
                Updated and rebooted
                {% else %}
                No update needed
                {% endif %}
              </td>
              <td>{{ hostvars[h].health_check_url_status | default('N/A') }}</td>
            </tr>
            {% endif %}
            {% endfor %}
          </table>

    - name: Build and send the HTML report email (skipped when part of an orchestrated run; the combined email covers it instead)
      include_role:
        name: send_report
      when: not (hostvars['localhost'].is_orchestrated_run | default(false))
      vars:
        report_subject: "[vm-updates] {{ 'SKIPPED (previous stage had a problem)' if not stage_was_allowed_to_run else ('PROBLEM detected' if any_problem else 'Weekly patch report') }}"
        report_body: "{{ vm_updates_report_body }}"
