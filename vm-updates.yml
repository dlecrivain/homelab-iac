---
- name: Promote CV_Rocky_10
  hosts: "{{ lpkat_host | default('lpkat101') }}"
  gather_facts: false
  vars:
    content_view_name: CV_Rocky_10
  roles:
    - katello_promote

- name: Check and update all VMs except lpkat101 and semaphore101
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!lpkat101:!semaphore101') }}"
  gather_facts: true
  serial: 1
  tasks:
    - name: Capture the full list of targeted hosts (once)
      include_role:
        name: capture_host_list

    - name: Step 1 - Check for available updates
      include_role:
        name: check_updates

    - name: Snapshot, update and reboot the VM (only if updates are available)
      when: has_updates | default(false) | bool
      block:
        - name: Step 2 - Proxmox snapshot
          vars:
            snapshot_label: ansible_patching
          include_role:
            name: proxmox_snapshot

        - name: Step 3 - Apply updates
          include_role:
            name: apply_updates
          when: not (snapshot_already_exists | default(false))

        - name: Step 4 - Reboot and wait
          include_role:
            name: reboot_and_wait
          when: not (snapshot_already_exists | default(false))

    - name: Step 5 - Check services
      include_role:
        name: health_check

    - name: Determine overall host status
      include_role:
        name: host_status

    - name: Record whether an update was applied or skipped for this host
      ansible.builtin.set_fact:
        host_update_applied: "{{ (has_updates | default(false) | bool) and not (snapshot_already_exists | default(false)) }}"
        host_update_skipped: "{{ (has_updates | default(false) | bool) and (snapshot_already_exists | default(false)) }}"

    - name: Step 6 - Remove the patching snapshot now that the host is healthy
      include_role:
        name: cleanup_snapshot
      vars:
        snapshot_label: ansible_patching
      when:
        - has_updates | default(false) | bool
        - host_overall_status == 'OK'

- name: Send aggregated vm-updates report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build and send the HTML report email
      include_role:
        name: send_report
      vars:
        report_subject: "[vm-updates] Weekly patch report"
        report_body: |
          <h2>VM updates report</h2>
          <table>
            <tr>
              <th>Host</th>
              <th>Update Status</th>
              <th>URL Status</th>
            </tr>
            {% for h in hostvars['localhost'].target_host_list %}
            {% if hostvars[h].host_overall_status is defined %}
            {% if hostvars[h].host_overall_status == 'PROBLEM' %}
            {% set row_class = 'status-problem' %}
            {% elif hostvars[h].host_update_skipped | default(false) %}
            {% set row_class = 'status-warning' %}
            {% elif hostvars[h].host_update_applied | default(false) %}
            {% set row_class = 'status-info' %}
            {% else %}
            {% set row_class = 'status-ok' %}
            {% endif %}
            <tr class="{{ row_class }}">
              <td>{{ h }}</td>
              <td>
                {% if hostvars[h].host_update_skipped | default(false) %}
                Skipped — an "ansible_patching" snapshot already existed
                {% elif hostvars[h].host_update_applied | default(false) %}
                Updated and rebooted
                {% else %}
                No update needed
                {% endif %}
              </td>
              <td>{{ hostvars[h].health_check_url_status | default('N/A') }}</td>
            </tr>
            {% endif %}
            {% endfor %}
          </table>
