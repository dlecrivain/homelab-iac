---
- name: "Remove {{ snapshot_label }} snapshots across all targeted VMs"
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!lpkat101:!semaphore101') }}"
  gather_facts: false
  vars:
    snapshot_label: ansible_patching
  tasks:
    - name: "Remove the {{ snapshot_label }} snapshot if it exists"
      include_role:
        name: cleanup_snapshot
