---
- name: Promote CV_Proxmox
  hosts: "{{ lpkat_host | default('lpkat101') }}"
  gather_facts: false
  vars:
    content_view_name: CV_Proxmox
  pre_tasks:
    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Capture this stage's own start time
      include_role:
        name: capture_start_time
      vars:
        capture_start_time_fact_name: pve_updates_start_epoch
  roles:
    - role: katello_promote
      when: hostvars['localhost'].orchestration_should_run | default(true)

- name: PVE host updates - evacuate, patch, reboot
  hosts: "{{ target_pve_hosts | default('pve1,pve2,pve3') }}"
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    pve_all_nodes:
      - pve1
      - pve2
      - pve3
    pve_other_nodes: "{{ pve_all_nodes | difference([inventory_hostname]) }}"
    proxmox_api_node: "{{ pve_other_nodes | first }}"
    proxmox_api_host: "{{ hostvars[proxmox_api_node].ansible_host }}"
  tasks:
    - name: Capture the full list of targeted hosts (once)
      include_role:
        name: capture_host_list
      vars:
        capture_host_list_fact_name: pve_updates_host_list

    - name: Process this host, aborting the whole run on any failure
      when: hostvars['localhost'].orchestration_should_run | default(true)
      block:
        - name: Capture the current PVE version
          ansible.builtin.command: pveversion
          register: pveversion_before
          changed_when: false

        - name: Step 1 - Check for available updates
          include_role:
            name: check_updates

        - name: Evacuate, patch and reboot the host (only if updates are available)
          when: has_updates | default(false) | bool
          block:
            - name: Step 2 - Evacuate all VMs from this host (snapshots cleaned automatically before each move)
              include_role:
                name: pve_evacuate_host

            - name: Step 3 - Apply updates (apt full-upgrade)
              include_role:
                name: apply_updates

            - name: Step 4 - Reboot and wait for the host to come back
              include_role:
                name: reboot_and_wait

        - name: Capture the PVE version after update
          ansible.builtin.command: pveversion
          register: pveversion_after
          changed_when: false

        - name: Mark this host as successfully processed
          ansible.builtin.set_fact:
            pve_host_status: "{{ 'OK' if (has_updates | default(false) | bool) else 'NO_UPDATE' }}"
            pve_version_before: "{{ pveversion_before.stdout }}"
            pve_version_after: "{{ pveversion_after.stdout }}"

      rescue:
        - name: Mark this host as blocked, and record why
          ansible.builtin.set_fact:
            pve_host_status: "BLOCKED"
            pve_host_failure_reason: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Stop the entire run - no further hosts will be processed
          ansible.builtin.meta: end_play

- name: Global rebalance after all hosts are patched
  hosts: "{{ target_pve_hosts | default('pve1,pve2,pve3') }}"
  gather_facts: false
  run_once: true
  vars:
    pve_all_nodes:
      - pve1
      - pve2
      - pve3
    proxmox_api_host: "{{ hostvars[pve_all_nodes | first].ansible_host }}"
  tasks:
    - name: Determine locally if any host was blocked during this run
      ansible.builtin.set_fact:
        rebalance_should_run: >-
          {{
            (hostvars['localhost'].orchestration_should_run | default(true))
            and (ansible_play_hosts_all | map('extract', hostvars) | map(attribute='pve_host_status', default='NOT_PROCESSED') | select('equalto', 'BLOCKED') | list | length == 0)
          }}

    - name: Rebalance the whole cluster (skipped if any host was blocked earlier, or this stage was itself skipped)
      include_role:
        name: pve_rebalance
      when: rebalance_should_run | bool

- name: Send aggregated pve-updates report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record whether this stage was allowed to run
      ansible.builtin.set_fact:
        stage_was_allowed_to_run: "{{ hostvars['localhost'].orchestration_should_run | default(true) }}"

    - name: Determine if the run was halted due to a blocked host
      ansible.builtin.set_fact:
        run_was_halted: "{{ hostvars['localhost'].pve_updates_host_list | map('extract', hostvars) | map(attribute='pve_host_status', default='NOT_PROCESSED') | select('equalto', 'BLOCKED') | list | length > 0 }}"

    - name: Update the orchestration gate for any later stage
      ansible.builtin.set_fact:
        orchestration_should_run: "{{ stage_was_allowed_to_run and not run_was_halted }}"

    - name: Determine this stage's status label
      ansible.builtin.set_fact:
        pve_updates_stage_status: "{{ 'SKIPPED' if not stage_was_allowed_to_run else ('PROBLEM' if run_was_halted else 'OK') }}"

    - name: Compute this stage's own duration
      ansible.builtin.set_fact:
        pve_updates_duration_seconds: "{{ (now(fmt='%s') | int) - (hostvars['localhost'].pve_updates_start_epoch | int) }}"

    - name: Format this stage's duration for display
      ansible.builtin.set_fact:
        pve_updates_duration_display: "{{ (pve_updates_duration_seconds | int // 3600) }}h {{ ((pve_updates_duration_seconds | int % 3600) // 60) }}m {{ (pve_updates_duration_seconds | int % 60) }}s"

    - name: Best-effort check for a newer major PVE release (informational only, never acted upon)
      ansible.builtin.uri:
        url: http://download.proxmox.com/debian/pve/dists/
        return_content: true
      register: pve_dists_check
      ignore_errors: true

    - name: Determine if a newer suite than trixie is published
      ansible.builtin.set_fact:
        newer_pve_suite_available: "{{ (pve_dists_check.content is defined) and ('forky' in pve_dists_check.content) }}"

    - name: Capture this stage's report body
      ansible.builtin.set_fact:
        pve_updates_report_body: |
          <h2>PVE hosts update report</h2>
          {% if not stage_was_allowed_to_run %}
          <p class="alert-warning">
            <strong>Skipped.</strong> An earlier stage in this orchestrated run reported a problem, so PVE host updates were not attempted.
          </p>
          {% endif %}
          {% if run_was_halted %}
          <p class="alert-danger">
            <strong>The run was stopped.</strong> A host failed during processing, so no further hosts were touched, as configured. The final cluster rebalance was skipped.
          </p>
          {% endif %}
          {% if newer_pve_suite_available | default(false) %}
          <p class="alert-warning">
            <strong>Note:</strong> A newer Proxmox VE major release appears to be available upstream. This has NOT been applied automatically — review manually if you want to upgrade.
          </p>
          {% endif %}
          <table>
            <tr>
              <th>Host</th>
              <th>Status</th>
              <th>Version</th>
              <th>Details</th>
            </tr>
            {% for h in hostvars['localhost'].pve_updates_host_list %}
            {% set st = hostvars[h].pve_host_status | default('NOT_PROCESSED') %}
            {% if st == 'OK' %}
            {% set row_class = 'status-info' %}
            {% elif st == 'NO_UPDATE' %}
            {% set row_class = 'status-ok' %}
            {% elif st == 'BLOCKED' %}
            {% set row_class = 'status-problem' %}
            {% else %}
            {% set row_class = 'status-neutral' %}
            {% endif %}
            <tr class="{{ row_class }}">
              <td>{{ h }}</td>
              <td>{{ st }}</td>
              <td>
                {% if hostvars[h].pve_version_before is defined %}
                {% if hostvars[h].pve_version_before == hostvars[h].pve_version_after %}
                {{ hostvars[h].pve_version_after }} (unchanged)
                {% else %}
                {{ hostvars[h].pve_version_before }} → {{ hostvars[h].pve_version_after }}
                {% endif %}
                {% else %}
                N/A
                {% endif %}
              </td>
              <td>
                {% if st == 'BLOCKED' %}
                {{ hostvars[h].pve_host_failure_reason | default('Unknown error') }}
                {% elif st == 'NOT_PROCESSED' %}
                Skipped — run was stopped before reaching this host
                {% elif st == 'NO_UPDATE' %}
                No updates were available, host left untouched
                {% else %}
                Evacuated, updated and rebooted successfully
                {% endif %}
              </td>
            </tr>
            {% endfor %}
          </table>

    - name: Build and send the HTML report email (skipped when part of an orchestrated run; the combined email covers it instead)
      include_role:
        name: send_report
      when: not (hostvars['localhost'].is_orchestrated_run | default(false))
      vars:
        report_subject: "[pve-updates] {{ 'SKIPPED (previous stage had a problem)' if not stage_was_allowed_to_run else ('STOPPED - manual intervention needed' if run_was_halted else 'Run completed') }}"
        report_body: "{{ pve_updates_report_body }}"
