---
# Detects available updates for images with no dedicated auto-bump mechanism of their own. A
# same-major-line update is bumped into group_vars/all.yml immediately on detection, but the
# container itself is never touched here - container-updates.yml (normally run via
# full-updates.yml) is what actually applies it, like any other config change, the next time it
# runs. A major-line jump (e.g. v3.x -> v4.x) is only ever reported, never auto-applied.
#
# phpIPAM's phpipam-web/phpipam-cron are in the watch list below like everyone else (both point
# at the same phpipam_version - they always move together, same release). Semaphore is the one
# exception: update-semaphore-peer.yml already applies its own bump immediately, tied to patching
# semaphore102, so it's deliberately not in image_update_watch_list.
#
# Immich is excluded from the watch list entirely (not Ansible-managed, GHCR + digest pins + a
# floating "release" tag with no version in the image reference at all) - it gets a completely
# separate, read-only comparison instead: its own reported version against its GitHub releases.
#
# node_exporter and smartctl_exporter get the same same-major-line auto-bump treatment as the
# Docker Hub images below, but via a separate GitHub Releases check further down (own play) -
# they're native binaries installed fleet-wide by node_exporter_install/smartctl_exporter_install,
# not a single container to compare a "live" version against, so they can't share the watch list's
# live-catch-up tracking. A bump here applies the next time the relevant install role runs.
- name: Check Docker Hub for updates to unmanaged-bump images
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Query Docker Hub tags for each watched image
      ansible.builtin.uri:
        url: "https://hub.docker.com/v2/repositories/{{ item.docker_repo }}/tags?page_size=100"
        return_content: true
      register: image_update_tags_response
      loop: "{{ image_update_watch_list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Compute each image's same-major-line target (safe to auto-bump), overall latest available version (for the major-jump warning), and whether either applies"
      vars:
        current_version: "{{ lookup('vars', item.item.version_var) }}"
        current_major: "{{ current_version | regex_replace('^v?([0-9]+)\\..*$', '\\1') }}"
        all_versions: "{{ item.json.results | map(attribute='name') | select('match', '^v?[0-9]+\\.[0-9]+\\.[0-9]+$') | list }}"
        same_major_versions: "{{ all_versions | select('match', '^v?' + current_major | regex_escape() + '\\.[0-9]+\\.[0-9]+$') | list }}"
        same_major_ranked: "{{ same_major_versions | map('regex_findall', '[0-9]+') | map('map', 'int') | map('list') | list | zip(same_major_versions) | map('list') | list }}"
        all_ranked: "{{ all_versions | map('regex_findall', '[0-9]+') | map('map', 'int') | map('list') | list | zip(all_versions) | map('list') | list }}"
        same_major_target: "{{ (same_major_ranked | sort)[-1][1] if (same_major_ranked | length > 0) else current_version }}"
        overall_latest: "{{ (all_ranked | sort)[-1][1] if (all_ranked | length > 0) else current_version }}"
        overall_latest_major: "{{ overall_latest | regex_replace('^v?([0-9]+)\\..*$', '\\1') }}"
      ansible.builtin.set_fact:
        image_update_checks: >-
          {{
            (image_update_checks | default([])) + [{
              'name': item.item.name,
              'version_var': item.item.version_var,
              'container_name': item.item.container_name,
              'host': item.item.host,
              'current_version': current_version,
              'same_major_target': same_major_target,
              'same_major_target_pushed_at': (item.json.results | selectattr('name', 'equalto', same_major_target) | map(attribute='tag_last_pushed') | first | default('')),
              'bump_needed': same_major_target != current_version,
              'overall_latest': overall_latest,
              'overall_latest_pushed_at': (item.json.results | selectattr('name', 'equalto', overall_latest) | map(attribute='tag_last_pushed') | first | default('')),
              'major_available': (overall_latest_major | int) > (current_major | int),
            }]
          }}
      loop: "{{ image_update_tags_response.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Bump group_vars/all.yml immediately for every image where a same-major-line update was found (the container itself isn't touched - the next container-updates run applies it like any other config change)"
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/group_vars/all.yml"
        regexp: '^{{ item.version_var }}: ".*"$'
        replace: '{{ item.version_var }}: "{{ item.same_major_target }}"'
      loop: "{{ image_update_checks | selectattr('bump_needed') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: image_update_bump_result

    - name: Configure a git identity for this commit (harmless if already set)
      ansible.builtin.command: "{{ item }}"
      loop:
        - git config user.email "d.lecrivain47@gmail.com"
        - git config user.name "dlecrivain"
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false
      when: image_update_bump_result.changed | default(false)

    - name: Commit the version bump(s)
      ansible.builtin.command: >-
        git commit -am "Bump pinned image version(s): {{ image_update_checks | selectattr('bump_needed') | map(attribute='name') | join(', ') }} (detected by check-image-updates.yml)"
      args:
        chdir: "{{ playbook_dir }}"
      when: image_update_bump_result.changed | default(false)

    - name: Push the commit to origin/main
      ansible.builtin.command: "git push https://{{ github_push_token }}@github.com/dlecrivain/homelab-iac main"
      args:
        chdir: "{{ playbook_dir }}"
      register: image_update_git_push
      failed_when: false
      no_log: true
      when: image_update_bump_result.changed | default(false)

    - name: Fail with a token-redacted error if the push failed
      ansible.builtin.fail:
        msg: >-
          git push failed (rc={{ image_update_git_push.rc }}):
          {{
            (image_update_git_push.stderr | default('')) | replace(github_push_token, '***REDACTED***')
            if (github_push_token | default('') | length > 0)
            else (image_update_git_push.stderr | default('')) + ' (github_push_token is empty - GITHUB_PUSH_TOKEN missing from this template''s Variable Group)'
          }}
      when:
        - image_update_bump_result.changed | default(false)
        - image_update_git_push.rc != 0

- name: Check whether each watched image's live container has caught up to its target version yet
  hosts: "{{ prometheus_host | default('prometheus101') }},{{ grafana_host | default('grafana101') }},{{ phpipam_host | default('phpipam101') }},bunkerweb101,adguard101"
  gather_facts: false
  tasks:
    - name: Capture the full list of targeted hosts (once, so the aggregation play below knows who to collect from)
      include_role:
        name: capture_host_list
      vars:
        capture_host_list_fact_name: image_update_live_check_host_list

    - name: "Get the live image tag for each watched container on this host (no become on adguard101 - it runs rootless as the connecting user itself, root's podman can't see it)"
      vars:
        my_checks: "{{ hostvars['localhost'].image_update_checks | selectattr('host', 'equalto', inventory_hostname) | list }}"
      ansible.builtin.command: "podman inspect {{ item.container_name }} --format '{{ '{{' }}.ImageName{{ '}}' }}'"
      become: "{{ inventory_hostname != 'adguard101' }}"
      register: image_update_live_tags
      changed_when: false
      loop: "{{ my_checks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Save this host's own live tags as its own local fact, keyed by name (kept per-host - a later aggregation play combines every host's dict on localhost in one pass, since multiple hosts writing the same delegated fact in this same task would race and clobber each other)"
      ansible.builtin.set_fact:
        image_update_live_versions: "{{ dict(image_update_live_tags.results | map(attribute='item') | map(attribute='name') | zip(image_update_live_tags.results | map(attribute='stdout') | map('regex_replace', '^.*:', ''))) }}"

- name: Aggregate the live-tag check results onto localhost
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Combine every host's image_update_live_versions into one dict
      ansible.builtin.set_fact:
        image_update_live_versions: "{{ image_update_live_check_host_list | map('extract', hostvars, 'image_update_live_versions') | select('defined') | list | combine }}"

- name: "Check GitHub Releases for node_exporter/smartctl_exporter updates and bump their pin immediately if found (these are native binaries installed fleet-wide by node_exporter_install/smartctl_exporter_install, not a Docker Hub image or a single container to inspect - so unlike the watch list above, there's no 'live container caught up yet' check possible here. A same-major bump applies the next time the relevant install role actually runs, e.g. the next configure-monitoring.yml reconciliation pass, not on any routine patch cycle)"
  hosts: localhost
  gather_facts: false
  vars:
    binary_update_watch_list:
      - name: node_exporter
        github_repo: prometheus/node_exporter
        version_var: node_exporter_version
      - name: smartctl_exporter
        github_repo: prometheus-community/smartctl_exporter
        version_var: smartctl_exporter_version
  tasks:
    - name: Query recent GitHub releases for each watched binary
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ item.github_repo }}/releases?per_page=100"
        return_content: true
      register: binary_update_releases_response
      loop: "{{ binary_update_watch_list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Compute each binary's same-major-line target (safe to auto-bump) and overall latest (for the major-jump warning) - same logic as the Docker Hub check above, adapted to GitHub's vX.Y.Z release tags"
      vars:
        current_version: "{{ lookup('vars', item.item.version_var) }}"
        current_major: "{{ current_version | regex_replace('^v?([0-9]+)\\..*$', '\\1') }}"
        all_versions: "{{ item.json | map(attribute='tag_name') | select('match', '^v[0-9]+\\.[0-9]+\\.[0-9]+$') | map('regex_replace', '^v', '') | list }}"
        same_major_versions: "{{ all_versions | select('match', '^' + current_major | regex_escape() + '\\.[0-9]+\\.[0-9]+$') | list }}"
        same_major_ranked: "{{ same_major_versions | map('regex_findall', '[0-9]+') | map('map', 'int') | map('list') | list | zip(same_major_versions) | map('list') | list }}"
        all_ranked: "{{ all_versions | map('regex_findall', '[0-9]+') | map('map', 'int') | map('list') | list | zip(all_versions) | map('list') | list }}"
        same_major_target: "{{ (same_major_ranked | sort)[-1][1] if (same_major_ranked | length > 0) else current_version }}"
        overall_latest: "{{ (all_ranked | sort)[-1][1] if (all_ranked | length > 0) else current_version }}"
        overall_latest_major: "{{ overall_latest | regex_replace('^v?([0-9]+)\\..*$', '\\1') }}"
      ansible.builtin.set_fact:
        binary_update_checks: >-
          {{
            (binary_update_checks | default([])) + [{
              'name': item.item.name,
              'version_var': item.item.version_var,
              'current_version': current_version,
              'same_major_target': same_major_target,
              'bump_needed': same_major_target != current_version,
              'overall_latest': overall_latest,
              'major_available': (overall_latest_major | int) > (current_major | int),
            }]
          }}
      loop: "{{ binary_update_releases_response.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Bump group_vars/all.yml immediately for every binary where a same-major-line update was found"
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/group_vars/all.yml"
        regexp: '^{{ item.version_var }}: ".*"$'
        replace: '{{ item.version_var }}: "{{ item.same_major_target }}"'
      loop: "{{ binary_update_checks | selectattr('bump_needed') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: binary_update_bump_result

    - name: Configure a git identity for this commit (harmless if already set)
      ansible.builtin.command: "{{ item }}"
      loop:
        - git config user.email "d.lecrivain47@gmail.com"
        - git config user.name "dlecrivain"
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false
      when: binary_update_bump_result.changed | default(false)

    - name: Commit the version bump(s)
      ansible.builtin.command: >-
        git commit -am "Bump pinned binary version(s): {{ binary_update_checks | selectattr('bump_needed') | map(attribute='name') | join(', ') }} (detected by check-image-updates.yml)"
      args:
        chdir: "{{ playbook_dir }}"
      when: binary_update_bump_result.changed | default(false)

    - name: Push the commit to origin/main
      ansible.builtin.command: "git push https://{{ github_push_token }}@github.com/dlecrivain/homelab-iac main"
      args:
        chdir: "{{ playbook_dir }}"
      register: binary_update_git_push
      failed_when: false
      no_log: true
      when: binary_update_bump_result.changed | default(false)

    - name: Fail with a token-redacted error if the push failed
      ansible.builtin.fail:
        msg: >-
          git push failed (rc={{ binary_update_git_push.rc }}):
          {{
            (binary_update_git_push.stderr | default('')) | replace(github_push_token, '***REDACTED***')
            if (github_push_token | default('') | length > 0)
            else (binary_update_git_push.stderr | default('')) + ' (github_push_token is empty - GITHUB_PUSH_TOKEN missing from this template''s Variable Group)'
          }}
      when:
        - binary_update_bump_result.changed | default(false)
        - binary_update_git_push.rc != 0

- name: Compare Immich's reported version against its latest GitHub release (informational only - not Ansible-managed, never touched here)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get Immich's own reported running version
      ansible.builtin.uri:
        url: "{{ hostvars['immich101'].health_check_url }}/api/server/version"
        return_content: true
      register: immich_running_version_response
      failed_when: false

    - name: Get the latest published Immich release from GitHub
      ansible.builtin.uri:
        url: "https://api.github.com/repos/immich-app/immich/releases/latest"
        return_content: true
      register: immich_latest_release_response
      failed_when: false

    - name: Compute Immich's running/latest version strings and whether an update is available
      when:
        - immich_running_version_response.status | default(0) == 200
        - immich_latest_release_response.status | default(0) == 200
      block:
        - name: Set Immich version facts
          ansible.builtin.set_fact:
            immich_running_version: "v{{ immich_running_version_response.json.major }}.{{ immich_running_version_response.json.minor }}.{{ immich_running_version_response.json.patch }}"
            immich_latest_version: "{{ immich_latest_release_response.json.tag_name }}"
            immich_latest_published_at: "{{ immich_latest_release_response.json.published_at }}"

        - name: Determine whether Immich has an update available
          ansible.builtin.set_fact:
            immich_update_available: "{{ immich_running_version != immich_latest_version }}"

- name: "Read-only scan of every other podman-managed container fleet-wide for a newer image (pull only - never restarts or redeploys anything, purely informational, no git writes)"
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!lpkat101:!semaphore101') }}"
  gather_facts: false
  vars:
    watched_container_names: "{{ hostvars['localhost'].image_update_watch_list | map(attribute='container_name') | list }}"
  tasks:
    - name: Capture the full list of targeted hosts (once, so the aggregation play below knows who to collect from)
      include_role:
        name: capture_host_list
      vars:
        capture_host_list_fact_name: fleet_image_check_host_list

    - name: Check each of this host's own podman_units not already covered by image_update_watch_list above
      include_tasks: tasks/check_unit_for_update.yml
      loop: "{{ (podman_units | default([])) | rejectattr('name', 'in', watched_container_names) | list }}"
      loop_control:
        loop_var: unit
        label: "{{ unit.name }}"
      when: podman_units is defined

- name: Aggregate the fleet-wide read-only scan results onto localhost
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Combine every host's fleet_image_checks into one list
      ansible.builtin.set_fact:
        fleet_image_checks: "{{ fleet_image_check_host_list | map('extract', hostvars, 'fleet_image_checks') | select('defined') | list | flatten(levels=1) }}"

- name: Send the notification email (only when there's something to report - stays quiet otherwise)
  hosts: localhost
  gather_facts: false
  vars:
    major_available_images: "{{ image_update_checks | selectattr('major_available') | list }}"
    fleet_update_available_images: "{{ fleet_image_checks | default([]) | selectattr('update_available') | list }}"
    binary_bumped: "{{ binary_update_checks | default([]) | selectattr('bump_needed') | list }}"
    binary_major_available: "{{ binary_update_checks | default([]) | selectattr('major_available') | list }}"
  tasks:
    - name: "Build the list of containers with a target version not yet deployed - covers both a bump that just happened this run and one recorded on an earlier run that's still waiting on the next container-updates. Disappears from this list the moment the container actually catches up, regardless of when the bump itself happened"
      ansible.builtin.set_fact:
        pending_deployment_images: "{{ (pending_deployment_images | default([])) + ([item] if (image_update_live_versions.get(item.name, '') != item.same_major_target) else []) }}"
      loop: "{{ image_update_checks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Merge watch-list bumps not yet deployed with the generic fleet-wide scan into one list (same underlying question - 'is a newer image available for this container' - so one table instead of forcing the reader to know which detection mechanism found it). Both apply automatically on the next container-updates run either way - podman_update pulls/restarts every podman_units entry regardless of pin status - the real difference is whether the bump was reviewable in git first"
      ansible.builtin.set_fact:
        unified_update_items: "{{ (unified_update_items | default([])) + [{'host': item.host, 'name': item.name, 'current': image_update_live_versions.get(item.name, 'unknown'), 'target': item.same_major_target, 'reviewed': true}] }}"
      loop: "{{ pending_deployment_images }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add the generic fleet-wide scan's own findings to the same merged list
      ansible.builtin.set_fact:
        unified_update_items: "{{ (unified_update_items | default([])) + [{'host': item.host, 'name': item.name, 'current': item.current_version, 'target': item.new_version, 'reviewed': false}] }}"
      loop: "{{ fleet_update_available_images }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Build the report body
      ansible.builtin.set_fact:
        image_update_report_body: |
          <h2>Image update check</h2>
          {% if unified_update_items | default([]) %}
          <h3>Container image updates available</h3>
          <table>
            <tr><th>Host</th><th>Image</th><th>Current</th><th>Available</th><th>Bump reviewed in git?</th></tr>
            {% for c in unified_update_items %}
            <tr class="status-info">
              <td>{{ c.host }}</td>
              <td>{{ c.name }}</td>
              <td>{{ c.current }}</td>
              <td>{{ c.target }}</td>
              <td>{{ 'Yes' if c.reviewed else 'No - not in image_update_watch_list' }}</td>
            </tr>
            {% endfor %}
          </table>
          <p>All of these apply automatically on the next container-updates run either way.</p>
          {% endif %}
          {% if major_available_images %}
          <h3>Major version available (not applied automatically)</h3>
          <table>
            <tr><th>Image</th><th>Current</th><th>Available</th><th>Published</th></tr>
            {% for c in major_available_images %}
            <tr class="status-warning">
              <td>{{ c.name }}</td>
              <td>{{ c.current_version }}</td>
              <td>{{ c.overall_latest }}</td>
              <td>{{ (c.overall_latest_pushed_at | to_datetime('%Y-%m-%dT%H:%M:%S.%fZ')).strftime('%d/%m/%Y') if c.overall_latest_pushed_at else 'N/A' }}</td>
            </tr>
            {% endfor %}
          </table>
          <p>Review manually - a major version jump can include breaking changes.</p>
          {% endif %}
          {% if binary_bumped %}
          <h3>Binary version(s) bumped (node_exporter / smartctl_exporter)</h3>
          <table>
            <tr><th>Binary</th><th>Old</th><th>New</th></tr>
            {% for c in binary_bumped %}
            <tr class="status-info">
              <td>{{ c.name }}</td>
              <td>{{ c.current_version }}</td>
              <td>{{ c.same_major_target }}</td>
            </tr>
            {% endfor %}
          </table>
          <p>Applied to group_vars/all.yml and pushed - takes effect the next time the relevant install role actually runs (e.g. the next configure-monitoring.yml reconciliation pass), not on any routine patch cycle.</p>
          {% endif %}
          {% if binary_major_available %}
          <h3>Binary major version available (not applied automatically)</h3>
          <table>
            <tr><th>Binary</th><th>Current</th><th>Available</th></tr>
            {% for c in binary_major_available %}
            <tr class="status-warning">
              <td>{{ c.name }}</td>
              <td>{{ c.current_version }}</td>
              <td>{{ c.overall_latest }}</td>
            </tr>
            {% endfor %}
          </table>
          <p>Review manually - a major version jump can include breaking changes.</p>
          {% endif %}
          {% if immich_update_available | default(false) %}
          <h3>Immich (informational only - not Ansible-managed)</h3>
          <table>
            <tr><th>Running</th><th>Latest</th><th>Published</th></tr>
            <tr class="status-warning">
              <td>{{ immich_running_version }}</td>
              <td>{{ immich_latest_version }}</td>
              <td>{{ (immich_latest_published_at | to_datetime('%Y-%m-%dT%H:%M:%SZ')).strftime('%d/%m/%Y') if immich_latest_published_at else 'N/A' }}</td>
            </tr>
          </table>
          {% endif %}

    - name: Send the email (only if there's actually something to report)
      include_role:
        name: send_report
      vars:
        report_subject: "[check-image-updates] {{ unified_update_items | default([]) | length }} image update(s) available, {{ major_available_images | length }} major available, {{ binary_bumped | length }} binaries bumped"
        report_body: "{{ image_update_report_body }}"
      when: (unified_update_items | default([]) | length > 0) or (major_available_images | length > 0) or (immich_update_available | default(false)) or (binary_bumped | length > 0) or (binary_major_available | length > 0)

