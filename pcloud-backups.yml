---
# Each host copies what its own pcloud_backup_jobs, in its host_vars, list. The pCloud remote lives in root's rclone
# configuration on the host, and root can read the files whoever owns them.
- name: Run pCloud backup(s) via rclone
  hosts: "{{ pcloud_backup_host | default('smb101') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Install rclone
      ansible.builtin.dnf:
        name: rclone
        state: present

    # What a job reads from another host is mounted read-only first, so rclone sees an ordinary folder. A host that
    # is down at boot does not hold up this one (nofail), and the play stops here if the share cannot be mounted.
    - name: Install the NFS client
      ansible.builtin.dnf:
        name: nfs-utils
        state: present
      when: pcloud_backup_mounts | default([]) | length > 0

    - name: Mount what the jobs read from other hosts
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: nfs4
        opts: ro,nfsvers=4.2,nosuid,nodev,noexec,_netdev,nofail
        state: mounted
      loop: "{{ pcloud_backup_mounts | default([]) }}"
      loop_control:
        label: "{{ item.path }}"

    # The remote holds a pCloud token, so it is copied by hand once and never stored in this repository.
    - name: Check that the pCloud remote is configured
      ansible.builtin.command: rclone listremotes
      register: pcloud_remotes
      changed_when: false

    - name: Fail clearly if the pCloud remote is missing
      ansible.builtin.fail:
        msg: "No pcloud: remote in root's rclone configuration on {{ inventory_hostname }} - copy rclone.conf to /root/.config/rclone/ (mode 0600), see the README"
      when: "'pcloud:' not in pcloud_remotes.stdout_lines"

    # Single-job mode: pcloud_backup_source (and dest/mode/extra_args) passed as extra vars.
    - name: Run a single pCloud backup
      include_role:
        name: pcloud_backup_job
      when: pcloud_backup_source is defined

    # All-jobs mode: no extra vars passed, run every job in the host's pcloud_backup_jobs in parallel.
    # Launched directly (not via the pcloud_backup_job role) because async/poll only apply
    # to a single module invocation, not to include_role.
    - name: Start pCloud backup
      ansible.builtin.command: >
        rclone {{ item.mode | default('sync') }} {{ item.source }} {{ item.dest }} {{ item.extra_args | default('') }}
      async: 21600
      poll: 0
      register: pcloud_launch
      loop: "{{ pcloud_backup_jobs | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: pcloud_backup_source is not defined

    - name: Wait for all pCloud backups to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: pcloud_wait
      until: pcloud_wait.finished
      retries: 720
      delay: 30
      loop: "{{ pcloud_launch.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      ignore_errors: true
      when: pcloud_backup_source is not defined

    # Includes a job that never finished within the 6-hour async window: it has no 'rc' at all
    # and would otherwise pass silently.
    - name: Determine all pCloud backup failures
      ansible.builtin.set_fact:
        pcloud_backup_failures: >-
          {%- set failures = [] -%}
          {%- for r in (pcloud_wait.results | default([])) -%}
            {%- if r.rc is defined and r.rc != 0 -%}
              {%- set _ = failures.append(r.item.item.name + ': ' + (r.stderr | default('unknown error'))) -%}
            {%- elif not (r.finished | default(0) | bool) -%}
              {%- set _ = failures.append(r.item.item.name + ': did not finish within the 6-hour async window') -%}
            {%- endif -%}
          {%- endfor -%}
          {{ failures | join(' | ') }}
      when: pcloud_backup_source is not defined

    - name: Fail clearly if any pCloud backup failed
      ansible.builtin.fail:
        msg: "pCloud backup failure(s): {{ pcloud_backup_failures }}"
      when:
        - pcloud_backup_source is not defined
        - pcloud_backup_failures | default('') | length > 0
