---
- name: Run pCloud backup(s) via rclone
  hosts: "{{ pcloud_backup_host | default('smb101') }}"
  gather_facts: false
  vars:
    pcloud_backup_jobs:
      - name: Home Assistant
        mode: sync
        source: /var/lib/Backups/Home_Assistant/
        dest: "pcloud:Backups/Home_Assistant"
        extra_args: "--log-file /var/log/rclone-pcloud.log --log-level INFO"
      - name: Immich Daniel
        mode: copy
        source: /mnt/immich_photos/ee67ced3-2998-420c-82b5-2768292c81ab/
        dest: "pcloud:Backups/Immich/Daniel"
      - name: Immich Marine
        mode: copy
        source: /mnt/immich_photos/1c98b908-3122-4969-b34a-e63b6a242994/
        dest: "pcloud:Backups/Immich/Marine"
  tasks:
    # Single-job mode: pcloud_backup_source (and dest/mode/extra_args) passed as extra vars.
    - name: Run a single pCloud backup
      include_role:
        name: pcloud_backup_job
      when: pcloud_backup_source is defined

    # All-jobs mode: no extra vars passed, run every job in pcloud_backup_jobs in parallel.
    # Launched directly (not via the pcloud_backup_job role) because async/poll only apply
    # to a single module invocation, not to include_role.
    - name: Start pCloud backup
      ansible.builtin.command: >
        rclone {{ item.mode | default('sync') }} {{ item.source }} {{ item.dest }} {{ item.extra_args | default('') }}
      async: 21600
      poll: 0
      register: pcloud_launch
      loop: "{{ pcloud_backup_jobs }}"
      loop_control:
        label: "{{ item.name }}"
      when: pcloud_backup_source is not defined

    - name: Wait for all pCloud backups to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: pcloud_wait
      until: pcloud_wait.finished
      retries: 720
      delay: 30
      loop: "{{ pcloud_launch.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      ignore_errors: true
      when: pcloud_backup_source is not defined

    - name: "Determine all pCloud backup failures (if any) - including a job that never finished within the 6-hour async window, which has no 'rc' at all and would otherwise pass silently"
      ansible.builtin.set_fact:
        pcloud_backup_failures: >-
          {%- set failures = [] -%}
          {%- for r in (pcloud_wait.results | default([])) -%}
            {%- if r.rc is defined and r.rc != 0 -%}
              {%- set _ = failures.append(r.item.item.name + ': ' + (r.stderr | default('unknown error'))) -%}
            {%- elif not (r.finished | default(0) | bool) -%}
              {%- set _ = failures.append(r.item.item.name + ': did not finish within the 6-hour async window') -%}
            {%- endif -%}
          {%- endfor -%}
          {{ failures | join(' | ') }}
      when: pcloud_backup_source is not defined

    - name: Fail clearly if any pCloud backup failed
      ansible.builtin.fail:
        msg: "pCloud backup failure(s): {{ pcloud_backup_failures }}"
      when:
        - pcloud_backup_source is not defined
        - pcloud_backup_failures | default('') | length > 0
