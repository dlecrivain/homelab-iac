---
# katello-publish.yml runs this same role right after publishing, which is where retention normally
# happens. This playbook stays as a standalone entry point for purging without a publish.
- name: Purge old content view versions beyond retention
  hosts: "{{ lpkat_host | default('lpkat101') }}"
  gather_facts: false
  tasks:
    - name: Purge content view versions beyond the retention count
      include_role:
        name: katello_cv_retention
