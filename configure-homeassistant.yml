---
- name: Configure Home Assistant
  hosts: "{{ homeassistant_host | default('homeassistant101') }}"
  gather_facts: false
  tasks:
    - name: Install node_exporter (self-monitoring)
      include_role:
        name: node_exporter_install

    - name: Deploy Home Assistant and the Matter Server via Podman Quadlet
      include_role:
        name: homeassistant_configure

    - name: Register this host as a Prometheus scrape target
      include_role:
        name: prometheus_target
      vars:
        prometheus_target_name: "{{ inventory_hostname }}"
        prometheus_target_ip: "{{ ansible_host }}"
        prometheus_target_job: node_exporter
        prometheus_target_role_label: vm
        prometheus_target_state: present

    - name: Check services after config deploy
      include_role:
        name: health_check
      vars:
        health_check_fail_on_unhealthy: true
