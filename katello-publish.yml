---
- name: Promote and publish Katello content views, independent of any patch run
  hosts: "{{ lpkat_host | default('lpkat101') }}"
  gather_facts: false
  tasks:
    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Promote the current latest version to Production, then publish and promote a new version to Test
      include_role:
        name: katello_promote
      vars:
        content_view_name: "{{ item }}"
      loop: "{{ katello_publish_views | default(['CV_Rocky_10', 'CV_Proxmox']) }}"
      loop_control:
        label: "{{ item }}"

- name: Send katello-publish report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build and send the HTML report email
      include_role:
        name: send_report
      vars:
        report_subject: "[katello-publish] Content views promoted and published"
        report_body: |
          <h2>Katello publish report</h2>
          <table>
            <tr>
              <th>Content View</th>
              <th>Promoted to Production</th>
              <th>Published (now in Test)</th>
            </tr>
            {% for r in hostvars[lpkat_host | default('lpkat101')].katello_publish_results %}
            <tr>
              <td>{{ r.name }}</td>
              <td>{{ r.promoted_version }}</td>
              <td>{{ r.published_version }}</td>
            </tr>
            {% endfor %}
          </table>
          <p>vm-updates.yml, pve-updates.yml and full-updates.yml no longer publish automatically - run this on its own schedule with enough lead time before them, so they see the content you intended without republishing a new version on every retry.</p>
