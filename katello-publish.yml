---
- name: Promote and publish Katello content views, independent of any patch run
  hosts: "{{ lpkat_host | default('lpkat101') }}"
  gather_facts: false
  tasks:
    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Promote the latest version to Production, then publish a new one to Test
      include_role:
        name: katello_promote
      vars:
        content_view_name: "{{ item }}"
      loop: "{{ katello_publish_views | default(['CV_Rocky_10', 'CV_Proxmox']) }}"
      loop_control:
        label: "{{ item }}"

    # After publishing, so the version just published counts toward the retention window.
    - name: Purge content view versions beyond the retention count
      include_role:
        name: katello_cv_retention

- name: Send katello-publish report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Determine if any content view had a problem
      ansible.builtin.set_fact:
        katello_publish_any_problem: "{{ hostvars[lpkat_host | default('lpkat101')].katello_publish_results | selectattr('status', 'equalto', 'PROBLEM') | list | length > 0 }}"

    - name: Build and send the HTML report email
      include_role:
        name: send_report
      vars:
        report_subject: "[katello-publish] {{ 'PROBLEM detected' if katello_publish_any_problem else 'Content views promoted and published' }}"
        report_body: |
          <h2>Katello publish report</h2>
          {% set retention = hostvars[lpkat_host | default('lpkat101')].katello_retention_results | default([]) %}
          <table>
            <tr>
              <th>Content View</th>
              <th>Status</th>
              <th>Promoted to Production</th>
              <th>Published (now in Test)</th>
              <th>Old versions purged</th>
            </tr>
            {% for r in hostvars[lpkat_host | default('lpkat101')].katello_publish_results %}
            <tr class="{{ 'status-problem' if r.status == 'PROBLEM' else 'status-ok' }}">
              <td>{{ r.name }}</td>
              <td>{{ r.status }}</td>
              <td>{{ r.promoted_version }}</td>
              <td>{{ r.published_version }}</td>
              <td>{{ 'Yes' if (retention | selectattr('name', 'equalto', r.name) | map(attribute='purged') | first | default(false)) else 'None to purge' }}</td>
            </tr>
            {% endfor %}
          </table>
          <p>Retention keeps the {{ cv_retention_count | default(10) }} most recent versions of each content view.</p>

    # Without this, ansible-playbook exits 0 even when a content view had a real problem.
    - name: Fail this run if any content view had a problem
      ansible.builtin.fail:
        msg: "katello-publish detected a PROBLEM on at least one content view - see the report email for details."
      when: katello_publish_any_problem
