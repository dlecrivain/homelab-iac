---
# Repo syncs are otherwise driven by Foreman's own Sync Plans, outside this repo's scope. Use this
# for an immediate resync, e.g. after changing a download policy or recovering a partial sync.
- name: Synchronize a Katello-managed repository on demand
  hosts: "{{ lpkat_host | default('lpkat101') }}"
  gather_facts: false
  vars:
    sync_repo: "{{ katello_sync_repo | default('EPEL 10') }}"
    sync_product: "{{ katello_sync_product | default('Rocky Linux 10') }}"
  tasks:
    - name: "Synchronize {{ sync_product }} / {{ sync_repo }}"
      ansible.builtin.command: >
        hammer -u {{ katello_hammer_username }} -p {{ katello_hammer_password }}
        repository synchronize
        --name "{{ sync_repo }}"
        --product "{{ sync_product }}"
        --organization "{{ katello_organization }}"
      register: katello_sync_result
      failed_when: false
      become: true
      no_log: true

    - name: Fail with a password-redacted error if the sync failed
      ansible.builtin.fail:
        msg: >-
          hammer repository synchronize failed for {{ sync_product }} / {{ sync_repo }}
          (rc={{ katello_sync_result.rc }}):
          {{
            (katello_sync_result.stderr | default('')) | replace(katello_hammer_password, '***REDACTED***')
            if (katello_hammer_password | default('') | length > 0)
            else (katello_sync_result.stderr | default(''))
          }}
      when: katello_sync_result.rc != 0
