proxmox_api_host: "{{ hostvars['localhost'].resolved_proxmox_api_host | default('192.168.1.101') }}"
proxmox_ssh_user: root
lpkat_host: lpkat101
katello_organization: "Production"
ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
proxmox_python_interpreter: /usr/bin/python3
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_user: "{{ lookup('env', 'SMTP_USER') }}"
smtp_password: "{{ lookup('env', 'SMTP_PASSWORD') }}"
notify_email_to: "{{ lookup('env', 'NOTIFY_EMAIL_TO') }}"
github_push_token: "{{ lookup('env', 'GITHUB_PUSH_TOKEN') }}"
katello_hammer_username: "{{ lookup('env', 'KATELLO_HAMMER_USERNAME') }}"
katello_hammer_password: "{{ lookup('env', 'KATELLO_HAMMER_PASSWORD') }}"
cv_retention_count: 10
# The content views this repo manages. katello-publish.yml promotes and publishes each one, then
# prunes its old versions beyond cv_retention_count, so both steps must iterate the same list.
katello_content_views:
  - CV_Rocky_10
  - CV_Proxmox
pve_safety_threshold: 0.80
pve_rebalance_margin: 0.05
# VMs that must not share a Proxmox node, so one failing node cannot take both. Each entry is a
# group of VM names. Honoured by the evacuation placement and by the cluster rebalance; Proxmox's
# own HA affinity rules would need HA-managed VMs on shared or replicated storage.
pve_anti_affinity_groups:
  - [semaphore101, semaphore102]
vm_backup_node: pve1
vm_backup_storage: Stockage_SSD
vm_backup_local_retention: 2
vm_backup_pcloud_retention: 1
vm_backup_pcloud_base_path: "pcloud:Backups/VM"

# Direct 10G mesh links, keyed by the node pair sorted alphabetically and joined with "-". Each
# pair is its own point-to-point /31 on its own cable, so the migration network depends on which
# two nodes are involved rather than one shared subnet. A pair absent from this map falls back to
# the management network, which is also what PVE needs: it rejects a migration network outright
# when a node holds no address on it.
pve_mesh_links:
  pve1-pve2: 10.10.10.2/31
  pve1-pve3: 10.10.10.4/31
  pve2-pve3: 10.10.10.0/31

# Corosync (configure-pve-corosync.yml). ring0 is the management network, ring1 the 10G mesh reached
# through each node's routed loopback. Under link_mode passive the higher knet_link_priority wins, so
# cluster traffic takes the mesh and management stays as the fallback that survives a mesh outage.
# pve_corosync_nodes is the cluster's membership and must list every node. config_version has to be
# raised with any change below, or corosync ignores the new file.
pve_cluster_name: mon-cluster
pve_corosync_nodes: [pve1, pve2, pve3]
pve_corosync_config_version: 5
pve_corosync_ring0_priority: 10
pve_corosync_ring1_priority: 20

# phpIPAM. "User token" security mode, which exchanges a login for a session token: the SSL modes
# require HTTPS, and phpipam101 serves plain HTTP.
phpipam_api_app_id: "ansible"
phpipam_api_username: "{{ lookup('env', 'PHPIPAM_API_USERNAME') }}"
phpipam_api_password: "{{ lookup('env', 'PHPIPAM_API_PASSWORD') }}"
phpipam_base_url: "http://192.168.1.116:8080/api/{{ phpipam_api_app_id }}"
phpipam_subnet_cidr: "192.168.1.0/24"
phpipam_search_start_ip: "192.168.1.111"
phpipam_max_retries: 5

# phpIPAM container stack (configure-phpipam.yml). Both database passwords must be set in
# Semaphore's Variable Group before the first run, otherwise the role would reset them to empty.
phpipam_host: phpipam101
phpipam_db_password: "{{ lookup('env', 'PHPIPAM_DB_PASSWORD') }}"
phpipam_db_root_password: "{{ lookup('env', 'PHPIPAM_DB_ROOT_PASSWORD') }}"
# Pinned instead of :latest so updates are a reviewable version bump (check-image-updates.yml
# checks Docker Hub and self-heals this value) rather than a silent, unannounced image swap.
phpipam_version: "v1.8.3"
# Pinned rather than :latest so container-updates.yml can't pull a major version that fails to
# start against the existing datadir. Deliberately not in image_update_watch_list: a database
# engine bump is reviewed and applied by hand here.
mariadb_version: "12.3.2"

# Proxmox VM provisioning (provision-vm.yml)
pve_template_vmid: 9000
pve_clone_node: pve1
pve_clone_storage: nvme_data
provision_template_ip: "192.168.1.200"

# Fleet static networking (servers only - AdGuard/DHCP is for client devices, never servers)
fleet_network_prefix: 24
fleet_network_gateway: "192.168.1.254"
fleet_network_dns_servers: "192.168.1.254"

# Katello registration (provision-vm.yml). Numeric IDs, unlike katello_organization, which is the
# name string hammer's content-view commands expect.
katello_activation_key: "ak-rocky-10-prod"
katello_organization_id: 4
katello_location_id: 2
katello_operatingsystem_id: 7

# BunkerWeb (configure-bunkerweb.yml): OVH DNS-01 credentials for Let's Encrypt, and the admin UI
# password. Set these in Semaphore's Variable Group before the first run.
bunkerweb_ovh_application_key: "{{ lookup('env', 'BUNKERWEB_OVH_APPLICATION_KEY') }}"
bunkerweb_ovh_application_secret: "{{ lookup('env', 'BUNKERWEB_OVH_APPLICATION_SECRET') }}"
bunkerweb_ovh_consumer_key: "{{ lookup('env', 'BUNKERWEB_OVH_CONSUMER_KEY') }}"
bunkerweb_admin_password: "{{ lookup('env', 'BUNKERWEB_ADMIN_PASSWORD') }}"

# Monitoring (configure-prometheus.yml, configure-grafana.yml, configure-monitoring.yml and the
# prometheus_target role).
prometheus_host: prometheus101
grafana_host: grafana101
node_exporter_version: "1.12.1"
smartctl_exporter_version: "0.15.0"

# The same API token inventory/proxmox.yml uses, exposed as a normal var so
# prometheus_pve_exporter_configure can consume it. user and token_id must match that file.
proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
proxmox_api_user: "ansible@pve"
proxmox_api_token_id: "automation"

# Must be set in Semaphore's Variable Group before the first configure-grafana.yml run.
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"

# Pinned image versions. check-image-updates.yml bumps these in place when a same-major-line
# update is available; the container itself is left alone, so the next container-updates run
# applies it like any other config change. Semaphore has its own bump playbook instead.
prometheus_version: "v3.15.0"
alertmanager_version: "v0.34.1"
grafana_version: "13.2.3"
bunkerweb_version: "1.6.15"
adguard_version: "v0.107.79"
# phpipam_version is declared above, with the phpIPAM container stack.
pve_exporter_version: "3.10.1"

# Immich (configure-immich.yml). Pinned rather than :release so a container restart cannot change
# version on its own: Immich's upgrades run database migrations, which belong in a run that snapshots
# the VM first. Server and machine-learning share this version, they always move together.
immich_version: "v3.3.1"
# Pinned by digest - neither follows Immich's release cycle, and the Postgres image carries the
# vector extensions the database depends on.
immich_postgres_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
immich_redis_image: "docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9"

# Docker Hub repos check-image-updates.yml watches: the var to bump, and the host whose live
# container tells it whether a bump has been applied yet. phpipam-web and phpipam-cron share
# phpipam_version - same release, they always move together. Semaphore has its own bump playbook,
# and Immich is compared against its GitHub releases instead (informational only).
image_update_watch_list:
  - name: prometheus
    docker_repo: prom/prometheus
    version_var: prometheus_version
    container_name: prometheus
    host: "{{ prometheus_host }}"
  - name: alertmanager
    docker_repo: prom/alertmanager
    version_var: alertmanager_version
    container_name: alertmanager
    host: "{{ prometheus_host }}"
  - name: grafana
    docker_repo: grafana/grafana
    version_var: grafana_version
    container_name: grafana
    host: "{{ grafana_host }}"
  - name: phpipam-web
    docker_repo: phpipam/phpipam-www
    version_var: phpipam_version
    container_name: phpipam-web
    host: "{{ phpipam_host }}"
  - name: phpipam-cron
    docker_repo: phpipam/phpipam-cron
    version_var: phpipam_version
    container_name: phpipam-cron
    host: "{{ phpipam_host }}"
  - name: bunkerweb
    docker_repo: bunkerity/bunkerweb-all-in-one
    version_var: bunkerweb_version
    container_name: bunkerweb-aio
    host: bunkerweb101
  - name: adguard
    docker_repo: adguard/adguardhome
    version_var: adguard_version
    container_name: adguardhome
    host: adguard101
  - name: pve-exporter
    docker_repo: prompve/prometheus-pve-exporter
    version_var: pve_exporter_version
    container_name: pve-exporter
    host: "{{ prometheus_host }}"
