proxmox_api_host: "{{ hostvars['localhost'].resolved_proxmox_api_host | default('192.168.1.101') }}"
proxmox_ssh_user: root
lpkat_host: lpkat101
katello_organization: "Production"
ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
proxmox_python_interpreter: /usr/bin/python3
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_user: "{{ lookup('env', 'SMTP_USER') }}"
smtp_password: "{{ lookup('env', 'SMTP_PASSWORD') }}"
notify_email_to: "{{ lookup('env', 'NOTIFY_EMAIL_TO') }}"
github_push_token: "{{ lookup('env', 'GITHUB_PUSH_TOKEN') }}"
# Where the playbooks that commit back to this repository (version bumps, the host_vars of a
# provisioned or decommissioned VM) push, and who they commit as. See tasks/commit_and_push.yml.
git_repository: dlecrivain/homelab-iac
git_push_branch: main
git_push_url: "https://{{ github_push_token }}@github.com/{{ git_repository }}"
git_commit_name: dlecrivain
git_commit_email: d.lecrivain47@gmail.com
katello_hammer_username: "{{ lookup('env', 'KATELLO_HAMMER_USERNAME') }}"
katello_hammer_password: "{{ lookup('env', 'KATELLO_HAMMER_PASSWORD') }}"
cv_retention_count: 10
# The content views this repo manages. katello-publish.yml promotes and publishes each one, then
# prunes its old versions beyond cv_retention_count, so both steps must iterate the same list.
katello_content_views:
  - CV_Rocky_10
  - CV_Proxmox
# How Katello stores the packages of the repositories that katello-repo-policy.yml sets. The security archive of Debian deletes a package
# as soon as a newer one replaces it, and a content view is promoted to Production a week after it was published, so the packages of
# that repository are downloaded when it is synchronized (immediate) instead of when a host asks for them (on_demand, the other
# repositories). Only amd64 is kept: the packages of the other architectures are not used and make the repository six times larger.
katello_repo_policies:
  - { product: "Debian 13", name: "Debian 13 Security", download_policy: immediate, deb_architectures: amd64 }
pve_safety_threshold: 0.80
pve_rebalance_margin: 0.05
# VMs that must not share a Proxmox node, so one failing node cannot take both. Each entry is a
# group of VM names. Honoured by the evacuation placement and by the cluster rebalance; Proxmox's
# own HA affinity rules would need HA-managed VMs on shared or replicated storage.
pve_anti_affinity_groups: []
vm_backup_node: pve1
vm_backup_storage: Stockage_SSD
vm_backup_local_retention: 2
vm_backup_pcloud_retention: 1
# Free space that must remain on pCloud, beyond the archive itself, for it to be uploaded before the
# previous copy is removed.
vm_backup_pcloud_free_margin_gib: 5
vm_backup_pcloud_base_path: "pcloud:Backups/VM"

# Direct 10G mesh links, keyed by the node pair sorted alphabetically and joined with "-". Each
# pair is its own point-to-point /31 on its own cable, so the migration network depends on which
# two nodes are involved rather than one shared subnet. A pair absent from this map falls back to
# the management network, which is also what PVE needs: it rejects a migration network outright
# when a node holds no address on it.
pve_mesh_links:
  pve1-pve2: 10.10.10.2/31
  pve1-pve3: 10.10.10.4/31
  pve2-pve3: 10.10.10.0/31

# Corosync (configure-pve-corosync.yml). ring0 is the management network, ring1 the 10G mesh reached
# through each node's routed loopback. Under link_mode passive the higher knet_link_priority wins, so
# cluster traffic takes the mesh and management stays as the fallback that survives a mesh outage.
# pve_corosync_nodes is the cluster's membership and must list every node. config_version has to be
# raised with any change below, or corosync ignores the new file.
pve_cluster_name: mon-cluster
pve_corosync_nodes: [pve1, pve2, pve3]
pve_corosync_config_version: 5
pve_corosync_ring0_priority: 10
pve_corosync_ring1_priority: 20

# phpIPAM, on the Kubernetes test cluster (k8s/phpipam), behind Traefik. "User token" security mode, which exchanges a login for a
# session token; the app is configured that way in its database.
phpipam_api_app_id: "ansible"
phpipam_api_username: "{{ lookup('env', 'PHPIPAM_API_USERNAME') }}"
phpipam_api_password: "{{ lookup('env', 'PHPIPAM_API_PASSWORD') }}"
# phpIPAM is reached under the name of the cluster.
phpipam_base_url: "https://ipam.k8s.lecrivaindaniel.fr/api/{{ phpipam_api_app_id }}"
phpipam_subnet_cidr: "192.168.1.0/24"
phpipam_search_start_ip: "192.168.1.111"
phpipam_max_retries: 5

# Proxmox VM provisioning (provision-vm.yml). 9001 is the hardened Rocky 10 template built from
# kickstart/rocky10-cis.ks.j2; 9000 is the previous template.
pve_template_vmid: 9001
pve_clone_node: pve1
pve_clone_storage: nvme_data
provision_template_ip: "192.168.1.200"

# Fleet static networking (servers only - AdGuard/DHCP is for client devices, never servers)
fleet_network_prefix: 24
fleet_network_gateway: "192.168.1.254"
fleet_network_dns_servers: "192.168.1.254"

# Katello registration (provision-vm.yml). Numeric IDs, unlike katello_organization, which is the
# name string hammer's content-view commands expect.
katello_activation_key: "ak-rocky-10-prod"
katello_server_fqdn: "lpkat101.mondomaine.lab"
katello_organization_id: 4
katello_location_id: 2
katello_operatingsystem_id: 7

# Monitoring (configure-monitoring.yml and the prometheus_target role). Prometheus and Grafana run on the Kubernetes test cluster,
# from k8s/prometheus and k8s/grafana, and are reached by the names of the cluster, which only Traefik answers.
prometheus_url: "https://prometheus.k8s.lecrivaindaniel.fr"
grafana_url: "https://grafana.k8s.lecrivaindaniel.fr"
alertmanager_url: "https://alertmanager.k8s.lecrivaindaniel.fr"
node_exporter_version: "1.12.1"
smartctl_exporter_version: "0.15.0"

# The Claude Code release installed on claude_host by configure-claude.yml. Pinned because the vendor
# repository is kept disabled (every repo outside Katello is), so the host never moves on its own.
claude_host: claude101
claude_code_version: "2.1.292"
# The read-only account the assistant of claude_host reads the VMs with (configure-claude-access.yml).
claude_readonly_user: claude-ro

# OpenSCAP compliance scan (openscap-scan.yml). "cis_fleet" is the SCAP Security Guide's CIS Level 2 -
# Server profile ("cis") from the Rocky Linux 10 datastream that scap-security-guide installs, tailored
# by the waivers of kickstart/cis-waivers.yml.
openscap_profile: cis_fleet
openscap_datastream: /usr/share/xml/scap/ssg/content/ssg-rl10-ds.xml
# The tailoring file the role writes on each host from kickstart/cis-waivers.yml and the host's own
# openscap_waived_rules; empty scans the plain profile.
openscap_tailoring_file: /etc/cis/scan-tailoring.xml
openscap_report_dir: /var/log/openscap
openscap_report_retention_days: 400
# A score below the target, or a drop of more than openscap_regression_points since the previous scan,
# is flagged in the report. Neither fails the run: only a scan that cannot run does.
openscap_score_target: 90
openscap_regression_points: 2
openscap_report_common_failures: 15

# The same API token inventory/proxmox.yml uses, exposed as a normal var. user and token_id must match that file.
proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
proxmox_api_user: "ansible@pve"
proxmox_api_token_id: "automation"


# Pinned image versions. check-image-updates.yml bumps these in place when a same-major-line
# update is available; the container itself is left alone, so the next container-updates run
# applies it like any other config change. Semaphore has its own bump playbook instead.
# The database image of Immich on nfs101, pinned by digest: it carries the vector extensions the database depends on and
# follows no release cycle of Immich's. The tags of Immich itself are in k8s/immich.
immich_postgres_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"

# Paperless-ngx runs on the Kubernetes test cluster (k8s/paperless/, see docs/paperless.md). This is the name it is published
# under, and the address the synchronisation (sync-paperless.yml) talks to, behind Traefik.
paperless_domain: paperless.lecrivaindaniel.fr

# The Postgres image of the databases that run next to the NFS server (configure-postgres.yml). Pinned by digest: a major
# version needs a dump and restore (upgrade-postgres.yml), and the major of each instance is in host_vars/nfs101.yml.
postgres_image: "docker.io/library/postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81"
# The MariaDB image of the databases that run next to the NFS server (configure-mariadb.yml), the version phpIPAM already ran on.
# Pinned by digest, and a major version needs a dump and restore.
mariadb_image: "docker.io/library/mariadb:12.3.2@sha256:a02fe89cb597d4375812b2eac90cf9d0775d4686daa7f7cc750ebbcad7525bbc"

# The host that shares the files of the Aqara doorbell over SMB (configure-smb.yml), see the README.
smb_host: nfs101

# Talos Linux, the operating system of the Kubernetes test cluster. The nodes are installed from this ISO, built by
# Image Factory with the qemu-guest-agent extension and stored on pve1, the only node with an ISO storage, see the README.
# The version of Talos Linux that talos-updates.yml brings every node to, and the version of Kubernetes that kubernetes-updates.yml brings
# the cluster to. Renovate proposes the new ones as pull requests, and the next run of full-updates.yml applies the merged one. The
# images of the Image Factory are of the schematic of the nodes (the extension qemu-guest-agent), so an update keeps what is installed.
talos_version: v1.14.5
talos_schematic_id: ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
talos_installer_image: "factory.talos.dev/metal-installer/{{ talos_schematic_id }}:{{ talos_version }}"
kubernetes_version: "1.37.2"
talos_iso_volume: "Stockage_SSD:iso/talos-{{ talos_version }}-qemu-guest-agent.iso"
# The nodes of the cluster, one control plane and one worker on each Proxmox node, numbered after it: 101 on pve1, 102 on pve2,
# 103 on pve3. Each is created on pve1 by talos-create-vm.yml, installed with talosctl, then moved to its own node by
# talos-place-vm.yml. Three control planes leave etcd its quorum when one Proxmox node is down, and three workers the room for
# its pods; a node that is down is stopped with its host, not migrated.
talos_nodes:
  - { name: talos-cp101, ip: 192.168.1.124, vmid: 120, role: controlplane, node: pve1, memory_mb: 3072, cores: 2, disk_gb: 30 }
  - { name: talos-wk101, ip: 192.168.1.125, vmid: 121, role: worker, node: pve1, memory_mb: 5120, cores: 2, disk_gb: 40 }
  - { name: talos-cp102, ip: 192.168.1.127, vmid: 122, role: controlplane, node: pve2, memory_mb: 3072, cores: 2, disk_gb: 30 }
  - { name: talos-wk102, ip: 192.168.1.126, vmid: 123, role: worker, node: pve2, memory_mb: 5120, cores: 2, disk_gb: 40 }
  - { name: talos-cp103, ip: 192.168.1.113, vmid: 124, role: controlplane, node: pve3, memory_mb: 3072, cores: 2, disk_gb: 30 }
  - { name: talos-wk103, ip: 192.168.1.118, vmid: 125, role: worker, node: pve3, memory_mb: 5120, cores: 2, disk_gb: 40 }

# How the playbooks reach the cluster: the talosctl of the official image, run by podman on semaphore103, which is outside the cluster,
# with a client configuration that is only on that VM (talosctl_config, owned by root, never in this repository).
talosctl_image: "ghcr.io/siderolabs/talosctl:{{ talos_version }}"
talosctl_config: /etc/talos/talosconfig
talos_control_plane_ips: "{{ talos_nodes | selectattr('role', 'equalto', 'controlplane') | map(attribute='ip') | list }}"
talos_worker_ips: "{{ talos_nodes | selectattr('role', 'equalto', 'worker') | map(attribute='ip') | list }}"
# talosctl_podman_args is for a task that needs one more volume, which it sets for itself.
talosctl_cmd: >-
  podman run --rm --security-opt label=disable {{ talosctl_podman_args | default('') }} -v {{ talosctl_config }}:/talosconfig:ro {{ talosctl_image }}
  --talosconfig /talosconfig --endpoints {{ talos_control_plane_ips | join(',') }}
# The certificate of that client configuration lasts talosctl_config_ttl. talos-updates.yml makes a new one, by itself, when less than
# talosctl_config_renew_days days are left, so it never expires as long as the Friday runs take place.
talosctl_config_ttl: 43800h
talosctl_config_renew_days: 365

# How the playbooks look at the Kubernetes workloads and start the Descheduler (kubernetes-rebalance.yml): the kubectl of the official
# image, run by podman on semaphore103, with the configuration of the "rebalancer" account of the cluster. That account can read the
# nodes and the pods and create a Job from the suspended CronJob of the Descheduler, nothing more. The file is only on that VM, owned
# by root, and never in this repository; it points to the first control plane.
kubectl_image: "registry.k8s.io/kubectl:v{{ kubernetes_version }}"
kubernetes_rebalancer_config: /etc/kubernetes-rebalancer/kubeconfig
kubectl_cmd: >-
  podman run --rm --user 0:0 --security-opt label=disable -v {{ kubernetes_rebalancer_config }}:/kubeconfig:ro {{ kubectl_image }}
  --kubeconfig /kubeconfig

# Before a Talos node is stopped (the host of its VM is patched, or its image is updated), the pods it runs must find room on the
# workers that stay (tasks/kubernetes_capacity_gate.yml), by what they request. That share of the memory and of the CPU of each of
# those workers is kept free in the check, since the scheduler does not pack as tightly. kubernetes_capacity_check false skips it.
kubernetes_capacity_check: true
kubernetes_capacity_margin_pct: 5

# The Docker Hub (docker_repo) or ghcr.io (ghcr_repo) images that check-image-updates.yml watches on a VM. An entry has name,
# docker_repo or ghcr_repo, version_var (the variable it bumps), container_name, and host (whose live container tells it whether a
# bump has been applied yet). Empty since the containers of the VMs moved to the cluster, where Renovate follows the tags.
# Semaphore has its own bump playbook.
image_update_watch_list: []
