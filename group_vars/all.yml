proxmox_api_host: "{{ hostvars['localhost'].resolved_proxmox_api_host | default('192.168.1.101') }}"
proxmox_ssh_user: root
lpkat_host: lpkat101
katello_organization: "Production"
ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
proxmox_python_interpreter: /usr/bin/python3
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_user: "{{ lookup('env', 'SMTP_USER') }}"
smtp_password: "{{ lookup('env', 'SMTP_PASSWORD') }}"
notify_email_to: "{{ lookup('env', 'NOTIFY_EMAIL_TO') }}"
github_push_token: "{{ lookup('env', 'GITHUB_PUSH_TOKEN') }}"
katello_hammer_username: "{{ lookup('env', 'KATELLO_HAMMER_USERNAME') }}"
katello_hammer_password: "{{ lookup('env', 'KATELLO_HAMMER_PASSWORD') }}"
cv_retention_count: 10
cv_retention_views:
  - CV_Rocky_10
  - CV_Proxmox
pve_safety_threshold: 0.80
pve_rebalance_margin: 0.05
vm_backup_node: pve1
vm_backup_storage: Stockage_SSD
vm_backup_local_retention: 2
vm_backup_pcloud_retention: 1
vm_backup_pcloud_base_path: "pcloud:Backups/VM"

# update-semaphore-peer.yml: defaults to patching semaphore101 only (OS + containers), never
# touching semaphore102, when run with no extra vars at all. The semaphore102-facing direction
# (image alignment) still requires explicit -e peer_host=semaphore102 -e image_reference_host=semaphore101.
peer_host: semaphore101

# phpIPAM
# "User token" security mode (not "SSL with ..."): those two require a real HTTPS connection and
# 503 with "SSL connection is required for API" over plain HTTP - phpipam101 is HTTP-only for now.
# "User token" does a login exchange for a session token instead.
phpipam_api_app_id: "ansible"
phpipam_api_username: "{{ lookup('env', 'PHPIPAM_API_USERNAME') }}"
phpipam_api_password: "{{ lookup('env', 'PHPIPAM_API_PASSWORD') }}"
phpipam_base_url: "http://192.168.1.116:8080/api/{{ phpipam_api_app_id }}"
phpipam_subnet_cidr: "192.168.1.0/24"
phpipam_search_start_ip: "192.168.1.111"
phpipam_max_retries: 5

# phpIPAM container stack (configure-phpipam.yml) - was set up by hand before this repo managed
# it (docker-compose, then migrated to Quadlet manually), with both DB passwords hardcoded in
# plaintext in the live .container files. Brought under Ansible with the exact same values so the
# migration is a no-op for the running service - must be set in Semaphore's Variable Group before
# the first configure-phpipam.yml run, or it would try to reset both passwords to empty strings.
phpipam_host: phpipam101
phpipam_db_password: "{{ lookup('env', 'PHPIPAM_DB_PASSWORD') }}"
phpipam_db_root_password: "{{ lookup('env', 'PHPIPAM_DB_ROOT_PASSWORD') }}"
# Pinned instead of :latest so updates are a reviewable version bump (update-phpipam-version.yml
# checks Docker Hub and self-heals this value) rather than a silent, unannounced image swap.
phpipam_version: "v1.8.2"

# Proxmox VM provisioning (provision-vm.yml)
pve_template_vmid: 9000
pve_clone_node: pve1
pve_clone_storage: nvme_data
provision_template_ip: "192.168.1.200"

# Fleet static networking (servers only - AdGuard/DHCP is for client devices, never servers)
fleet_network_prefix: 24
fleet_network_gateway: "192.168.1.254"
fleet_network_dns_servers: "192.168.1.254"

# Katello registration (provision-vm.yml) - numeric IDs, distinct from katello_organization (a name string used by hammer content-view commands)
katello_activation_key: "ak-rocky-10-prod"
katello_organization_id: 4
katello_location_id: 2
katello_operatingsystem_id: 7

# BunkerWeb (configure-bunkerweb.yml) - OVH DNS-01 API credentials for Let's Encrypt, and the
# admin UI password. Never committed: must be set in Semaphore's Variable Group before the
# first run, or Let's Encrypt renewal / admin login will fail.
bunkerweb_ovh_application_key: "{{ lookup('env', 'BUNKERWEB_OVH_APPLICATION_KEY') }}"
bunkerweb_ovh_application_secret: "{{ lookup('env', 'BUNKERWEB_OVH_APPLICATION_SECRET') }}"
bunkerweb_ovh_consumer_key: "{{ lookup('env', 'BUNKERWEB_OVH_CONSUMER_KEY') }}"
bunkerweb_admin_password: "{{ lookup('env', 'BUNKERWEB_ADMIN_PASSWORD') }}"

# Monitoring (configure-prometheus.yml, configure-grafana.yml, configure-monitoring.yml,
# prometheus_target role) - mirrors lpkat_host's exact pattern for the delegate_to target.
prometheus_host: prometheus101
grafana_host: grafana101
node_exporter_version: "1.12.1"
smartctl_exporter_version: "0.14.0"

# Reuses the same PROXMOX_TOKEN_SECRET env var inventory/proxmox.yml already requires, exposed
# as a normal var here so prometheus_pve_exporter_configure can consume it. user/token_id match
# inventory/proxmox.yml's own hardcoded values exactly - same Proxmox API token, same identity.
proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
proxmox_api_user: "ansible@pve"
proxmox_api_token_id: "automation"

# New secret: must be set in Semaphore's Variable Group before the first configure-grafana.yml run.
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"

# Pinned versions for images with no dedicated auto-bump mechanism of their own (unlike Semaphore
# and phpIPAM, which self-heal via their own playbooks). check-image-updates.yml checks Docker Hub
# and bumps these in place when a same-major-line update is available - the next container-updates
# run then applies it naturally, since it's just a normal config change like any other.
prometheus_version: "v3.13.2"
alertmanager_version: "v0.33.1"
grafana_version: "13.1.3"

# Docker Hub repos check-image-updates.yml watches, paired with the var it bumps and the host
# whose live container it compares against to know whether a detected bump has actually been
# applied yet (vs. still pending the next container-updates run). Semaphore and phpIPAM aren't
# here - they already have their own dedicated bump playbooks. Immich is excluded entirely (not
# Ansible-managed, uses GHCR + digest pins + a floating "release" tag) - check-image-updates.yml
# instead just compares Immich's own reported version against its GitHub releases, informational only.
image_update_watch_list:
  - name: prometheus
    docker_repo: prom/prometheus
    version_var: prometheus_version
    container_name: prometheus
    host: "{{ prometheus_host }}"
  - name: alertmanager
    docker_repo: prom/alertmanager
    version_var: alertmanager_version
    container_name: alertmanager
    host: "{{ prometheus_host }}"
  - name: grafana
    docker_repo: grafana/grafana
    version_var: grafana_version
    container_name: grafana
    host: "{{ grafana_host }}"
