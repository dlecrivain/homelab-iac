---
- name: Determine whether semaphore102 is actually being targeted this run
  # Avoids opening an unnecessary connection to semaphore101 below when it isn't (a scoped
  # -e target_hosts=<other host> run, or update-semaphore-peer.yml's semaphore101-facing
  # nested call) - ansible.builtin.inventory_hostnames resolves a host pattern against the
  # loaded inventory without needing a real play against those hosts.
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check membership
      ansible.builtin.set_fact:
        container_updates_targets_semaphore102: >-
          {{
            'semaphore102' in query('ansible.builtin.inventory_hostnames', target_hosts | default('proxmox_all_qemu:!lpkat101:!semaphore101'))
          }}

- name: "Capture semaphore101's current image versions, only if semaphore102 is actually being targeted this run (used to align semaphore102's images to match)"
  hosts: semaphore101
  gather_facts: false
  tasks:
    - name: Gather and validate semaphore101's image versions
      when: hostvars['localhost'].container_updates_targets_semaphore102
      block:
        - name: Check services on semaphore101
          include_role:
            name: health_check

        - name: Determine semaphore101's overall status
          include_role:
            name: host_status

        - name: Get each unit's current image ID on semaphore101
          ansible.builtin.command: "podman inspect {{ item.name }} --format '{{ '{{' }}.Image{{ '}}' }}'"
          become: true
          loop: "{{ podman_units }}"
          loop_control:
            label: "{{ item.name }}"
          register: reference_image_ids
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Resolve each image ID to a pullable digest reference
          ansible.builtin.command: "podman inspect {{ item.stdout }} --format '{{ '{{' }} index .RepoDigests 0 {{ '}}' }}'"
          become: true
          loop: "{{ reference_image_ids.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          register: reference_digest_refs
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Save semaphore101's image digests, keyed by unit name
          ansible.builtin.set_fact:
            reference_image_digests: "{{ dict(podman_units | map(attribute='name') | zip(reference_digest_refs.results | map(attribute='stdout'))) }}"
          delegate_to: localhost
          delegate_facts: true
          when: host_overall_status == 'OK'

        - name: Get each unit's current image tag on semaphore101
          ansible.builtin.command: "podman inspect {{ item.name }} --format '{{ '{{' }}.ImageName{{ '}}' }}'"
          become: true
          loop: "{{ podman_units }}"
          loop_control:
            label: "{{ item.name }}"
          register: reference_image_refs
          changed_when: false
          when: host_overall_status == 'OK'

        - name: Save semaphore101's image tags, keyed by unit name
          ansible.builtin.set_fact:
            reference_image_tags: "{{ dict(podman_units | map(attribute='name') | zip(reference_image_refs.results | map(attribute='stdout'))) }}"
          delegate_to: localhost
          delegate_facts: true
          when: host_overall_status == 'OK'

- name: Update Podman containers on Quadlet-managed hosts
  # semaphore101 is excluded: it's the reference other hosts (semaphore102) align to, never
  # itself force-aligned to anything, and it's covered end-to-end (OS + containers) by
  # update-semaphore-peer.yml. semaphore102 is included below, but Step 3 gives it
  # align-to-semaphore101-by-digest treatment instead of the normal tag pull every other host
  # gets - a normal pull here risks drift (a real regression seen in production: semaphore102
  # got reverted from an aligned v2.18.29 back to the stale v2.18.27 tag before realignment ran).
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!lpkat101:!semaphore101') }}"
  gather_facts: false
  serial: 1
  tasks:
    - name: Resolve a reachable Proxmox node for delegate_to (falls back to pve2/pve3 if pve1 is down)
      include_role:
        name: resolve_proxmox_api_host

    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Capture this stage's own start time
      include_role:
        name: capture_start_time
      vars:
        capture_start_time_fact_name: container_updates_start_epoch

    - name: Capture the full list of targeted hosts (once)
      include_role:
        name: capture_host_list
      vars:
        capture_host_list_fact_name: container_updates_host_list

    - name: Update containers on this host (skipped if an earlier stage in an orchestrated run had a problem)
      when: hostvars['localhost'].orchestration_should_run | default(true)
      block:
        - name: Step 1 - Remove any leftover container snapshot from a previous run
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_container
          when: podman_units is defined

        - name: Step 2 - Snapshot before applying container updates
          vars:
            snapshot_label: ansible_container
          include_role:
            name: proxmox_snapshot
          when: podman_units is defined

        - name: "Step 2.5 (prometheus101 only) - Re-render the Prometheus/Alertmanager Quadlets first, so any version bump check-image-updates.yml already committed to git actually reaches the container before Step 3's pull below - podman_update only pulls whatever tag is already in the deployed Quadlet file, it never re-templates it"
          include_role:
            name: prometheus_configure
          when:
            - podman_units is defined
            - not (snapshot_already_exists | default(false))
            - inventory_hostname == (prometheus_host | default('prometheus101'))

        - name: "Step 2.5 (grafana101 only) - Re-render the Grafana Quadlet first, same reason as above"
          include_role:
            name: grafana_configure
          when:
            - podman_units is defined
            - not (snapshot_already_exists | default(false))
            - inventory_hostname == (grafana_host | default('grafana101'))

        - name: Step 3 - Update Podman containers (normal tag pull)
          include_role:
            name: podman_update
          when:
            - podman_units is defined
            - not (snapshot_already_exists | default(false))
            - inventory_hostname != 'semaphore102'

        - name: Step 3 (semaphore102 only) - Align images to semaphore101's exact digest instead of pulling independently
          include_role:
            name: podman_align_image
          vars:
            podman_align_reference_digests: "{{ hostvars['localhost'].reference_image_digests }}"
            podman_align_reference_tags: "{{ hostvars['localhost'].reference_image_tags }}"
          when:
            - podman_units is defined
            - not (snapshot_already_exists | default(false))
            - inventory_hostname == 'semaphore102'
            - hostvars['localhost'].reference_image_digests is defined

        - name: Record why semaphore102 was skipped if semaphore101 wasn't healthy enough to align against (otherwise it would silently get no row at all in the report)
          ansible.builtin.set_fact:
            host_update_failure_reason: "Alignment skipped - reference host semaphore101 wasn't healthy"
          when:
            - podman_units is defined
            - not (snapshot_already_exists | default(false))
            - inventory_hostname == 'semaphore102'
            - hostvars['localhost'].reference_image_digests is not defined

        - name: Step 4 - Check services after update
          include_role:
            name: health_check
          when: podman_units is defined

        - name: Record whether the update was skipped due to an existing snapshot
          ansible.builtin.set_fact:
            host_update_skipped: "{{ (podman_units is defined) and (snapshot_already_exists | default(false)) }}"
          when: podman_units is defined

        - name: Determine overall host status
          include_role:
            name: host_status
          when: podman_units is defined

        - name: Step 5 - Remove the container snapshot now that the host is healthy
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_container
          when:
            - podman_units is defined
            - host_overall_status | default('') == 'OK'

        - name: Step 6 - Prune old container images
          include_role:
            name: image_retention
          when: podman_units is defined

      rescue:
        - name: Mark this host as having a problem, and record why
          ansible.builtin.set_fact:
            host_overall_status: PROBLEM
            host_update_failure_reason: "{{ ansible_failed_result.msg | default('Unknown error') }}"

- name: Send aggregated container-updates report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record whether this stage was allowed to run
      ansible.builtin.set_fact:
        stage_was_allowed_to_run: "{{ hostvars['localhost'].orchestration_should_run | default(true) }}"

    - name: Determine if any host has a problem
      ansible.builtin.set_fact:
        any_problem: "{{ hostvars['localhost'].container_updates_host_list | map('extract', hostvars) | map(attribute='host_overall_status', default='OK') | select('equalto', 'PROBLEM') | list | length > 0 }}"

    - name: Update the orchestration gate for any later stage
      ansible.builtin.set_fact:
        orchestration_should_run: "{{ stage_was_allowed_to_run and not any_problem }}"

    - name: Determine this stage's status label
      ansible.builtin.set_fact:
        container_updates_stage_status: "{{ 'SKIPPED' if not stage_was_allowed_to_run else ('PROBLEM' if any_problem else 'OK') }}"

    - name: Compute this stage's own duration
      ansible.builtin.set_fact:
        container_updates_duration_seconds: "{{ (now(fmt='%s') | int) - (hostvars['localhost'].container_updates_start_epoch | int) }}"

    - name: Format this stage's duration for display
      ansible.builtin.set_fact:
        container_updates_duration_display: "{{ (container_updates_duration_seconds | int // 3600) }}h {{ ((container_updates_duration_seconds | int % 3600) // 60) }}m {{ (container_updates_duration_seconds | int % 60) }}s"

    - name: Capture this stage's report body
      ansible.builtin.set_fact:
        container_updates_report_body: |
          <h2>Container updates report</h2>
          {% if not stage_was_allowed_to_run %}
          <p class="alert-warning">
            <strong>Skipped.</strong> An earlier stage in this orchestrated run reported a problem, so container updates were not attempted.
          </p>
          {% endif %}
          <table>
            <tr>
              <th>Host</th>
              <th>Container</th>
              <th>Status</th>
              <th>URL Status</th>
            </tr>
            {% for h in hostvars['localhost'].container_updates_host_list %}
            {% if hostvars[h].host_update_skipped | default(false) %}
            <tr class="status-warning">
              <td>{{ h }}</td>
              <td colspan="3">Skipped — an "ansible_container" snapshot already existed</td>
            </tr>
            {% endif %}
            {% if hostvars[h].host_update_failure_reason is defined %}
            <tr class="status-problem">
              <td>{{ h }}</td>
              <td colspan="3">{{ hostvars[h].host_update_failure_reason }}</td>
            </tr>
            {% endif %}
            {% if hostvars[h].podman_update_summary is defined and not (hostvars[h].host_update_skipped | default(false)) and not (hostvars[h].host_update_failure_reason is defined) %}
            {% for c in hostvars[h].podman_update_summary %}
            {% set running = hostvars[h].health_check_container_results | default([]) | selectattr('name','equalto',c.name) | map(attribute='status') | first | default('Up') %}
            {% if running != 'Up' %}
            {% set row_class = 'status-problem' %}
            {% elif c.updated %}
            {% set row_class = 'status-info' %}
            {% else %}
            {% set row_class = 'status-ok' %}
            {% endif %}
            <tr class="{{ row_class }}">
              <td>{{ h }}</td>
              <td>{{ c.name }}</td>
              <td>
                {{ running }}
                {% if c.updated %} — updated {{ c.old_version }} → {{ c.new_version }}{% else %} — unchanged ({{ c.old_version }}){% endif %}
              </td>
              <td>
                {{ hostvars[h].health_check_url_status | default('N/A') }}
              </td>
            </tr>
            {% endfor %}
            {% endif %}
            {% endfor %}
          </table>

    - name: Build and send the HTML report email (skipped when part of an orchestrated run; the combined email covers it instead)
      include_role:
        name: send_report
      when: not (hostvars['localhost'].is_orchestrated_run | default(false))
      vars:
        report_subject: "[container-updates] {{ 'SKIPPED (previous stage had a problem)' if not stage_was_allowed_to_run else ('PROBLEM detected' if any_problem else 'All OK') }}"
        report_body: "{{ container_updates_report_body }}"

    - name: "Fail this run if any host had a problem (only when run standalone - an orchestrated run must keep going so later stages are correctly marked SKIPPED and the combined report still gets sent; full-updates.yml does its own final fail once everything is done). Without this, ansible-playbook always exits 0 - the per-host rescue blocks that make the report accurate also mean Semaphore's own task status never reflects a real problem on its own"
      ansible.builtin.fail:
        msg: "container-updates reported a problem - see the report email for details."
      when:
        - not (hostvars['localhost'].is_orchestrated_run | default(false))
        - any_problem
