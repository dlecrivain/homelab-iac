---
- name: Update Podman containers on Quadlet-managed hosts
  # semaphore103 is excluded: update-semaphore-peer.yml, run from the Semaphore of the cluster, already covers it end to end.
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!lpkat101:!semaphore103:!proxmox_pool_kubernetes:!proxmox_pool_standby') }}"
  gather_facts: false
  serial: 1
  tasks:
    - name: Resolve a reachable Proxmox node for delegate_to (falls back to pve2/pve3 if pve1 is down)
      include_role:
        name: resolve_proxmox_api_host

    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Capture this stage's own start time
      include_role:
        name: capture_start_time
      vars:
        capture_start_time_fact_name: container_updates_start_epoch

    - name: Capture the full list of targeted hosts (once)
      include_role:
        name: capture_host_list
      vars:
        capture_host_list_fact_name: container_updates_host_list

    - name: Update containers on this host
      when: hostvars['localhost'].orchestration_should_run | default(true)
      block:
        - name: Step 1 - Remove any leftover container snapshot from a previous run
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_container
          when: podman_units is defined

        - name: Step 2 - Snapshot before applying container updates
          vars:
            snapshot_label: ansible_container
          include_role:
            name: proxmox_snapshot
          when: podman_units is defined

        - name: Step 3 - Update Podman containers (normal tag pull)
          include_role:
            name: podman_update
          when:
            - podman_units is defined
            - not (snapshot_already_exists | default(false))

        - name: Step 4 - Check services after update
          include_role:
            name: health_check
          when: podman_units is defined

        - name: Record whether the update was skipped due to an existing snapshot
          ansible.builtin.set_fact:
            host_update_skipped: "{{ (podman_units is defined) and (snapshot_already_exists | default(false)) }}"
          when: podman_units is defined

        - name: Determine overall host status
          include_role:
            name: host_status
          when: podman_units is defined

        - name: Step 5 - Remove the container snapshot now that the host is healthy
          include_role:
            name: cleanup_snapshot
          vars:
            snapshot_label: ansible_container
          when:
            - podman_units is defined
            - host_overall_status | default('') == 'OK'

        - name: Step 6 - Prune old container images
          include_role:
            name: image_retention
          when: podman_units is defined

      rescue:
        - name: Mark this host as having a problem, and record why
          ansible.builtin.set_fact:
            host_overall_status: PROBLEM
            host_update_failure_reason: "{{ ansible_failed_result.msg | default('Unknown error') }}"

- name: Send aggregated container-updates report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record whether this stage was allowed to run
      ansible.builtin.set_fact:
        stage_was_allowed_to_run: "{{ hostvars['localhost'].orchestration_should_run | default(true) }}"

    - name: Determine if any host has a problem
      ansible.builtin.set_fact:
        any_problem: "{{ hostvars['localhost'].container_updates_host_list | map('extract', hostvars) | map(attribute='host_overall_status', default='OK') | select('equalto', 'PROBLEM') | list | length > 0 }}"

    - name: Update the orchestration gate for any later stage
      ansible.builtin.set_fact:
        orchestration_should_run: "{{ stage_was_allowed_to_run and not any_problem }}"

    - name: Determine this stage's status label
      ansible.builtin.set_fact:
        container_updates_stage_status: "{{ 'SKIPPED' if not stage_was_allowed_to_run else ('PROBLEM' if any_problem else 'OK') }}"

    - name: Compute this stage's own duration
      ansible.builtin.set_fact:
        container_updates_duration_seconds: "{{ (now(fmt='%s') | int) - (hostvars['localhost'].container_updates_start_epoch | int) }}"

    - name: Format this stage's duration for display
      ansible.builtin.set_fact:
        container_updates_duration_display: "{{ (container_updates_duration_seconds | int // 3600) }}h {{ ((container_updates_duration_seconds | int % 3600) // 60) }}m {{ (container_updates_duration_seconds | int % 60) }}s"

    - name: Capture this stage's report body
      ansible.builtin.set_fact:
        container_updates_report_body: |
          <h2>Container updates report</h2>
          {% if not stage_was_allowed_to_run %}
          <p class="alert-warning">
            <strong>Skipped.</strong> An earlier stage in this orchestrated run reported a problem, so container updates were not attempted.
          </p>
          {% endif %}
          <table>
            <tr>
              <th>Host</th>
              <th>Container</th>
              <th>Status</th>
              <th>URL Status</th>
            </tr>
            {% for h in hostvars['localhost'].container_updates_host_list %}
            {% if hostvars[h].host_update_skipped | default(false) %}
            <tr class="status-warning">
              <td>{{ h }}</td>
              <td colspan="3">Skipped — an "ansible_container" snapshot already existed</td>
            </tr>
            {% endif %}
            {% if hostvars[h].host_update_failure_reason is defined %}
            <tr class="status-problem">
              <td>{{ h }}</td>
              <td colspan="3">{{ hostvars[h].host_update_failure_reason }}</td>
            </tr>
            {% endif %}
            {% if hostvars[h].podman_update_summary is defined and not (hostvars[h].host_update_skipped | default(false)) and not (hostvars[h].host_update_failure_reason is defined) %}
            {% for c in hostvars[h].podman_update_summary %}
            {% set running = hostvars[h].health_check_container_results | default([]) | selectattr('name','equalto',c.name) | map(attribute='status') | first | default('Up') %}
            {% set really_updated = c.updated %}
            {% if running != 'Up' %}
            {% set row_class = 'status-problem' %}
            {% elif really_updated %}
            {% set row_class = 'status-info' %}
            {% else %}
            {% set row_class = 'status-ok' %}
            {% endif %}
            <tr class="{{ row_class }}">
              <td>{{ h }}</td>
              <td>{{ c.name }}</td>
              <td>
                {{ running }}
                {% if c.updated %} — updated {{ c.old_version }} → {{ c.new_version }}{% elif really_updated %} — updated to {{ c.new_version }} (applied via config change before the pull below saw it){% else %} — unchanged ({{ c.old_version }}){% endif %}
              </td>
              <td>
                {{ hostvars[h].health_check_url_status | default('N/A') }}
              </td>
            </tr>
            {% endfor %}
            {% endif %}
            {% endfor %}
          </table>

    # Skipped in an orchestrated run - the combined email covers it instead.
    - name: Build and send the HTML report email
      include_role:
        name: send_report
      when: not (hostvars['localhost'].is_orchestrated_run | default(false))
      vars:
        report_subject: "[container-updates] {{ 'SKIPPED (previous stage had a problem)' if not stage_was_allowed_to_run else ('PROBLEM detected' if any_problem else 'All OK') }}"
        report_body: "{{ container_updates_report_body }}"

    # Standalone runs only: an orchestrated run must keep going so later stages are marked SKIPPED
    # and the combined report still gets sent, and full-updates.yml does its own final fail.
    # Without this, ansible-playbook exits 0 even on a real problem, since the per-host rescue
    # blocks that keep the report accurate also swallow the failure from Semaphore's task status.
    - name: Fail this run if any host had a problem
      ansible.builtin.fail:
        msg: "container-updates reported a problem - see the report email for details."
      when:
        - not (hostvars['localhost'].is_orchestrated_run | default(false))
        - any_problem
