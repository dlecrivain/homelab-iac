---
- name: Mark this as an orchestrated run
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Set the orchestration flag
      ansible.builtin.set_fact:
        is_orchestrated_run: true

- import_playbook: container-updates.yml
  vars:
    # Explicit override, still excluding semaphore102 here specifically: container-updates.yml's
    # own default now includes it (for standalone/ad-hoc visibility), but update-semaphore-peer.yml
    # (imported below) already runs its own nested container-updates.yml against semaphore102 after
    # its OS patch/reboot - without this override it would get processed (and aligned) twice per run.
    target_hosts: "proxmox_all_qemu:!lpkat101:!semaphore101:!semaphore102"

- name: Snapshot the fleet-wide container-updates results (update-semaphore-peer.yml, imported below, runs its own nested container-updates.yml against semaphore102 and would otherwise overwrite these same fact names)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Save this stage's status/duration/report body under fleet-scoped names
      ansible.builtin.set_fact:
        fleet_container_updates_stage_status: "{{ hostvars['localhost'].container_updates_stage_status }}"
        fleet_container_updates_duration_display: "{{ hostvars['localhost'].container_updates_duration_display }}"
        fleet_container_updates_report_body: "{{ hostvars['localhost'].container_updates_report_body }}"

- import_playbook: vm-updates.yml
- import_playbook: pve-updates.yml
- import_playbook: update-semaphore-peer.yml
  vars:
    peer_host: semaphore102
    image_reference_host: semaphore101

- name: Send the combined full-updates report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Determine overall status across all 4 stages
      ansible.builtin.set_fact:
        full_run_any_problem: "{{ 'PROBLEM' in [hostvars['localhost'].fleet_container_updates_stage_status, hostvars['localhost'].vm_updates_stage_status, hostvars['localhost'].pve_updates_stage_status, hostvars['localhost'].semaphore_peer_stage_status] }}"

    - name: Build and send the combined HTML report email
      include_role:
        name: send_report
      vars:
        report_subject: "[full-updates] {{ 'PROBLEM detected' if full_run_any_problem else 'All OK' }}"
        report_body: |
          <h2>Full update run summary</h2>
          <table>
            <tr>
              <th>Stage</th>
              <th>Status</th>
              <th>Duration</th>
            </tr>
            {% for stage in [
              {'name': 'container-updates', 'status': hostvars['localhost'].fleet_container_updates_stage_status, 'duration': hostvars['localhost'].fleet_container_updates_duration_display},
              {'name': 'vm-updates', 'status': hostvars['localhost'].vm_updates_stage_status, 'duration': hostvars['localhost'].vm_updates_duration_display},
              {'name': 'pve-updates', 'status': hostvars['localhost'].pve_updates_stage_status, 'duration': hostvars['localhost'].pve_updates_duration_display},
              {'name': 'semaphore-peer (semaphore102)', 'status': hostvars['localhost'].semaphore_peer_stage_status, 'duration': hostvars['localhost'].semaphore_peer_duration_display}
            ] %}
            {% if stage.status == 'PROBLEM' %}
            {% set row_class = 'status-problem' %}
            {% elif stage.status == 'SKIPPED' %}
            {% set row_class = 'status-warning' %}
            {% else %}
            {% set row_class = 'status-ok' %}
            {% endif %}
            <tr class="{{ row_class }}">
              <td>{{ stage.name }}</td>
              <td>{{ stage.status }}</td>
              <td>{{ stage.duration }}</td>
            </tr>
            {% endfor %}
          </table>
          {{ hostvars['localhost'].fleet_container_updates_report_body }}
          {{ hostvars['localhost'].vm_updates_report_body }}
          {{ hostvars['localhost'].pve_updates_report_body }}
          {{ hostvars['localhost'].semaphore_peer_report_body }}

    - name: "Fail this run if any stage reported a problem, now that the combined report has been sent. Without this, ansible-playbook always exits 0 regardless of a real problem - the per-host rescue blocks that keep the orchestration going (so later stages are correctly marked SKIPPED and the report stays accurate) also mean Semaphore's own task status never reflects it on its own"
      ansible.builtin.fail:
        msg: "full-updates reported a problem in one or more stages - see the report email for details."
      when: full_run_any_problem
