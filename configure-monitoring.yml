---
- name: One-time (or reconciliation) fleet monitoring backfill - every VM
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!proxmox_pool_kubernetes:!proxmox_pool_standby') }}"
  gather_facts: false
  tasks:
    - name: Install node_exporter
      include_role:
        name: node_exporter_install

    # ansible_host is a real IP for hosts provisioned by provision-vm.yml, but legacy hosts resolve
    # it via semaphore103's /etc/hosts only - unusable from the Prometheus host, so fall back to
    # extracting the IP from health_check_url, as decommission-vm.yml already does.
    - name: Resolve this VM's real IP
      ansible.builtin.set_fact:
        monitoring_target_ip: >-
          {{
            ansible_host
            if (ansible_host | regex_search('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'))
            else (health_check_url | default('') | regex_replace('^https?://([^:/]+).*$', '\1'))
          }}

    - name: Register this host as a Prometheus scrape target
      include_role:
        name: prometheus_target
      vars:
        prometheus_target_name: "{{ inventory_hostname }}"
        prometheus_target_ip: "{{ monitoring_target_ip }}"
        prometheus_target_job: node_exporter
        prometheus_target_role_label: vm
        prometheus_target_state: present
      when: monitoring_target_ip | length > 0

- name: One-time (or reconciliation) fleet monitoring backfill - Proxmox nodes
  hosts: pve1,pve2,pve3
  gather_facts: false
  tasks:
    - name: Install node_exporter
      include_role:
        name: node_exporter_install

    - name: Install smartctl_exporter
      include_role:
        name: smartctl_exporter_install

    - name: Register this node's node_exporter as a Prometheus scrape target
      include_role:
        name: prometheus_target
      vars:
        prometheus_target_name: "{{ inventory_hostname }}"
        prometheus_target_ip: "{{ ansible_host }}"
        prometheus_target_job: node_exporter
        prometheus_target_role_label: pve_node
        prometheus_target_state: present

    - name: Register this node's smartctl_exporter as a Prometheus scrape target
      include_role:
        name: prometheus_target
      vars:
        prometheus_target_name: "{{ inventory_hostname }}"
        prometheus_target_ip: "{{ ansible_host }}"
        prometheus_target_job: smartctl_exporter
        prometheus_target_role_label: pve_node
        prometheus_target_state: present

# The targets above are staged in the working copy of this repository: Argo CD gives the committed ones to Prometheus.
- name: Commit the scrape targets of Prometheus
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check whether a target changed
      ansible.builtin.command:
        argv: [git, diff, --cached, --quiet]
        chdir: "{{ playbook_dir }}"
      register: monitoring_staged
      failed_when: monitoring_staged.rc not in [0, 1]
      changed_when: false

    - name: Commit and push the targets
      ansible.builtin.include_tasks: tasks/commit_and_push.yml
      vars:
        commit_message: "Update the scrape targets of Prometheus, through configure-monitoring.yml"
      when: monitoring_staged.rc == 1
