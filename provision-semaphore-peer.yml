---
# Run from semaphore101, targeting the new VM.
- name: Provision a fresh Semaphore peer instance identically to the existing one
  hosts: "{{ peer_host | default('semaphore102') }}"
  gather_facts: true
  tasks:
    - name: Deploy Semaphore via Podman Quadlet
      include_role:
        name: semaphore_provision

    # This playbook never ran the check before, which is how semaphore102 ended up with the raw
    # Rocky appstream/baseos/extras repos alongside the Katello-managed ones.
    - name: Disable any enabled repo that isn't managed by Katello
      include_role:
        name: katello_repo_cleanup

    - name: Wait for the new peer's Semaphore web service to respond
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/ping"
        status_code: 200
        timeout: 10
      register: new_peer_semaphore_ping
      retries: 30
      delay: 10
      until: (new_peer_semaphore_ping.status | default(0)) == 200
      delegate_to: localhost
