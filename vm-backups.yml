---
- name: "Back up every VM to Stockage_SSD then pCloud, migrating each one back to its own node right after (immich101 excluded - its photo library is already covered file-level by pcloud-backups.yml, and its own disk now lives on Stockage_SSD itself, so a vzdump copy there protects against nothing a physical drive failure wouldn't also take out)"
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!immich101') }}"
  gather_facts: false
  serial: 3
  tasks:
    - name: Resolve a reachable Proxmox node for delegate_to (falls back to pve2/pve3 if pve1 is down)
      include_role:
        name: resolve_proxmox_api_host

    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Capture the full list of targeted hosts (once)
      include_role:
        name: capture_host_list
      vars:
        capture_host_list_fact_name: vm_backups_host_list

    - name: "Process this VM's backup, recording success or failure for the report"
      block:
        - name: "Step 1 - Migrate this VM to {{ vm_backup_node }} if it isn't already there"
          when: proxmox_node != vm_backup_node
          block:
            - name: "Migrate VM to {{ vm_backup_node }} for backup"
              include_role:
                name: pve_migrate_vm
              vars:
                migrate_vmid: "{{ proxmox_vmid }}"
                migrate_target_node: "{{ vm_backup_node }}"
                migrate_delegate_to: "{{ proxmox_node }}"

            - name: "Record that this VM was migrated for backup, and its original node (before the health check below, so a failed check still triggers the migrate-back safety net in 'always' instead of stranding the VM here with nothing detecting it)"
              ansible.builtin.set_fact:
                vm_was_migrated: true
                vm_original_node: "{{ proxmox_node }}"

            - name: Check services after migration
              include_role:
                name: health_check
              vars:
                health_check_fail_on_unhealthy: true

        - name: Step 2 - Run the vzdump backup and upload it to pCloud
          include_role:
            name: vzdump_backup
          vars:
            vzdump_vmid: "{{ proxmox_vmid }}"
            vzdump_vm_name: "{{ inventory_hostname }}"

        - name: Mark this VM's backup as successful
          ansible.builtin.set_fact:
            vm_backup_status: OK

      rescue:
        - name: Mark this VM's backup as failed, and record why
          ansible.builtin.set_fact:
            vm_backup_status: FAILED
            vm_backup_failure_reason: "{{ ansible_failed_result.msg | default('Unknown error') }}"

      always:
        - name: "Step 3 - Migrate this VM back to {{ vm_original_node | default('its original node') }} (backup attempt done, success or not)"
          when: vm_was_migrated | default(false)
          block:
            - name: "Migrate VM back to its original node"
              include_role:
                name: pve_migrate_vm
              vars:
                migrate_vmid: "{{ proxmox_vmid }}"
                migrate_target_node: "{{ vm_original_node }}"
                migrate_delegate_to: "{{ vm_backup_node }}"

            - name: Check services after migrating back
              include_role:
                name: health_check
              vars:
                health_check_fail_on_unhealthy: true

            - name: Record that this VM made it back to its own node
              ansible.builtin.set_fact:
                vm_migrated_back: true

- name: Rebalance the cluster if anything got left behind (safety net for a failed migrate-back)
  hosts: "{{ vm_backup_node | default('pve1') }}"
  gather_facts: false
  run_once: true
  vars:
    pve_all_nodes:
      - pve1
      - pve2
      - pve3
  tasks:
    - name: Determine which VMs, if any, are stranded on the backup node
      ansible.builtin.set_fact:
        vm_backups_stragglers: >-
          {%- set stragglers = [] -%}
          {%- for h in hostvars['localhost'].vm_backups_host_list -%}
            {%- if hostvars[h].vm_was_migrated | default(false) and not (hostvars[h].vm_migrated_back | default(false)) -%}
              {%- set _ = stragglers.append(h) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ stragglers }}

    - name: Rebalance the whole cluster (only needed if a migrate-back failed above)
      include_role:
        name: pve_rebalance
      when: vm_backups_stragglers | length > 0

- name: Send aggregated vm-backups report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build and send the HTML report email
      include_role:
        name: send_report
      vars:
        report_subject: "[vm-backups] Weekly VM backup report"
        report_body: |
          <h2>VM backups report</h2>
          {% set stragglers = hostvars[vm_backup_node | default('pve1')].vm_backups_stragglers | default([]) %}
          {% if stragglers | length > 0 %}
          <p class="alert-warning">
            <strong>Left behind on {{ vm_backup_node }}:</strong> {{ stragglers | join(', ') }} — their migrate-back failed after backup, and the safety-net cluster rebalance was triggered to redistribute them. Check they landed somewhere sensible.
          </p>
          {% endif %}
          <table>
            <tr>
              <th>VM</th>
              <th>Status</th>
              <th>Details</th>
            </tr>
            {% for h in hostvars['localhost'].vm_backups_host_list %}
            {% set st = hostvars[h].vm_backup_status | default('FAILED') %}
            {% if st == 'OK' %}
            {% set row_class = 'status-ok' %}
            {% else %}
            {% set row_class = 'status-problem' %}
            {% endif %}
            <tr class="{{ row_class }}">
              <td>{{ h }}</td>
              <td>{{ st }}</td>
              <td>
                {% if st == 'OK' %}
                Backed up to pCloud
                {%- if hostvars[h].vm_was_migrated | default(false) %}
                {%- if hostvars[h].vm_migrated_back | default(false) %} (migrated to {{ vm_backup_node }} and back)
                {%- else %} (migrated to {{ vm_backup_node }} - migrate-back FAILED, see banner above){% endif %}
                {%- endif %}
                {% else %}
                {{ hostvars[h].vm_backup_failure_reason | default('Unknown error') }}
                {% endif %}
              </td>
            </tr>
            {% endfor %}
          </table>
