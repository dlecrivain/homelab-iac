---
- name: Configure Immich's Podman Quadlet units
  hosts: "{{ immich_host | default('immich102') }}"
  gather_facts: false
  tasks:
    - name: Make room for the library on /var and for the images on /home
      include_role:
        name: lvm_grow
      when: lvm_grow_targets is defined

    - name: Deploy the Immich Quadlet units
      include_role:
        name: immich_configure

    - name: Check services after config deploy
      include_role:
        name: health_check
      vars:
        health_check_fail_on_unhealthy: true
