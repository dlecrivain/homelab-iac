---
# Installs nfs-utils on a host of the CIS template, which serves or mounts NFSv4 only. NFSv4 does not use rpcbind:
# the template masks rpcbind.service, and the CIS profile also wants the socket that nfs-utils brings masked.
- name: Install nfs-utils
  ansible.builtin.dnf:
    name: nfs-utils
    state: present
  become: true

- name: Keep rpcbind masked, with its socket
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    state: stopped
  loop:
    - rpcbind.service
    - rpcbind.socket
  become: true

# mount.nfs is setuid root. The CIS profile wants every such binary audited, which the template does for the ones it
# ships, and counts the rules, so there is one per architecture. The audit configuration is immutable: the rule is
# loaded at the next boot.
- name: Audit the use of mount.nfs
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/nfs-utils.rules
    content: |
      -a always,exit -F arch=b32 -F path=/usr/sbin/mount.nfs -F perm=x -F auid>=1000 -F auid!=unset -k privileged
      -a always,exit -F arch=b64 -F path=/usr/sbin/mount.nfs -F perm=x -F auid>=1000 -F auid!=unset -k privileged
    owner: root
    group: root
    mode: '0600'
  become: true
