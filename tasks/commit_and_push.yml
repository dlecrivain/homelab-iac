---
# Commits the changes a playbook has made to this repository's working copy and pushes them. Included
# by every playbook that commits back (version bumps, the host_vars of a provisioned or decommissioned
# VM), so the identity, the push and the token redaction exist once.
#
#   commit_message       required
#   commit_all_tracked   commit every modified tracked file; default false, which commits only what the
#                        caller has staged (a new file needs git add, a removal git rm)
- name: Configure the git identity for this commit
  ansible.builtin.command:
    argv: [git, config, "{{ item.key }}", "{{ item.value }}"]
    chdir: "{{ playbook_dir }}"
  loop:
    - { key: user.email, value: "{{ git_commit_email }}" }
    - { key: user.name, value: "{{ git_commit_name }}" }
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

- name: Commit
  ansible.builtin.command:
    argv: "{{ ['git', 'commit'] + (['-a'] if commit_all_tracked | default(false) else []) + ['-m', commit_message] }}"
    chdir: "{{ playbook_dir }}"

# Another job may have pushed since this working copy was cloned (a scheduled version bump, another
# provisioning), and the push would then be rejected.
- name: Rebase the commit onto the remote branch
  ansible.builtin.command:
    argv: [git, pull, --rebase, "{{ git_push_url }}", "{{ git_push_branch }}"]
    chdir: "{{ playbook_dir }}"
  register: commit_rebase_result
  failed_when: false
  no_log: true

- name: Push the commit
  ansible.builtin.command:
    argv: [git, push, "{{ git_push_url }}", "{{ git_push_branch }}"]
    chdir: "{{ playbook_dir }}"
  register: commit_push_result
  failed_when: false
  no_log: true
  when: commit_rebase_result.rc == 0

# The push URL carries the token, so git's own error output is redacted before it is shown.
- name: Fail with a token-redacted error if the rebase or the push failed
  vars:
    commit_failed_step: "{{ 'rebase' if commit_rebase_result.rc != 0 else 'push' }}"
    commit_failed_result: "{{ commit_rebase_result if commit_rebase_result.rc != 0 else commit_push_result }}"
  ansible.builtin.fail:
    msg: >-
      git {{ commit_failed_step }} failed (rc={{ commit_failed_result.rc }}):
      {{
        (commit_failed_result.stderr | default('')) | replace(github_push_token, '***REDACTED***')
        if (github_push_token | default('') | length > 0)
        else (commit_failed_result.stderr | default('')) + " (github_push_token is empty - GITHUB_PUSH_TOKEN missing from this template's Variable Group)"
      }}
  when: commit_rebase_result.rc != 0 or commit_push_result.rc | default(0) != 0
