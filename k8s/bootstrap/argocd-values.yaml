# Values of the helm install of Argo CD, see the README. They are applied by hand with helm upgrade, since Argo CD does
# not manage itself.
configs:
  params:
    # Plain HTTP: the NodePort is reached on the LAN for now, and Traefik will terminate TLS in front of it.
    server.insecure: true
dex:
  enabled: false
notifications:
  enabled: true
  argocdUrl: https://argocd.k8s.lecrivaindaniel.fr
  # The login of the mailbox is in the Secret argocd-notifications-secret (email-username and email-password), made by
  # hand since this repository is public. The recipient is the annotation notifications.argoproj.io/subscribe.<trigger>.email
  # of the default AppProject, which every application belongs to, for the same reason.
  secret:
    create: false
  notifiers:
    service.email: |
      host: smtp.gmail.com
      port: 587
      username: $email-username
      password: $email-password
      from: $email-username
  templates:
    template.app-deployed: |
      email:
        subject: "{{.app.metadata.name}} updated on the Kubernetes test cluster"
      message: |
        {{.app.metadata.name}} is up to date and healthy.
        {{with .app.spec.source}}{{if .path}}
        Change: {{$lines := compact (splitList "\n" (call $.repo.GetCommitMetadata $.app.status.operationState.syncResult.revision).Message)}}{{if hasPrefix "Merge pull request" (first $lines)}}{{last $lines}}{{else}}{{first $lines}}{{end}}{{end}}{{end}}
        {{$prev := ""}}{{$cur := ""}}{{range .app.status.history}}{{$prev = $cur}}{{$cur = .}}{{end}}{{if $prev}}{{if $prev.sources}}{{$was := (index $prev.sources 0).targetRevision}}{{$now := (index $cur.sources 0).targetRevision}}{{if ne $was $now}}
        Chart {{(index $cur.sources 0).chart}}: {{$was}} -> {{$now}}{{end}}{{else}}{{with $prev.source}}{{if .chart}}{{$was := .targetRevision}}{{$now := $cur.source.targetRevision}}{{if ne $was $now}}
        Chart {{.chart}}: {{$was}} -> {{$now}}{{end}}{{end}}{{end}}{{end}}{{end}}

        {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
    template.app-sync-failed: |
      email:
        subject: "{{.app.metadata.name}} could not be updated on the Kubernetes test cluster"
      message: |
        Argo CD failed to synchronise {{.app.metadata.name}}: {{.app.status.operationState.message}}

        {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
    template.app-health-degraded: |
      email:
        subject: "{{.app.metadata.name}} is degraded on the Kubernetes test cluster"
      message: |
        {{.app.metadata.name}} is not healthy.

        {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
  triggers:
    # Once per synchronisation that ran. An application with two sources has a list of revisions and no single revision, so
    # the end of the operation is what tells one synchronisation from the next.
    # root only lists the other applications, which send their own mail: a mail for it would repeat each of theirs. It is still
    # reported when its synchronisation fails or it is degraded.
    trigger.on-deployed: |
      - description: The application is synchronised and healthy
        oncePer: app.status.operationState?.finishedAt
        send: [app-deployed]
        when: app.metadata.name != 'root' and app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
    trigger.on-sync-failed: |
      - description: The synchronisation failed
        oncePer: app.status.operationState?.finishedAt
        send: [app-sync-failed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: The application is degraded
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'
server:
  service:
    type: NodePort
    nodePortHttp: 30081
