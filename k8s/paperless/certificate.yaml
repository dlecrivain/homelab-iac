# The certificate of the name Paperless-ngx is reached under, which the wildcard of k8s.lecrivaindaniel.fr does not cover. It
# is issued ahead of the move: the DNS-01 challenge needs a record in the zone, not the address of the service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paperless
  namespace: paperless
spec:
  secretName: paperless-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: le-prod
  dnsNames:
    - paperless.lecrivaindaniel.fr
