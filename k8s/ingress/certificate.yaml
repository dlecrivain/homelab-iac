# One certificate for everything under k8s.lecrivaindaniel.fr, served by default by Traefik. It is issued by the staging
# issuer of Let's Encrypt until the whole chain has been seen to work, then by le-prod.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s
  namespace: traefik
spec:
  secretName: wildcard-k8s-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: le-staging
  dnsNames:
    - "*.k8s.lecrivaindaniel.fr"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-k8s-tls
