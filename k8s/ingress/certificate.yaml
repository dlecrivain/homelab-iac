# One certificate for everything under k8s.lecrivaindaniel.fr, served by default by Traefik. The le-staging issuer stays
# available to try a change without using the production limits of Let's Encrypt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s
  namespace: traefik
spec:
  secretName: wildcard-k8s-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: le-prod
  dnsNames:
    - "*.k8s.lecrivaindaniel.fr"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-k8s-tls
