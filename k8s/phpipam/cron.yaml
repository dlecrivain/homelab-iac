# The job of phpIPAM that scans the subnets every hour to tell which addresses answer. Ping needs raw sockets, which containerd gives to
# every container by default; the PodSecurity baseline of the cluster would refuse any capability added to them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpipam-cron
  namespace: phpipam
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phpipam-cron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phpipam-cron
    spec:
      enableServiceLinks: false
      containers:
        - name: cron
          image: docker.io/phpipam/phpipam-cron:v1.9.0
          envFrom:
            - configMapRef:
                name: phpipam
          env:
            - name: IPAM_DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: phpipam-secrets
                  key: IPAM_DATABASE_PASS
            - name: SCAN_INTERVAL
              value: 1h
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
