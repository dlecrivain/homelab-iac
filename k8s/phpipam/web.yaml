# The web interface of phpIPAM, which the Ansible playbooks also call as an API to reserve and free addresses. A change of the
# image replaces the pod as a whole, never two at once: a new release may need the database upgraded from the interface (Administration,
# then the database upgrade it offers) before it works, so take a dump first (systemctl --user start mariadb-dump-phpipam on nfs101).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpipam-web
  namespace: phpipam
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phpipam-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phpipam-web
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: docker.io/phpipam/phpipam-www:v1.8.3
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: phpipam
          env:
            - name: IPAM_DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: phpipam-secrets
                  key: IPAM_DATABASE_PASS
          # The interface pings addresses to tell whether they answer.
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: files
              mountPath: /phpipam/config.docker.php
              subPath: config.docker.php
            - name: files
              mountPath: /etc/apache2/conf.d/zzz-proxy-tls.conf
              subPath: zzz-proxy-tls.conf
          startupProbe:
            httpGet:
              path: /index.php?page=login
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /index.php?page=login
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /index.php?page=login
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: files
          configMap:
            name: phpipam-files
---
apiVersion: v1
kind: Service
metadata:
  name: phpipam
  namespace: phpipam
spec:
  selector:
    app.kubernetes.io/name: phpipam-web
  ports:
    - name: http
      port: 80
      targetPort: http
