apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - prometheus.lecrivaindaniel.fr
      secretName: prometheus-tls
  rules:
    - host: prometheus.k8s.lecrivaindaniel.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    - host: prometheus.lecrivaindaniel.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
---
# Alertmanager answers under the name of the cluster, which the wildcard certificate covers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: alertmanager.k8s.lecrivaindaniel.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093
---
# The certificate of the name Prometheus is reached under, which the wildcard of k8s.lecrivaindaniel.fr does not cover. It is
# issued ahead of the move: the DNS-01 challenge needs a record in the zone, not the address of the service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
spec:
  secretName: prometheus-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: le-prod
  dnsNames:
    - prometheus.lecrivaindaniel.fr
