# blackbox-exporter makes the requests of the probes (the pages, the ports) and reports how they went.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
      # It reads its configuration once, at its start: a change of the file replaces the pod.
      annotations:
        checksum/config: {{ .Files.Get "files/blackbox.yml" | sha256sum }}
    spec:
      enableServiceLinks: false
      containers:
        - name: blackbox-exporter
          image: {{ .Values.images.blackbox.repository }}:{{ .Values.images.blackbox.tag }}
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
          ports:
            - name: web
              containerPort: 9115
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: web
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: blackbox.yml
                path: config.yml
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: web
      port: 9115
      targetPort: web
---
# One exporter for the whole cluster of Proxmox, through the API of a node. Its configuration holds the token of the API, so it
# is the Secret pve-exporter-config, made by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      enableServiceLinks: false
      containers:
        - name: pve-exporter
          image: {{ .Values.images.pveExporter.repository }}:{{ .Values.images.pveExporter.tag }}
          ports:
            - name: web
              containerPort: 9221
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/pve.yml
              subPath: pve.yml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
      volumes:
        - name: config
          secret:
            secretName: pve-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: pve-exporter
  ports:
    - name: web
      port: 9221
      targetPort: web
