# Alertmanager mails what Prometheus raises. Its configuration holds the SMTP login, so it is the Secret alertmanager-config, made
# by hand. Its silences and the log of what it has sent are on nfs101, so that a restart does not forget them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: alertmanager
          image: {{ .Values.images.alertmanager.repository }}:{{ .Values.images.alertmanager.tag }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            # One instance: no gossip between several of them.
            - --cluster.listen-address=
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
        - name: data
          nfs:
            server: {{ .Values.nfs.server }}
            path: {{ .Values.nfs.path }}/alertmanager
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
