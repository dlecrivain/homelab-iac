# The addresses LoadBalancer services can take, reserved in phpIPAM as talos-lb101 (Traefik), talos-lb102 and the one of the DNS
# server, and the nodes that announce them on the LAN. The control planes stay out: they are not meant to carry traffic.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: 192.168.1.128
      stop: 192.168.1.129
    # The address that the DHCP of the Freebox gives to the devices as their DNS server.
    - start: 192.168.1.114
      stop: 192.168.1.114
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^ens18$
  loadBalancerIPs: true
