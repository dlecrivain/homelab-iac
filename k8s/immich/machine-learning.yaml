# The recognition of faces, objects and text in the photos. It keeps the models it downloads on the immich share of nfs101, so that a
# restart does not fetch them again. It loads a model when a job needs it and frees it after a while, so it takes memory in bursts;
# wk102 carries the least, which is why it goes there by preference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos-wk102
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.1
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: cache
              mountPath: /cache
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 2Gi
      volumes:
        - name: cache
          nfs:
            server: 192.168.1.130
            path: /srv/nfs/immich/model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
