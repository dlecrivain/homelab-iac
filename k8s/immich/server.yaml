# Immich. Its files are on the immich share of nfs101, the database is outside the cluster. One replica that is replaced as a whole
# on an update, never two at once: two instances must not write the same files and database. The first start of a newer version
# runs its migrations, which cannot be undone: presync-dump.yaml takes a dump of the database before every synchronisation, so a
# change of the tag is safe to merge by itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.3.5
          ports:
            - name: http
              containerPort: 2283
          envFrom:
            - configMapRef:
                name: immich
            - secretRef:
                name: immich-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          # The first start of a newer version migrates the database before the server answers.
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          nfs:
            server: 192.168.1.130
            path: /srv/nfs/immich
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
