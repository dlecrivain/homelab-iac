# Semaphore. The database is outside the cluster, and what the pod writes (the checkouts of the repository, the keys of a task) is
# thrown away with it. One replica that is replaced as a whole on an update, never two at once: two instances would both start the
# schedules. The tasks of this instance must never stop or drain a node of the cluster, since they run in a pod of the cluster:
# those are the tasks of semaphore103.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semaphore-bck
  namespace: semaphore-bck
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: semaphore-bck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semaphore-bck
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
      # A run of Ansible takes memory, and the worker of Immich's machine learning, up to 2 GiB when it works, comes last.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - talos-wk102
      containers:
        - name: semaphore
          image: docker.io/semaphoreui/semaphore:v2.19.17
          ports:
            - name: web
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: semaphore-bck
            - secretRef:
                name: semaphore-bck-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/semaphore
            - name: data
              mountPath: /var/lib/semaphore
            - name: tmp
              mountPath: /tmp/semaphore
          startupProbe:
            httpGet:
              path: /api/ping
              port: web
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ping
              port: web
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/ping
              port: web
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: semaphore-bck
  namespace: semaphore-bck
spec:
  selector:
    app.kubernetes.io/name: semaphore-bck
  ports:
    - name: web
      port: 3000
      targetPort: web
