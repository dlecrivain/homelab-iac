apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: semaphore-bck
  namespace: semaphore-bck
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: semaphore-bck.k8s.lecrivaindaniel.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: semaphore-bck
                port:
                  number: 3000
