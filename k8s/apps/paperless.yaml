# The document archive. It is synchronised by hand for now, while the copy of the data is checked: it must not start by itself
# on a database that is being restored.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dlecrivain/homelab-iac.git
    targetRevision: main
    path: k8s/paperless
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
