# The DNS server of the LAN, with the filters. Argo CD applies a change of its manifests by itself, and puts back what is changed by
# hand. Its Deployment is replaced as a whole on every change, so an update of the image cuts the DNS for a few seconds.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dlecrivain/homelab-iac.git
    targetRevision: main
    path: k8s/adguard
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
