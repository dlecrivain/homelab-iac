# The accounts used to sign in to Headlamp. The token of headlamp-view is filled in by Kubernetes, so its data is not compared.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-accounts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dlecrivain/homelab-iac.git
    targetRevision: main
    path: k8s/headlamp-accounts
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  ignoreDifferences:
    - kind: Secret
      name: headlamp-view-token
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
