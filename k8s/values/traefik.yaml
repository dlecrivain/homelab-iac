# The ingress controller. Its service takes talos-lb101 from the Cilium pool and is announced on the LAN. Two replicas on
# different workers, and what arrives on port 80 goes to HTTPS.
deployment:
  replicas: 2
service:
  annotations:
    lbipam.cilium.io/ips: 192.168.1.128
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    # The default read timeout of 60 seconds covers the whole request and would cut a long upload, such as a video sent to
    # Immich. The other timeouts keep their defaults.
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 600s
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
    # The routes to the web interfaces of the VMs (k8s/edge) go to Services of type ExternalName, since Argo CD does not manage
    # the EndpointSlices that a Service without pods would need.
    allowExternalNameServices: true
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
