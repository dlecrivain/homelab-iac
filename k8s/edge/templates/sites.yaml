{{- range .Values.sites }}
---
# {{ .host }}, served by {{ .address }}:{{ .port }}. The Service has no selector: its only endpoint is the VM.
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  ports:
    - name: web
      port: {{ .port }}
      targetPort: {{ .port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    kubernetes.io/service-name: {{ .name }}
addressType: IPv4
ports:
  - name: web
    port: {{ .port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .address }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Values.namespace }}-security-headers@kubernetescrd
    {{- if eq (.scheme | default "http") "https" }}
    traefik.ingress.kubernetes.io/service.serversscheme: https
    {{- end }}
    {{- if .transport }}
    traefik.ingress.kubernetes.io/service.serverstransport: {{ $.Values.namespace }}-{{ .transport }}@kubernetescrd
    {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}
                port:
                  number: {{ .port }}
{{- end }}
