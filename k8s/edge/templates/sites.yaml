{{- range .Values.sites }}
---
# {{ .host }}, served by {{ .address }}:{{ .port }}. The Service has no pods: its name is the address of the VM, which Traefik
# connects to. It is not an EndpointSlice, which Argo CD leaves out.
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  {{- if or (eq (.scheme | default "http") "https") .transport }}
  # Traefik reads the settings of the connection to the upstream on the Service, not on the Ingress.
  annotations:
    {{- if eq (.scheme | default "http") "https" }}
    traefik.ingress.kubernetes.io/service.serversscheme: https
    {{- end }}
    {{- if .transport }}
    traefik.ingress.kubernetes.io/service.serverstransport: {{ $.Values.namespace }}-{{ .transport }}@kubernetescrd
    {{- end }}
  {{- end }}
spec:
  type: ExternalName
  externalName: {{ .address | quote }}
  ports:
    - name: web
      port: {{ .port }}
      targetPort: {{ .port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Values.namespace }}-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}
                port:
                  number: {{ .port }}
{{- end }}
