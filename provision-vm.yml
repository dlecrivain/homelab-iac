---
- name: Resolve networking and clone the golden template
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fail clearly if new_vm_name wasn't provided
      ansible.builtin.fail:
        msg: "new_vm_name is required - pass it with -e new_vm_name=<hostname>"
      when: new_vm_name is not defined

    - name: Fail clearly if a Proxmox VM with this name already exists
      ansible.builtin.fail:
        msg: "A Proxmox VM named '{{ new_vm_name }}' already exists (vmid {{ hostvars[new_vm_name].proxmox_vmid | default('?') }} on {{ hostvars[new_vm_name].proxmox_node | default('?') }}) - choose a different name, or decommission it first"
      when: new_vm_name in hostvars

    - name: Check whether host_vars/<new_vm_name>.yml already exists in this repo
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/host_vars/{{ new_vm_name }}.yml"
      register: provision_existing_host_vars

    - name: Fail clearly if host_vars/<new_vm_name>.yml already exists in this repo
      ansible.builtin.fail:
        msg: "host_vars/{{ new_vm_name }}.yml already exists in this repo - choose a different name, or this VM was already provisioned (or only partially cleaned up)"
      when: provision_existing_host_vars.stat.exists

    - name: Check whether this name is already registered in Katello
      ansible.builtin.command: >
        hammer -u {{ katello_hammer_username }} -p {{ katello_hammer_password }}
        host info --name {{ new_vm_name }}
      register: provision_existing_katello_check
      changed_when: false
      failed_when: false
      delegate_to: "{{ lpkat_host }}"
      become: true
      no_log: true

    - name: Fail clearly if this name is already registered in Katello
      ansible.builtin.fail:
        msg: "'{{ new_vm_name }}' is already registered in Katello - choose a different name, or deregister it first"
      when: provision_existing_katello_check.rc == 0

    - name: Capture the run start time
      include_role:
        name: capture_start_time

    - name: Resolve a reachable Proxmox node for delegate_to (falls back to pve2/pve3 if pve1 is down)
      include_role:
        name: resolve_proxmox_api_host

    - name: Resolve the next free IP via phpIPAM (with liveness self-heal)
      include_role:
        name: phpipam_next_ip

    - name: Clone and start the VM from the golden template
      include_role:
        name: pve_clone_vm

    - name: Register the freshly-started VM as a temporary inventory host
      ansible.builtin.add_host:
        name: new_vm_staging
        groups: provision_target
        ansible_host: "{{ provision_template_ip }}"
        ansible_user: deploy
        resolved_new_ip: "{{ resolved_new_ip }}"
        new_vmid: "{{ new_vmid }}"

- name: Reconfigure the new VM (IP, hostname, SSH host key) and provision its software
  hosts: new_vm_staging
  gather_facts: false
  tasks:
    - name: Wait for the freshly cloned VM to answer SSH at its default staging IP
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Change IP/hostname and regenerate the SSH host key, then reconnect at the real IP
      include_role:
        name: provision_vm_reconnect

    - name: Gather facts now that the host is stable at its final identity
      ansible.builtin.setup:

    - name: Apply OS updates
      include_role:
        name: apply_updates

    - name: Ensure podman and git are installed (dnf/yum)
      ansible.builtin.dnf:
        name:
          - podman
          - git
        state: present
      become: true
      when: ansible_facts['pkg_mgr'] in ['dnf', 'yum']

    - name: Ensure podman and git are installed (apt)
      ansible.builtin.apt:
        name:
          - podman
          - git
        state: present
      become: true
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Install node_exporter for fleet monitoring
      include_role:
        name: node_exporter_install

    - name: Register this host with Katello
      include_role:
        name: katello_register_host

    - name: Get the Katello-managed repo IDs (defined in redhat.repo by the registration script)
      ansible.builtin.command: grep -oP '^\[\K[^\]]+' /etc/yum.repos.d/redhat.repo
      register: provision_katello_repo_ids
      changed_when: false
      failed_when: false
      when: ansible_facts['pkg_mgr'] in ['dnf', 'yum']

    - name: Fail clearly if no Katello-managed repos were found (redhat.repo missing or empty - registration may not have worked as expected, don't blindly disable everything below)
      ansible.builtin.fail:
        msg: "No repos found in /etc/yum.repos.d/redhat.repo - Katello registration may not have configured repos as expected"
      when:
        - ansible_facts['pkg_mgr'] in ['dnf', 'yum']
        - provision_katello_repo_ids.stdout_lines | default([]) | length == 0

    - name: Get the full repo list with status
      ansible.builtin.command: dnf repolist all
      register: provision_repo_list
      changed_when: false
      when: ansible_facts['pkg_mgr'] in ['dnf', 'yum']

    - name: "Determine which enabled repos aren't managed by Katello (varies by template/version - e.g. epel isn't always present, so a fixed list would be wrong either way)"
      ansible.builtin.set_fact:
        provision_non_katello_repos: >-
          {{
            provision_repo_list.stdout_lines
            | select('match', '^\S+.*\senabled\s*$')
            | map('regex_replace', '^(\S+)\s.*$', '\1')
            | reject('in', provision_katello_repo_ids.stdout_lines)
            | list
          }}
      when: ansible_facts['pkg_mgr'] in ['dnf', 'yum']

    - name: Disable every enabled repo that isn't managed by Katello (avoids selinux-policy-targeted version conflicts between the vendor repos and the Katello content view - a real incident on patchmon101)
      ansible.builtin.command: "dnf config-manager --set-disabled {{ provision_non_katello_repos | join(' ') }}"
      become: true
      changed_when: false
      when:
        - ansible_facts['pkg_mgr'] in ['dnf', 'yum']
        - provision_non_katello_repos | length > 0

    - name: Register the assigned IP as officially used in phpIPAM
      ansible.builtin.uri:
        url: "{{ phpipam_base_url }}/addresses/"
        method: POST
        headers:
          token: "{{ hostvars['localhost'].phpipam_session_token }}"
        body_format: json
        body:
          subnetId: "{{ hostvars['localhost'].phpipam_subnet_id }}"
          ip: "{{ resolved_new_ip }}"
          hostname: "{{ new_vm_name }}"
          description: "Provisioned by provision-vm.yml"
        status_code: [200, 201]
      delegate_to: localhost
      no_log: true

    - name: "Register this VM as a Prometheus scrape target (no-op on prometheus101's own provisioning run, before it exists in inventory yet - configure-prometheus.yml handles that bootstrap case itself)"
      include_role:
        name: prometheus_target
      vars:
        prometheus_target_name: "{{ new_vm_name }}"
        prometheus_target_ip: "{{ resolved_new_ip }}"
        prometheus_target_job: node_exporter
        prometheus_target_role_label: vm
        prometheus_target_state: present
      when: "'prometheus101' in hostvars"

- name: Record the new VM's static ansible_host in this repo
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Write host_vars/<new_vm_name>.yml with the resolved static IP
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/host_vars/{{ new_vm_name }}.yml"
        mode: '0644'
        content: |
          ansible_host: {{ resolved_new_ip }} # static IP assigned via phpIPAM by provision-vm.yml
          ansible_user: deploy

    - name: Configure a git identity for this commit (harmless if already set)
      ansible.builtin.command: "{{ item }}"
      loop:
        - git config user.email "d.lecrivain47@gmail.com"
        - git config user.name "dlecrivain"
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false

    - name: Stage the new host_vars file (untracked - git commit -am only picks up tracked changes)
      ansible.builtin.command: "git add host_vars/{{ new_vm_name }}.yml"
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false

    - name: Commit the new host_vars file
      ansible.builtin.command: >-
        git commit -m "Add host_vars for {{ new_vm_name }} ({{ resolved_new_ip }}), provisioned via provision-vm.yml"
      args:
        chdir: "{{ playbook_dir }}"

    - name: Push the commit to origin/main
      ansible.builtin.command: "git push https://{{ github_push_token }}@github.com/dlecrivain/homelab-iac main"
      args:
        chdir: "{{ playbook_dir }}"
      register: provision_git_push
      failed_when: false
      no_log: true

    - name: Fail with a token-redacted error if the push failed
      ansible.builtin.fail:
        msg: >-
          git push failed (rc={{ provision_git_push.rc }}):
          {{
            (provision_git_push.stderr | default('')) | replace(github_push_token, '***REDACTED***')
            if (github_push_token | default('') | length > 0)
            else (provision_git_push.stderr | default('')) + ' (github_push_token is empty - GITHUB_PUSH_TOKEN missing from this template''s Variable Group)'
          }}
      when: provision_git_push.rc != 0

- name: Rebalance the cluster now that the new VM has landed on pve1
  hosts: "{{ pve_clone_node | default('pve1') }}"
  gather_facts: false
  run_once: true
  vars:
    pve_all_nodes:
      - pve1
      - pve2
      - pve3
  tasks:
    - name: Rebalance the whole cluster
      include_role:
        name: pve_rebalance

- name: Send the provisioning report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build and send the HTML report email
      include_role:
        name: send_report
      vars:
        report_subject: "[provision-vm] {{ new_vm_name }} provisioned"
        report_body: |
          <h2>VM provisioning report</h2>
          <table>
            <tr><th>Hostname</th><td>{{ new_vm_name }}</td></tr>
            <tr><th>IP address</th><td>{{ resolved_new_ip }}</td></tr>
            <tr><th>Proxmox VMID</th><td>{{ new_vmid }}</td></tr>
            <tr><th>Node</th><td>{{ pve_clone_node }}</td></tr>
          </table>
          <p>Registered with Katello, updated, Podman + git installed, host_vars committed and pushed to this repo, node_exporter installed and registered with Prometheus.</p>
