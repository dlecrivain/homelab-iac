---
# A reconciliation entry point: both provisioning playbooks now do this automatically, but hosts
# provisioned before that was added were never caught up.
- name: Disable any repo not managed by Katello, fleet-wide
  hosts: "{{ target_hosts | default('proxmox_all_qemu:!lpkat101') }}"
  gather_facts: true
  tasks:
    - name: Disable any enabled repo that isn't managed by Katello
      include_role:
        name: katello_repo_cleanup
