ansible_host: 192.168.1.111 # explicit static IP - predates provision-vm.yml's convention of always setting this, connected by bare hostname until now, which is exactly what let a stale/wrong known_hosts entry under that name silently break automation

vm_backup_local_retention: 1 # immich's backups are much larger (photo/video library) - kept at the old default rather than bumped with the rest of the fleet

pve_shutdown_for_maintenance: true # disk lives on pve1's node-local Stockage_SSD (not present on pve2/pve3) - can't be live-migrated, so pve-updates.yml/pve_rebalance shut it down for pve1's maintenance window instead of evacuating it

health_check_url: "http://192.168.1.111:2283"
health_check_podman_user: immich
health_check_containers:
  - immich_machine_learning
  - immich_redis
  - immich_postgres
  - immich_server

podman_units:
  - name: immich_postgres
    service_name: immich-postgres
    scope: user
    become_user: immich
  - name: immich_redis
    service_name: immich-redis
    scope: user
    become_user: immich
  - name: immich_machine_learning
    service_name: immich-machine-learning
    scope: user
    become_user: immich
  - name: immich_server
    service_name: immich-server
    scope: user
    become_user: immich
