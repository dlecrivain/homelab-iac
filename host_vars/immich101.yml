ansible_host: 192.168.1.111

vm_backup_local_retention: 1 # the backup is large (photo and video library), so only the latest is kept locally

# Left where it is by the optional cluster rebalance: its disks total ~570G, so every move copies
# ~400G over the mesh and writes it to the target NVMe. It is still migrated when its node is patched.
pve_rebalance_pinned: true

# A version bump pulls ~1.7G before the server even starts, then runs database migrations on its
# first run, so the default 5 retries over 50s would report a healthy upgrade as a failure.
health_check_retries: 30
health_check_delay: 10
health_check_url: "http://192.168.1.111:2283"
health_check_podman_user: immich
health_check_containers:
  - immich_machine_learning
  - immich_redis
  - immich_postgres
  - immich_server

podman_units:
  - name: immich_postgres
    service_name: immich-postgres
    scope: user
    become_user: immich
  - name: immich_redis
    service_name: immich-redis
    scope: user
    become_user: immich
  - name: immich_machine_learning
    service_name: immich-machine-learning
    scope: user
    become_user: immich
  - name: immich_server
    service_name: immich-server
    scope: user
    become_user: immich
