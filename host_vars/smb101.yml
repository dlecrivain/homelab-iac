ansible_host: 192.168.1.123 # static IP assigned via phpIPAM by provision-vm.yml
ansible_user: deploy

# The devices of the Aqara doorbell, which write its event clips here. The router gives each a fixed address.
smb_allowed_hosts:
  - 192.168.1.30  # Doorbell Repeater, the chime that holds the storage
  - 192.168.1.31  # Doorbell
smb_data_size_gb: 30

# The share is what this host is for, and roles/smb_configure announces it to the doorbell devices.
openscap_waived_rules:
  package_samba_removed: The host serves the SMB share the Aqara doorbell writes its clips to.
  service_avahi-daemon_disabled: Avahi announces the share to the doorbell devices, the only addresses mDNS is open to.

# nfs101 exports the library of Immich and the files of Home Assistant, Prometheus and AdGuard read-only to this host, which copies them.
pcloud_backup_mounts:
  - src: "192.168.1.130:/srv/nfs/immich/library"
    path: /mnt/immich-library
  - src: "192.168.1.130:/srv/nfs/homeassistant"
    path: /mnt/homeassistant
  # The nightly snapshot of the database of Prometheus, which a job of the cluster writes to the backup folder of the share at 01:40.
  - src: "192.168.1.130:/srv/nfs/prometheus"
    path: /mnt/prometheus
  - src: "192.168.1.130:/srv/nfs/adguard"
    path: /mnt/adguard

# The configuration of Home Assistant and the data of its Matter server, packed every night into a dated archive before the copy
# below, and kept 14 days here. The history is in a Postgres that nfs101 dumps itself, the internal backups and the caches are
# left out.
config_archives:
  - name: homeassistant
    directory: /mnt/homeassistant
    paths:
      - config
      - matter
    exclude:
      - config/backups
      - config/deps
      - config/tts
      - "config/home-assistant.log*"
      - "config/home-assistant_v2.db*"
      - "*/__pycache__"
    dest: /srv/backups/homeassistant
    keep_days: 14
  # The configuration of AdGuard Home (its settings, its filters and its rules). The query log and the statistics are left out.
  - name: adguard
    directory: /mnt/adguard
    paths:
      - conf
    dest: /srv/backups/adguard
    keep_days: 14

pcloud_backup_jobs:
  - name: Immich Daniel
    mode: copy
    source: /mnt/immich-library/ee67ced3-2998-420c-82b5-2768292c81ab/
    dest: "pcloud:Backups/Immich/Daniel"
  - name: Immich Marine
    mode: copy
    source: /mnt/immich-library/1c98b908-3122-4969-b34a-e63b6a242994/
    dest: "pcloud:Backups/Immich/Marine"
  # The Aqara Home app deletes the clips from the share after the delay chosen there, 90 days; the copy to the cloud
  # storage never deletes anything. Files younger than 10 minutes may still be written, so they wait for the next run.
  - name: Aqara doorbell
    mode: copy
    source: /srv/aqara
    dest: "pcloud:Backups/Aqara"
    extra_args: "--min-age 10m"
  # The archives of the configuration are never deleted from the cloud storage by this copy.
  - name: Home Assistant configuration
    mode: copy
    source: /srv/backups/homeassistant
    dest: "pcloud:Backups/HomeAssistant"
  - name: AdGuard configuration
    mode: copy
    source: /srv/backups/adguard
    dest: "pcloud:Backups/AdGuard"
  # A mirror of the last snapshot: the blocks of the database never change once written, so only the new ones are sent.
  - name: Prometheus snapshot
    mode: sync
    source: /mnt/prometheus/backup/latest
    dest: "pcloud:Backups/Prometheus"
