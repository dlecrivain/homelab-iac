ansible_host: 192.168.1.116 # explicit static IP - predates provision-vm.yml's convention of always setting this, connected by bare hostname until now, which is exactly what let a stale/wrong known_hosts entry under that name silently break automation

health_check_url: "http://192.168.1.116:8080/index.php?page=login"
health_check_podman_user: root
health_check_containers:
  - phpipam-mariadb
  - phpipam-web
  - phpipam-cron

podman_units:
  - name: phpipam-mariadb
    scope: root
  - name: phpipam-web
    scope: root
  - name: phpipam-cron
    scope: root
