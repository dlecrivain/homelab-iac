ansible_host: 192.168.1.117 # static IP assigned via phpIPAM by provision-vm.yml
ansible_user: deploy

vm_backup_local_retention: 1 # the backup is large (photo and video library), so only the latest is kept locally

# Left where it is by the optional cluster rebalance: its disks total ~570G, so every move copies
# ~400G over the mesh and writes it to the target NVMe. It is still migrated when its node is patched.
pve_rebalance_pinned: true

# The hosts that may read the photo and video library over NFS, read-only: smb101, which copies it to the cloud storage.
immich_library_readers:
  - 192.168.1.123

# A version bump pulls ~1.7G before the server even starts, then runs database migrations on its
# first run, so the default 5 retries over 50s would report a healthy upgrade as a failure.
health_check_retries: 30
health_check_delay: 10
health_check_url: "http://192.168.1.117:2283"
health_check_podman_user: deploy
health_check_containers:
  - immich_machine_learning
  - immich_redis
  - immich_postgres
  - immich_server

podman_units:
  - name: immich_postgres
    service_name: immich-postgres
    scope: user
  - name: immich_redis
    service_name: immich-redis
    scope: user
  - name: immich_machine_learning
    service_name: immich-machine-learning
    scope: user
  - name: immich_server
    service_name: immich-server
    scope: user

# lvm_grow brings these volumes to at least this size. The photo and video library is about 305 GB and grows, on
# top of the database. The rootless images (server, machine learning, Postgres, Valkey) are about 7 GB and
# live in the home directory, which the template makes only 2 GB, so a new version needs room next to the old one.
lvm_grow_targets:
  - lv: lv_var
    size_gb: 500
  - lv: lv_home
    size_gb: 24
