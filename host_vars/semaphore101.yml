ansible_host: 192.168.1.117 # static DHCP reservation; DNS doesn't resolve this VM's name yet
ansible_user: deploy # otherwise defaults to the connecting Semaphore container's own OS user
health_check_url: "http://{{ ansible_host }}:3000/api/ping"
health_check_podman_user: root
health_check_containers:
  - semaphore
  - semaphore_db

podman_units:
  - name: semaphore
    scope: root
  - name: semaphore_db
    scope: root
    service_name: semaphore-db # Quadlet names the systemd unit after semaphore-db.container, not ContainerName=
