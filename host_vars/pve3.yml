ansible_host: 192.168.1.103
ansible_user: root
ansible_ssh_private_key_file: /root/.ssh/semaphore_ansible

# 10G mesh: this node's half of the direct-cabled triangle. Each port is one DAC cable to one peer,
# on its own /31 - the pair's subnet is also listed in group_vars/all.yml's pve_mesh_links, which
# pve_migrate_vm reads to pick the migration network. Applied by roles/pve_mesh.
pve_mesh_loopback: 10.10.20.3
pve_mesh_openfabric_net: 49.0000.0000.0003.00
pve_mesh_ports:
  - name: mesh0
    path: pci-0000:01:00.0
    peer: pve2
    address: 10.10.10.0/31
  - name: mesh1
    path: pci-0000:01:00.1
    peer: pve1
    address: 10.10.10.4/31

# Corosync node id. It must keep matching the id the running cluster already assigned to
# this node - configure-pve-corosync.yml refuses a run that would change the membership.
pve_corosync_nodeid: 3
