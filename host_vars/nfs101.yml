ansible_host: 192.168.1.130 # static IP assigned via phpIPAM by provision-vm.yml
ansible_user: deploy

# The data disk is large, so a move copies a lot: the optional rebalance leaves the VM where it is.
pve_rebalance_pinned: true

# The photos and videos of Immich (about 305 GB, still growing) and the other shares.
nfs_data_size_gb: 650
# The nodes of the Kubernetes test cluster: talos-cp101, talos-cp102, talos-cp103, talos-wk101, talos-wk102 and talos-wk103.
nfs_clients:
  - 192.168.1.124
  - 192.168.1.127
  - 192.168.1.113
  - 192.168.1.125
  - 192.168.1.126
  - 192.168.1.118
nfs_shares:
  - name: immich
  - name: paperless
  - name: homeassistant
  # The database of Prometheus (data), the state of Alertmanager and the copy of the nightly snapshot that is sent to the cloud
  # storage. They belong to nobody, the user of the images.
  - name: prometheus
    owner: "65534"
    group: "65534"
  # The configuration and the data of AdGuard Home.
  - name: adguard

# The databases of the applications of the cluster, one container each on the local disk, reached by the nodes alone.
postgres_instances:
  - name: paperless
    image: "{{ postgres_image }}"
    major: 18
    port: 5432
    database: paperless
    user: paperless
    clients: "{{ nfs_clients }}"
  - name: homeassistant
    image: "{{ postgres_image }}"
    major: 18
    port: 5433
    database: homeassistant
    user: homeassistant
    clients: "{{ nfs_clients }}"
  - name: grafana
    image: "{{ postgres_image }}"
    major: 18
    port: 5434
    database: grafana
    user: grafana
    clients: "{{ nfs_clients }}"
  # The database of the Semaphore of the cluster (semaphore-bck), not the one of semaphore103.
  - name: semaphore-bck
    image: "{{ postgres_image }}"
    major: 18
    port: 5436
    database: semaphore
    user: semaphore
    clients: "{{ nfs_clients }}"
  # Immich needs the vector extensions of its own image, which is still on Postgres 14.
  - name: immich
    image: "{{ immich_postgres_image }}"
    major: 14
    port: 5435
    database: immich
    user: immich
    initdb_args: --data-checksums
    shm_size: 128m
    clients: "{{ nfs_clients }}"

# The databases of the applications that moved to the cluster and need MariaDB, same arrangement as the Postgres ones.
mariadb_instances:
  - name: phpipam
    image: "{{ mariadb_image }}"
    port: 3306
    database: phpipam
    user: phpipam
    clients: "{{ nfs_clients }}"

podman_units:
  - name: mariadb_phpipam
    service_name: mariadb-phpipam
    scope: user
  - name: postgres_paperless
    service_name: postgres-paperless
    scope: user
  - name: postgres_homeassistant
    service_name: postgres-homeassistant
    scope: user
  - name: postgres_grafana
    service_name: postgres-grafana
    scope: user
  - name: postgres_immich
    service_name: postgres-immich
    scope: user
  - name: postgres_semaphore-bck
    service_name: postgres-semaphore-bck
    scope: user
health_check_podman_user: deploy
health_check_containers:
  - postgres_paperless
  - postgres_homeassistant
  - postgres_grafana
  - postgres_immich
  - postgres_semaphore-bck
  - mariadb_phpipam

# The share that the devices of the Aqara doorbell write their clips to, on a volume of its own, see "SMB share for the Aqara doorbell" in
# the README. The files are copied to the cloud storage with the others, below.
smb_allowed_hosts:
  - 192.168.1.30  # Doorbell Repeater, the chime that holds the storage
  - 192.168.1.31  # Doorbell
smb_data_size_gb: 30
# The names the doorbell was given when the share was on its own host.
smb_netbios_name: SMB101
smb_service_name: smb101
openscap_waived_rules:
  package_samba_removed: The host serves the SMB share the Aqara doorbell writes its clips to.
  service_avahi-daemon_disabled: Avahi announces the share to the doorbell devices, the only addresses mDNS is open to.

# The copies to the cloud storage (pcloud-backups.yml) read the shares where they are.
# The configuration of Home Assistant and the data of its Matter server, packed every night into a dated archive before the copy
# below, and kept 14 days here. The history is in a Postgres that this host dumps itself, the internal backups and the caches are
# left out.
config_archives:
  - name: homeassistant
    directory: /srv/nfs/homeassistant
    paths:
      - config
      - matter
    exclude:
      - config/backups
      - config/deps
      - config/tts
      - "config/home-assistant.log*"
      - "config/home-assistant_v2.db*"
      - "*/__pycache__"
    dest: /srv/backups/homeassistant
    keep_days: 14
  # The configuration of AdGuard Home (its settings, its filters and its rules). The query log and the statistics are left out.
  - name: adguard
    directory: /srv/nfs/adguard
    paths:
      - conf
    dest: /srv/backups/adguard
    keep_days: 14

pcloud_backup_jobs:
  - name: Immich Daniel
    mode: copy
    source: /srv/nfs/immich/library/ee67ced3-2998-420c-82b5-2768292c81ab/
    dest: "pcloud:Backups/Immich/Daniel"
  - name: Immich Marine
    mode: copy
    source: /srv/nfs/immich/library/1c98b908-3122-4969-b34a-e63b6a242994/
    dest: "pcloud:Backups/Immich/Marine"
  # The Aqara Home app deletes the clips from the share after the delay chosen there, 90 days; the copy to the cloud
  # storage never deletes anything. Files younger than 10 minutes may still be written, so they wait for the next run.
  - name: Aqara doorbell
    mode: copy
    source: /srv/aqara
    dest: "pcloud:Backups/Aqara"
    extra_args: "--min-age 10m"
  # The archives of the configuration are never deleted from the cloud storage by this copy.
  - name: Home Assistant configuration
    mode: copy
    source: /srv/backups/homeassistant
    dest: "pcloud:Backups/HomeAssistant"
  - name: AdGuard configuration
    mode: copy
    source: /srv/backups/adguard
    dest: "pcloud:Backups/AdGuard"
  # A mirror of the last snapshot: the blocks of the database never change once written, so only the new ones are sent.
  - name: Prometheus snapshot
    mode: sync
    source: /srv/nfs/prometheus/backup/latest
    dest: "pcloud:Backups/Prometheus"
