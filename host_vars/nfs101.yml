ansible_host: 192.168.1.130 # static IP assigned via phpIPAM by provision-vm.yml
ansible_user: deploy

# The data disk is large, so a move copies a lot: the optional rebalance leaves the VM where it is.
pve_rebalance_pinned: true

# The photos and videos of Immich (about 305 GB, still growing) and the other shares.
nfs_data_size_gb: 650
# The nodes of the Kubernetes test cluster: talos-cp101, talos-cp102, talos-cp103, talos-wk101, talos-wk102 and talos-wk103.
nfs_clients:
  - 192.168.1.124
  - 192.168.1.127
  - 192.168.1.113
  - 192.168.1.125
  - 192.168.1.126
  - 192.168.1.118
nfs_shares:
  - name: immich
    readers:
      - 192.168.1.123 # smb101, which copies the library to the cloud storage
  - name: paperless
  - name: homeassistant
    readers:
      - 192.168.1.123 # smb101, which archives the configuration every night and copies it to the cloud storage
    # The files of Home Assistant belong to root and its .storage folder is closed to the others: the export is read-only.
    readers_root_squash: false
  # The database of Prometheus (data), the state of Alertmanager and the copy of the nightly snapshot that smb101 sends to the cloud
  # storage. They belong to nobody, the user of the images, and smb101 reads them as nobody too.
  - name: prometheus
    owner: "65534"
    group: "65534"
    readers:
      - 192.168.1.123 # smb101, which sends the nightly snapshot to the cloud storage
  # The configuration and the data of AdGuard Home. The configuration file is private to its owner, which is root in the pod, so smb101
  # reads it without squashing root, to archive it every night.
  - name: adguard
    readers:
      - 192.168.1.123 # smb101, which archives the configuration and copies it to the cloud storage
    readers_root_squash: false

# The databases of the applications of the cluster, one container each on the local disk, reached by the nodes alone.
postgres_instances:
  - name: paperless
    image: "{{ postgres_image }}"
    major: 18
    port: 5432
    database: paperless
    user: paperless
    clients: "{{ nfs_clients }}"
  - name: homeassistant
    image: "{{ postgres_image }}"
    major: 18
    port: 5433
    database: homeassistant
    user: homeassistant
    clients: "{{ nfs_clients }}"
  - name: grafana
    image: "{{ postgres_image }}"
    major: 18
    port: 5434
    database: grafana
    user: grafana
    clients: "{{ nfs_clients }}"
  # Immich needs the vector extensions of its own image, which is still on Postgres 14.
  - name: immich
    image: "{{ immich_postgres_image }}"
    major: 14
    port: 5435
    database: immich
    user: immich
    initdb_args: --data-checksums
    shm_size: 128m
    clients: "{{ nfs_clients }}"

# The databases of the applications that moved to the cluster and need MariaDB, same arrangement as the Postgres ones.
mariadb_instances:
  - name: phpipam
    image: "{{ mariadb_image }}"
    port: 3306
    database: phpipam
    user: phpipam
    clients: "{{ nfs_clients }}"

podman_units:
  - name: mariadb_phpipam
    service_name: mariadb-phpipam
    scope: user
  - name: postgres_paperless
    service_name: postgres-paperless
    scope: user
  - name: postgres_homeassistant
    service_name: postgres-homeassistant
    scope: user
  - name: postgres_grafana
    service_name: postgres-grafana
    scope: user
  - name: postgres_immich
    service_name: postgres-immich
    scope: user
health_check_podman_user: deploy
health_check_containers:
  - postgres_paperless
  - postgres_homeassistant
  - postgres_grafana
  - postgres_immich
  - mariadb_phpipam
