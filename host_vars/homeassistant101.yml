ansible_host: 192.168.1.122 # static IP assigned via phpIPAM by provision-vm.yml
ansible_user: deploy

# The first start pulls about 1 GB and Home Assistant then migrates its data, so the default 5 retries
# over 50s would report a healthy first start as a failure.
health_check_retries: 30
health_check_delay: 10
health_check_url: "http://192.168.1.122:8123"
health_check_podman_user: root
health_check_containers:
  - homeassistant
  - matter-server

podman_units:
  - name: homeassistant
    scope: root
  - name: matter-server
    scope: root

# Thread and Matter need the router advertisements the CIS profile has the host ignore, see
# roles/homeassistant_configure.
openscap_waived_rules:
  sysctl_net_ipv6_conf_all_accept_ra: Thread and Matter devices are reached through routes announced in router advertisements.
  sysctl_net_ipv6_conf_default_accept_ra: Thread and Matter devices are reached through routes announced in router advertisements.

# BunkerWeb publishes Home Assistant as homeassistant.lecrivaindaniel.fr, see host_vars/bunkerweb101.yml.
homeassistant_trusted_proxies:
  - 192.168.1.114
