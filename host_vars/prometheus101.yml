ansible_host: 192.168.1.119 # static IP assigned via phpIPAM by provision-vm.yml
ansible_user: deploy

health_check_url: "http://192.168.1.119:9090/-/ready"
health_check_podman_user: root
health_check_containers:
  - prometheus
  - alertmanager
  - pve-exporter

podman_units:
  - name: prometheus
    scope: root
  - name: alertmanager
    scope: root
  - name: pve-exporter
    scope: root
