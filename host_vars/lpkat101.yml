ansible_host: 192.168.1.112 # explicit static IP, inventory-only change (nothing on lpkat101 itself is touched) - predates provision-vm.yml's convention of always setting this, connected by bare hostname until now, which is exactly what let a stale/wrong known_hosts entry under that name silently break automation

health_check_url: "https://192.168.1.112/"
health_check_validate_certs: false
health_check_retries: 30
health_check_delay: 10

# Left where it is by the optional cluster rebalance: 20G of memory and 250G of disks make any move
# costly for little balance gained. It is still migrated when its node is patched.
pve_rebalance_pinned: true
