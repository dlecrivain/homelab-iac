ansible_host: 192.168.1.112

health_check_url: "https://192.168.1.112/"
health_check_validate_certs: false
health_check_retries: 30
health_check_delay: 10

# Left where it is by the optional cluster rebalance: 20G of memory and 250G of disks make any move
# costly for little balance gained.
pve_rebalance_pinned: true

# Stopped, not migrated, while its node is patched: no other node has 20G of memory to spare. It is stopped
# once its node has installed its updates (it is the repository they come from), just before the reboot, and it
# starts again with the node. Katello needs minutes to stop its services.
pve_shutdown_for_maintenance: true
pve_shutdown_timeout: 600
